const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};

const verified=v=>fingerprints?v.classification==='Likely match':v.associations.some(t=>t.evidenceStatus==='BEHAVIOR_SUPPORTED');
const partially=v=>fingerprints?v.classification==='Partial match':!verified(v)&&v.associations.some(t=>t.evidenceStatus==='PARTIALLY_SUPPORTED');
const supported=t=>t&&(fingerprints?t.classification!=='No match':['BEHAVIOR_SUPPORTED','PARTIALLY_SUPPORTED'].includes(t.evidenceStatus));
function observation(v,m,t){const item=v.methods[m];if(!item?.observable)return{state:'unknown',context:0,root:0};const ids=fingerprints?Object.keys(item.tests):[...new Set([...v.associations,...v.similarityCandidates].map(t=>t.testId))];const x=t?(item.tests[t.testId]||{context:0,root:0}):ids.reduce((sum,id)=>{const n=item.tests[id]||{};return{context:sum.context+(n.context||0),root:sum.root+(n.root||0)};},{context:0,root:0});return{...x,state:x.context?(x.root?'mixed':'context'):x.root?'root':'unobserved'};}
function allReference(v){return{name:'All reference methods',methods:[...new Set(v.references.flatMap(r=>r.methods))],scope:'Union of reference methods across examples; not a required single execution path.',body:''};}
function executionCoverage(){const methods=new Map();for(const v of report.variants)for(const m of allReference(v).methods){const x=observation(v,m,null),prior=methods.get(m)||{context:0,root:0};methods.set(m,{context:prior.context+x.context,root:prior.root+x.root});}return{total:methods.size,hit:[...methods.values()].filter(x=>x.context+x.root>0).length,lit:[...methods.values()].filter(x=>x.context>0).length};}

function ranked(v){const unique=new Map();for(const t of [...v.associations,...v.similarityCandidates])if(!unique.has(t.testId))unique.set(t.testId,t);return [...unique.values()].sort((a,b)=>(fingerprints?(b.score||0)-(a.score||0):Number(supported(b))-Number(supported(a)))||Object.keys(v.methods).filter(m=>hit(v,m,b)).length-Object.keys(v.methods).filter(m=>hit(v,m,a)).length||a.testId.localeCompare(b.testId));}

function bar(c){const b=el('div',undefined,'bar'),total=Object.values(c).reduce((a,b)=>a+b,0)||1;for(const [s,n]of Object.entries(c))if(n){const p=el('span',undefined,s);p.style.width=100*n/total+'%';p.title=`${n} ${labels[s]}`;b.append(p);}return b;}

let selected=report.variants[0].id,testId='',referenceIndex=0,selectedStage='';
const navigationState={};
function choose(v){selectedStage='';selected=v.id;testId='';referenceIndex=-1;render();}
function action(v,t,c){if(fingerprints)return{title:v.classification==='No match'?'Extend scenario coverage':'Inspect execution match',why:t?`${c.context+c.root+c.mixed} reference methods hit.`:'Select a local test to inspect its stage coverage.'};if(!t)return{title:'Review behavior evidence',why:'Inspect the contributing tests and assertions; aggregate execution alone does not verify the behavior.'};if(!supported(t))return{title:'Verify this behavior',why:'Check whether this candidate’s assertions establish the behavior.'};if(c.unknown)return{title:'Check collection scope',why:'Some reference methods are outside the observer’s inventory.'};if(c.root||c.mixed||c.unobserved)return{title:'Review observations',why:'Investigate the differences against this test’s expectations.'};return{title:'Review test strength',why:'Check whether assertions cover the important outcomes.'};}

 const label=el('div');label.append(el('strong',title,'assessment-title'),el('small',`${coverage.hit} / ${coverage.total} reference methods hit across relevant tests · ${coverage.lit} with Context · ${total} declared behaviors${fingerprints?'':' · '+(report.evidenceBasis==='execution-anchors'?'static flow catalog':report.reviewStatus==='HUMAN_REVIEWED'?'reviewed source assessments':'draft source assessments')}`));

}

assessment();
const cov=report.runCoverage;$('stats').textContent=`${report.variants.filter(v=>!v.id.startsWith('candidate.')).length} behaviors · ${report.variants.filter(v=>v.id.startsWith('candidate.')).length} candidate families · ${report.testExecution.passed} tests passed · ${report.testExecution.skipped} skipped · ${(100*cov.observed/(cov.inventory||1)).toFixed(1)}% of selected methods executed`;
if(report.catalogNavigation){$('behaviors').closest('.panel').querySelector('.table-head').hidden=true;PharosNavigation.render({report,host:$('behaviors'),state:navigationState,selected,choose,row:behaviorRow,el,verified,partially});}
else{$('behaviors').closest('.panel').querySelector('.table-head').hidden=false;$('behaviors').replaceChildren();for(const v of report.variants)$('behaviors').append(behaviorRow(v));}
const v=report.variants.find(v=>v.id===selected),ts=ranked(v),t=ts.find(t=>t.testId===testId),r=referenceIndex<0?allReference(v):v.references[referenceIndex],c=count(v,r,t),next=action(v,t,c),host=$('detail');host.replaceChildren();host.append(el('div','Selected behavior','eyebrow'),el('h2',v.name),el('p',v.trigger+' '+v.expected,'description'));
const choice=el('div',undefined,'test-choice');if(ts.length){const label=el('label','Execution scope');label.htmlFor='test-select';const select=el('select');select.id='test-select';const aggregate=el('option',`All ${ts.length} relevant tests · aggregate`);aggregate.value='';select.append(aggregate);for(const item of ts){const o=el('option',`${fingerprints?allReference(v).methods.filter(m=>hit(v,m,item)).length+' / '+allReference(v).methods.length+' methods hit':supported(item)?'Assessed':(item.evidenceStatus==='EXECUTION_ANCHORS_ONLY'?'Execution':'Possible')} · ${item.name} · ${item.suite.split('.').pop()} / ${item.target}`);o.value=item.testId;select.append(o);}select.value=testId;select.onchange=()=>{selectedStage='';testId=select.value;referenceIndex=testId?bestReference(v,ts.find(t=>t.testId===testId)):-1;render();};const note=el('p',fingerprints?(t?`${allReference(v).methods.filter(m=>hit(v,m,t)).length} / ${allReference(v).methods.length} reference methods hit`:'Aggregate execution across matching local tests.'):!t?'Aggregate union · green means Context was seen in at least one contributing test. This does not verify the behavior.':supported(t)?'Assertions inspected · support is limited to what this test checks.':t?.evidenceStatus==='EXECUTION_ANCHORS_ONLY'?'Execution anchors matched · assertions have not been assessed.':'Possible match · similar execution; behavior needs verification.','muted');note.id='match-note';choice.append(label,select,note);}else{choice.append(el('p','No matching test identified. The reference below provides a starting point for investigation.','empty'));}host.append(choice);
