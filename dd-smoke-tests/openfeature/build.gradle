plugins {
  id 'dd-trace-java.smoke-test-app'
  id 'dd-trace-java.module.smoke-test'
}

description = 'Open Feature provider Smoke Tests.'

testJvmConstraints {
  minJavaVersion = JavaVersion.VERSION_11
}

smokeTestApp {
  gradleApp {
    taskName = 'bootJar'
    artifactPath = 'libs/openfeature-smoketest.jar'
    sysProperty = 'datadog.smoketest.springboot.shadowJar.path'
  }
  projectJar('featureFlaggingApiJar', project(':dd-openfeature'))
}

dependencies {
  testImplementation project(':dd-smoke-tests:smoke-test-common')
}

// The shared FFE fixtures belong to dd-openfeature: copy the files these tests read.
tasks.named('processTestResources', ProcessResources) {
  from(rootProject.file('dd-openfeature/src/test/fixtures')) {
    include 'ffe-system-test-data/ufc-config.json'
    include 'ffe-system-test-data/evaluation-cases/**'
  }
}

spotless {
  java {
    target "**/*.java"
  }

  groovyGradle {
    target '*.gradle', "**/*.gradle"
  }
}
