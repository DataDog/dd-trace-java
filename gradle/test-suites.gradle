import org.gradle.api.plugins.jvm.JvmTestSuite

// Registers a test suite named 'testSuiteName' compiling 'src/<dirName>/', with configurations
// extending the 'parentSuiteName' suite ones.
//
// Unless the suite itself is a forked one, its '*ForkedTest' classes run in a companion forked task
// registered by addForkedTestTask. Pass 'withForkedTest = false' only when the module declares its own
// forked suite under the companion name, compiling different sources, or when the suite forked tests
// must not run.
ext.addTestSuiteExtendingForDir = { String testSuiteName, String parentSuiteName, String dirName, boolean withForkedTest = true ->
  def isForkedSuite = testSuiteName.endsWith('ForkedTest')
  testing {
    suites {
      register(testSuiteName, JvmTestSuite) {
        sources {
          java {
            srcDirs = ["src/$dirName/java"]
          }
          resources {
            srcDirs = ["src/$dirName/resources"]
          }
          if (project.plugins.hasPlugin('groovy')) {
            groovy {
              srcDirs = ["src/$dirName/groovy"]
            }
          }
          if (project.plugins.hasPlugin('kotlin')) {
            kotlin {
              srcDirs = ["src/$dirName/kotlin"]
            }
          }
          if (project.plugins.hasPlugin('scala')) {
            scala {
              srcDirs = ["src/$dirName/scala"]
            }
          }
        }
      }
    }
  }

  configurations {
    def extendConf = { suffix ->
      def config = named("${testSuiteName}${suffix}")
      def parentConfig = named("${parentSuiteName}${suffix}")
      if (parentConfig.present) {
        config.configure {
          extendsFrom(parentConfig.get())
        }
      }

      if (isForkedSuite) {
        def nonForkedBaseConfName = testSuiteName - ~/Forked/
        def nonForkedConfig = maybeCreate("${nonForkedBaseConfName}${suffix}")
        config.configure {
          extendsFrom(nonForkedConfig)
        }
      }
    }

    extendConf('CompileOnly')
    extendConf('Implementation')
    extendConf('RuntimeOnly')
    extendConf('AnnotationProcessor')
  }

  tasks.register("${testSuiteName}Jar", Jar) {
    dependsOn(tasks.named("${testSuiteName}Classes"))
    from(sourceSets.named(testSuiteName).map { it.output })
    archiveClassifier = testSuiteName
  }

  // The project dependency definition cannot sit inside previous blocks. As of Gradle 8.8, configurations cannot be mutated after they have been used as part of the dependency graph.
  // See: https://docs.gradle.org/current/userguide/upgrading_version_8.html#mutate_configuration_after_locking
  // And related issue: https://github.com/gradle/gradle/issues/28867
  project.dependencies {
    "${testSuiteName}Implementation"(project(project.path))
  }

  if (withForkedTest && !isForkedSuite) {
    ext.addForkedTestTask(testSuiteName)
  }
}

ext.addTestSuiteForDir = { testSuiteName, dirName, boolean withForkedTest = true ->
  ext.addTestSuiteExtendingForDir(testSuiteName, 'test', dirName, withForkedTest)
}

ext.addTestSuite = { testSuiteName, boolean withForkedTest = true ->
  ext.addTestSuiteForDir(testSuiteName, testSuiteName, withForkedTest)
}

// Registers a task that runs the '*ForkedTest' classes of a source set, each in its own JVM.
//
// The task name ends in 'ForkedTest', which is what makes the test convention plugin restrict it to
// '**/*ForkedTest*', set forkEvery=1 and apply the shared forked-test concurrency limit. 'check',
// 'allTests' and 'allLatestDepTests' pick the task up automatically, because they match Test tasks
// by type rather than by name. Without '*ForkedTest' classes, the task is skipped as having no source.
//
// The task is named after the source set, with its 'Test' suffix replaced: 'test' registers
// 'forkedTest' and 'latestDepTest' registers 'latestDepForkedTest'. It runs on the same JVMs as the
// source set test task, as it inherits its test JVM constraints.
//
// java_no_deps.gradle registers 'forkedTest' for the default 'test' source set, and
// addTestSuiteExtendingForDir registers one for each suite.
//
// Returns the TaskProvider so callers can configure the task further.
ext.addForkedTestTask = { String sourceSetName ->
  def taskName = sourceSetName == 'test' ? 'forkedTest' : "${sourceSetName - ~/Test\z/}ForkedTest"
  def suiteConstraints = tasks.named(sourceSetName, Test).map { it.extensions.getByName('testJvmConstraints') }
  return tasks.register(taskName, Test) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = "Runs the '*ForkedTest' classes of the '${sourceSetName}' source set, each in its own JVM."
    useJUnitPlatform()
    testClassesDirs = sourceSets[sourceSetName].output.classesDirs
    classpath = sourceSets[sourceSetName].runtimeClasspath
    extensions.configure('testJvmConstraints') { constraints ->
      constraints.minJavaVersion.convention(suiteConstraints.flatMap { it.minJavaVersion })
      constraints.maxJavaVersion.convention(suiteConstraints.flatMap { it.maxJavaVersion })
      constraints.forceJdk.convention(suiteConstraints.flatMap { it.forceJdk })
      constraints.includeJdk.convention(suiteConstraints.flatMap { it.includeJdk })
      constraints.excludeJdk.convention(suiteConstraints.flatMap { it.excludeJdk })
      constraints.allowReflectiveAccessToJdk.convention(suiteConstraints.flatMap { it.allowReflectiveAccessToJdk })
      constraints.nativeImageCapable.convention(suiteConstraints.flatMap { it.nativeImageCapable })
    }
  }
}
