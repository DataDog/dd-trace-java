  def isRootProject = project == project.rootProject
  groovyGradle {
    toggleOffOn()
    // same as groovy, but for .gradle (defaults to '*.gradle')
    if (isRootProject) {
      // only do this for the root project since the instrumentation project has a subproject and directory named gradle
      // that will confuse task dependencies
      target '*.gradle', 'gradle/**/*.gradle'
    } else {
      target '*.gradle'
    }
    greclipse(libs.versions.greclipse.get()).configFile(configPath + '/enforcement/spotless-groovy.properties')
    custom 'forbidGradleJavaScriptPlugin', forbidLegacyScriptApplyStep
  }

  kotlinGradle {
    toggleOffOn()
    // same as kotlin, but for .gradle.kts files (defaults to '*.gradle.kts')
    target '*.gradle.kts'
    ktlint(libs.versions.ktlint.get()).editorConfigOverride([
      // Disable trailing comma rules to minimize diff.
      'ktlint_standard_trailing-comma-on-call-site': 'disabled',
      'ktlint_standard_trailing-comma-on-declaration-site': 'disabled'
    ])
    custom 'forbidGradleJavaScriptPlugin', forbidLegacyScriptApplyStep
  }

  project.pluginManager.withPlugin('groovy') {
    groovy {
      toggleOffOn()
      if (!groovySkipJavaExclude) {
        excludeJava() // excludes all Java sources within the Groovy source dirs from formatting
        // the Groovy Eclipse formatter extends the Java Eclipse formatter,
        // so it formats Java files by default (unless `excludeJava` is used).
      }
      targetExclude(buildDirectory)
      greclipse(libs.versions.greclipse.get()).configFile(configPath + '/enforcement/spotless-groovy.properties')
    }
  }

  project.pluginManager.withPlugin('scala') {
    scala {
      toggleOffOn()
      targetExclude(buildDirectory)
      scalafmt(libs.versions.scalafmt.get()).configFile(configPath + '/enforcement/spotless-scalafmt.conf')
    }
  }

  format 'markdown', {
    toggleOffOn()
    target '*.md', '.github/**/*.md', 'src/**/*.md', 'application/**/*.md'
    leadingTabsToSpaces()
    endWithNewline()
  }

  format 'misc', {
    toggleOffOn()
    target '.gitignore', '*.sh', 'tooling/*.sh', '.gitlab/*.sh'
    leadingTabsToSpaces()
    trimTrailingWhitespace()
    endWithNewline()
  }

  project.pluginManager.withPlugin('kotlin') {
    kotlin {
      toggleOffOn()
      targetExclude(buildDirectory)
      ktlint(libs.versions.ktlint.get()).editorConfigOverride([
        // Disable trailing comma rules to minimize diff.
        'ktlint_standard_trailing-comma-on-call-site': 'disabled',
        'ktlint_standard_trailing-comma-on-declaration-site': 'disabled'
      ])
    }
  }
}


tasks.register('formatCode') {
  dependsOn 'spotlessApply'
}
tasks.named("check") {
  dependsOn 'spotlessCheck'
}
