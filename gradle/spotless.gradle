apply plugin: 'com.diffplug.spotless'

// This definition is needed since the spotless file is used from stand alone projects
def configPath = rootProject.hasProperty('sharedConfigDirectory') ? sharedConfigDirectory : project.rootProject.rootDir.path + '/gradle'
// This is necessary for some projects that set a special groovy target which can't coexist with excludeJava
boolean groovySkipJavaExclude = project.hasProperty('groovySkipJavaExclude') ? groovySkipJavaExclude : false

def buildDirectory = project.layout.buildDirectory

def scriptApplyExceptions = [
  'gradle/publish.gradle': [':dd-java-agent'] as Set,
]
boolean forbidLegacyScriptApplies = project.rootProject.name == 'dd-trace-java'
def legacyScriptApplyLinePattern = ~/^\s*(?:\w+\.)?apply(?:\s+from\s*:|\s*\(\s*from\s*=).*/
// Script plugins that must be replaced by their corresponding convention plugins.
def forbiddenScriptApplies = [
  'gradle/java.gradle'   : 'Apply the \'dd-trace-java.conventions.java\' convention plugin instead of applying the script plugin \'gradle/java.gradle\' directly.',
  'gradle/publish.gradle': 'Apply the \'dd-trace-java.module.distributable.*\' convention plugin instead of applying the script plugin \'gradle/publish.gradle\' directly.',
]
def forbidLegacyScriptApplyStep = { String text ->
  if (forbidLegacyScriptApplies) {
    text.readLines().each { line ->
      if (legacyScriptApplyLinePattern.matcher(line).matches()) {
        forbiddenScriptApplies.each { script, message ->
          if (line.contains(script) && !scriptApplyExceptions.getOrDefault(script, []).contains(project.path)) {
            throw new AssertionError(message)
          }
        }
      }
    }
  }
  text
}

spotless {
  if (rootProject.hasProperty('skipSpotless')) {
    project.logger.quiet("Retiring 'skipSpotless' property, prefer '-x spotlessCheck' or '-x spotlessApply' to exclude spotless tasks.")
    // Spotless in JDK 8 uses an older eclipse formatter, and it has a (flaky) bug crashing check_profiling.
    // We disable it in CI, since we have a job dedicated to spotless anyway.
    enforceCheck false
  }

  project.pluginManager.withPlugin('java') {
    java {
      toggleOffOn()
      // set explicit target to workaround https://github.com/diffplug/spotless/issues/1163
      target 'src/**/*.java'
