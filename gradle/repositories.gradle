repositories {
  mavenLocal()
  if (project.rootProject.name != "dd-trace-java" && project.rootProject.name != "buildSrc") {
    logger.lifecycle("Using maven repository proxy: " + project.rootProject.findProperty("mavenRepositoryProxy"))
  }
  if (project.rootProject.hasProperty("mavenRepositoryProxy")) {
    maven {
      url project.rootProject.property("mavenRepositoryProxy")
      allowInsecureProtocol = true
    }
  }
  // TODO: temporary fix for Maven Central rate limiting
  else {
    mavenCentral()
  }
  // add maven central repository for snapshot dependencies
  maven {
    content {
      includeGroup "com.datadoghq"
      includeGroup "io.sqreen"
    }
    mavenContent {
      snapshotsOnly()
    }
    // see https://central.sonatype.org/publish/publish-portal-snapshots/#consuming-via-gradle
    url = 'https://central.sonatype.com/repository/maven-snapshots/'
  }
  maven {
    url = 'https://packages.confluent.io/maven/'
    content {
      includeGroupAndSubgroups "io.confluent"
      includeGroupAndSubgroups "org.apache.kafka"
    }
  }
  maven {
    url = 'https://repo.spring.io/milestone'
    content {
      includeGroupAndSubgroups "org.springframework"
    }
  }
  // Hosts gradle-tooling-api, used by build-logic:smoke-test-app to run nested
  // Gradle builds for smoke-test applications pinned to older Gradle versions.
  maven {
    url = 'https://repo.gradle.org/gradle/libs-releases'
    content {
      includeGroup "org.gradle"
    }
  }
  // Prebuilt WASM remote-config AOT artifact (machine classes + host library),
  // built and published from the libdatadog repository; content-filtered to this one group.
  // CI has no general maven egress (only the proxy above), so the artifact resolves
  // from the maven-dist git submodule, delivered by the same git fetch that checks
  // out the repository; the GitHub Pages URL is the fallback for clones without
  // submodules. Gradle tries them in order.
  if (file("$rootDir/remote-config/remote-config-wasm/maven-dist/io").exists()) {
    maven {
      url = "$rootDir/remote-config/remote-config-wasm/maven-dist"
      content {
        includeGroup "io.github.bantonsson"
      }
    }
  }
  maven {
    url = 'https://bantonsson.github.io/dd-remote-config-wasm-aot/'
    content {
      includeGroup "io.github.bantonsson"
    }
  }
}
