plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = 'org.apache.ignite'
    module = 'ignite-core'
    versions = "[2.0.0,2.17.0)"
  }
  // ignite-core 2.17.0 is compiled with Java 11
  pass {
    group = 'org.apache.ignite'
    module = 'ignite-core'
    versions = "[2.17.0,3)"
    javaVersion = 11
  }
}

addTestSuiteForDir('latestDepTest', 'test')
addTestSuiteExtendingForDir('latestDepForkedTest', 'latestDepTest', 'test')
// ignite 2.16.0 latest version compatible with Java 8
addTestSuiteForDir('ignite216Test', 'test')
addTestSuiteExtendingForDir('ignite216ForkedTest', 'ignite216Test', 'test')

dependencies {
  compileOnly group: 'org.apache.ignite', name: 'ignite-core', version: '2.0.0'

  testImplementation group: 'org.apache.ignite', name: 'ignite-core', version: '2.0.0'
  testImplementation group: 'org.apache.ignite', name: 'ignite-indexing', version: '2.0.0'

  ignite216TestImplementation group: 'org.apache.ignite', name: 'ignite-core', version: '2.16.0'
  ignite216TestImplementation group: 'org.apache.ignite', name: 'ignite-indexing', version: '2.16.0'

  latestDepTestImplementation group: 'org.apache.ignite', name: 'ignite-core', version: '2.+'
  latestDepTestImplementation group: 'org.apache.ignite', name: 'ignite-indexing', version: '2.+'
}

for (taskName in ['compileLatestDepTestGroovy', 'compileLatestDepForkedTestGroovy']) {
  tasks.named(taskName, GroovyCompile) {
    configureCompiler(it, JavaVersion.VERSION_11)
  }
}

tasks.withType(Test).configureEach {
  def latestDep = it.name.startsWith('latestDep')
  testJvmConstraints {
    if (latestDep) {
      // ignite 2.17.0+ requires Java 11+
      minJavaVersion = JavaVersion.VERSION_11
    } else {
      // ignite 2.16.0 latest version compatible with Java 8
      maxJavaVersion = JavaVersion.VERSION_1_8
    }
  }
}

// See https://ignite.apache.org/docs/latest/quick-start/java#running-ignite-with-java-11-or-later
final igniteJava11Opens = [
  'java.base/jdk.internal.access',
  'java.base/jdk.internal.misc',
  'java.base/sun.nio.ch',
  'java.base/sun.util.calendar',
  'java.management/com.sun.jmx.mbeanserver',
  'jdk.internal.jvmstat/sun.jvmstat.monitor',
  'java.base/sun.reflect.generics.reflectiveObjects',
  'jdk.management/com.sun.management.internal',
  'java.base/java.io',
  'java.base/java.nio',
  'java.base/java.net',
  'java.base/java.util',
  'java.base/java.util.concurrent',
  'java.base/java.util.concurrent.locks',
  'java.base/java.util.concurrent.atomic',
  'java.base/java.lang',
  'java.base/java.lang.invoke',
  'java.base/java.math',
  'java.sql/java.sql',
  'java.base/java.lang.reflect',
  'java.base/java.time',
  'java.base/java.text',
  'java.management/sun.management'
]

for (taskName in ['latestDepTest', 'latestDepForkedTest']) {
  tasks.named(taskName, Test) {
    jvmArgs(igniteJava11Opens.collect { "--add-opens=${it}=ALL-UNNAMED" })
  }
}
