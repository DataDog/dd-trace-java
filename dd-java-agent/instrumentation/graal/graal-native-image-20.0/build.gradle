plugins {
  id 'dd-trace-java.module.instrumentation'
  id 'idea'
}

muzzle {
  pass {
    group = "org.graalvm.nativeimage"
    module = "svm"
    versions = "[20,)"
  }
}

tracerJava {
  addSourceSetFor(JavaVersion.VERSION_11)
}

["compileMain_java11Java", "compileTestJava"].each {
  tasks.named(it, JavaCompile) {
    configureCompiler(it, 25, JavaVersion.VERSION_11, "Uses --add-exports to access jdk.internal.vm.ci, which is incompatible with --release")
    it.options.compilerArgs.addAll([
      '-Xlint:all,-processing,-options,-path',
      '--add-modules',
      'jdk.internal.vm.ci',
      '--add-exports',
      'jdk.internal.vm.ci/jdk.vm.ci.meta=ALL-UNNAMED'
    ])
  }
}

dependencies {
  compileOnly project(':dd-java-agent:agent-logging')
  compileOnly project(':dd-java-agent:agent-installer')

  main_java11CompileOnly group: 'org.graalvm.nativeimage', name: 'svm', version: '20.0.0'

  muzzleBootstrap project(path: ':dd-java-agent:agent-installer') // to see TracerActivation
}

tasks.named("forbiddenApisMain_java11") {
  failOnMissingClasses = false
}

idea {
  module {
    jdkName = '11'
  }
}
