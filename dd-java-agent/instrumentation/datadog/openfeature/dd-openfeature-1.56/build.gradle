plugins {
  id 'dd-trace-java.module.instrumentation'
  id 'idea'
}

idea {
  module {
    jdkName = '11'
  }
}

// The providers released before the SDK bridge, linked to the agent bootstrap API it removed.
muzzle {
  pass {
    group = 'com.datadoghq'
    module = 'dd-openfeature'
    versions = '[1.56.0,1.69.0)'
  }
}

tracerJava {
  addSourceSetFor(JavaVersion.VERSION_11)
}

testJvmConstraints {
  minJavaVersion = JavaVersion.VERSION_11
}

// Load a released provider in its own classloader, as an application does.
def legacySdkDependency = configurations.dependencyScope('legacySdkDependency')
def legacySdk = configurations.resolvable('legacySdk') {
  extendsFrom legacySdkDependency.get()
  transitive = false
}.get()

dependencies {
  add('legacySdkDependency', 'com.datadoghq:dd-openfeature:1.67.0')
  main_java11CompileOnly 'com.datadoghq:dd-openfeature:1.56.0'

  testImplementation 'dev.openfeature:sdk:1.20.1'
}

tasks.named("compileMain_java11Java", JavaCompile) {
  configureCompiler(it, JavaVersion.VERSION_11)
}

tasks.named("compileTestJava", JavaCompile) {
  configureCompiler(it, JavaVersion.VERSION_11)
}

tasks.named('processTestResources', ProcessResources) {
  from(legacySdk) {
    into 'legacy-sdk'
  }
}
