plugins {
  id 'dd-trace-java.instrumentation.testing-framework-tests'
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = 'io.cucumber'
    module = 'cucumber-junit'
    versions = '[5.4.0,)'
  }
}

addTestSuiteForDir('latest7Test', 'test')
addTestSuiteForDir('latestDepTest', 'test')

dependencies {
  implementation project(':dd-java-agent:instrumentation:junit:junit-4:junit-4.10')
  compileOnly group: 'io.cucumber', name: 'cucumber-junit', version: '5.4.0'

  testImplementation project(':dd-java-agent:agent-ci-visibility:civisibility-instrumentation-test-fixtures')

  // version used below is not the minimum one that we support,
  // but the tests need to use it in order to be compliant with Spock 2.x
  testImplementation(group: 'junit', name: 'junit') {
    version {
      strictly '4.13.2'
    }
  }

  testImplementation group: 'io.cucumber', name: 'cucumber-java', version: '5.4.0'
  testImplementation group: 'io.cucumber', name: 'cucumber-junit', version: '5.4.0'
  testImplementation libs.jackson.databind

  latestDepTestImplementation group: 'io.cucumber', name: 'cucumber-java', version: '+'
  latestDepTestImplementation group: 'io.cucumber', name: 'cucumber-junit', version: '+'

  latest7TestImplementation group: 'io.cucumber', name: 'cucumber-java', version: '7.+'
  latest7TestImplementation group: 'io.cucumber', name: 'cucumber-junit', version: '7.+'
}

// cucumber 8.0.0+ requires Java 17
tasks.named("latestDepTest", Test) {
  testJvmConstraints {
    minJavaVersion = JavaVersion.VERSION_17
  }
}
