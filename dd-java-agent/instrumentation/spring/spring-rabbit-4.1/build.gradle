
muzzle {
  pass {
    group = 'org.springframework.amqp'
    module = 'spring-rabbit'
    versions = '[4.1.0,)'
    extraDependency 'com.rabbitmq:amqp-client:5.20.0'
  }
}

apply from: "$rootDir/gradle/java.gradle"

addTestSuiteForDir('latestDepTest', 'test')

dependencies {
  compileOnly group: 'org.springframework.amqp', name: 'spring-rabbit', version: '4.1.0'
  compileOnly group: 'org.springframework.amqp', name: 'spring-amqp', version: '4.1.0'

  // Include the sibling version module for mutual exclusion testing
  testImplementation project(':dd-java-agent:instrumentation:spring:spring-rabbit-1.5')
  testImplementation project(':dd-java-agent:instrumentation:datadog:tracing:trace-annotation')
  testImplementation project(':dd-java-agent:instrumentation:rabbitmq-amqp-2.7')

  testImplementation group: 'org.testcontainers', name: 'rabbitmq', version: libs.versions.testcontainers.get()
  // spring-boot-starter-amqp 3.4.0 pulls in spring-rabbit 3.2.x which is the first Spring Boot 3.x
  // line that transitively depends on spring-amqp/spring-rabbit 4.x APIs used by this module.
  // However, spring-rabbit 4.1.0 requires Spring Boot 4.x; we depend directly on spring-rabbit 4.1.0
  // and spring-boot-starter-amqp 4.0.0 to exercise the correct API surface.
  testImplementation group: 'org.springframework.amqp', name: 'spring-rabbit', version: '4.1.0'
  testImplementation group: 'org.springframework.amqp', name: 'spring-amqp', version: '4.1.0'
  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-amqp', version: '4.0.0'
  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: '4.0.0'

  latestDepTestImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-amqp', version: '4.+'
}

tasks.withType(Test).configureEach {
  usesService(testcontainersLimit)
  environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
}
