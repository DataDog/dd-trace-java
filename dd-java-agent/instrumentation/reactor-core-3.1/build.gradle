plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = "io.projectreactor"
    module = "reactor-core"
    versions = "[3.1.0.RELEASE,)"
  }
}

addTestSuite('latestDepTest')

dependencies {
  compileOnly group: 'io.projectreactor', name: 'reactor-core', version: '3.1.0.RELEASE'


  testImplementation project(':dd-java-agent:instrumentation:datadog:tracing:trace-annotation')
  testImplementation project(':dd-java-agent:instrumentation:reactive-streams-1.0')
  testImplementation project(path: ':dd-java-agent:agent-otel:otel-bootstrap', configuration: 'shadow')
  testImplementation project(':dd-java-agent:instrumentation:opentelemetry:opentelemetry-1.4')
  testImplementation project(':dd-java-agent:instrumentation:opentelemetry:opentelemetry-annotations-1.20')
  testImplementation project (':dd-java-agent:instrumentation:opentracing:opentracing-0.32')

  testImplementation group: 'io.projectreactor', name: 'reactor-core', version: '3.1.0.RELEASE'
  testImplementation group: 'io.opentelemetry.instrumentation', name: 'opentelemetry-instrumentation-annotations', version: '1.28.0'
  testImplementation group: 'io.opentracing', name: 'opentracing-util', version: '0.32.0'

  latestDepTestImplementation group: 'io.projectreactor', name: 'reactor-core', version: '+'
  // Looks like later versions on reactor need this dependency for some reason even though it is marked as optional.
  latestDepTestImplementation group: 'io.micrometer', name: 'micrometer-core', version: '1.+'
}

// Both modules have the same order(), so they are applied in the order their services entries are
// read: the agent jar lists reactive-streams first, so on a subscribe its advice runs first. Tests
// read the services files in classpath order, where this module's own classes come first, so put
// the reactive-streams jar first to test the order that ships.
tasks.withType(Test).configureEach {
  def testClasspath = classpath
  def isReactiveStreams = { File file -> file.name.startsWith('reactive-streams-1.0-') }
  classpath = testClasspath.filter(isReactiveStreams) + testClasspath.filter { !isReactiveStreams(it) }
}
