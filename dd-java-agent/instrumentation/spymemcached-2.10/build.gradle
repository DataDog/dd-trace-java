plugins {
  id 'dd-trace-java.module.instrumentation'
  id 'dd-trace-java.testcontainers'
}

muzzle {
  pass {
    group = "net.spy"
    module = 'spymemcached'
    versions = "[2.10.4,)"
    assertInverse = true
  }
}

addTestSuiteForDir('latestDepTest', 'test')
addTestSuiteExtendingForDir('latestDepForkedTest', 'latestDepTest', 'test')

tasks.named("latestDepTest", Test) {
  finalizedBy 'latestDepForkedTest'
}

dependencies {
  compileOnly group: 'net.spy', name: 'spymemcached', version: '2.10.4'
  testContainerImage(image('library/memcached:1.6.14-alpine', 'test.memcached.image'))

  testImplementation group: 'net.spy', name: 'spymemcached', version: '2.10.4'
  testImplementation libs.testcontainers

  latestDepTestImplementation group: 'net.spy', name: 'spymemcached', version: '+'
}

tasks.withType(Test).configureEach {
  usesService(testcontainersLimit)
}
