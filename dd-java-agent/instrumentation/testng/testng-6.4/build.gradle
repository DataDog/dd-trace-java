plugins {
  id 'java-test-fixtures'
  id 'dd-trace-java.instrumentation.testing-framework-tests'
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = 'org.testng'
    module = 'testng'
    versions = '[6.4,7.0.0)'
    skipVersions += "6.13" // depends on non-existent jcommander-1.66
  }
}

// TestNG 6.9.10 returns empty result names for class-level @Test annotations.
addTestSuiteForDir('testng6910Test', 'test')
addTestSuiteForDir('latestDepTest', 'test')

dependencies {
  compileOnly group: 'org.testng', name: 'testng', version: '6.4'

  implementation project(':dd-java-agent:instrumentation:testng:testng-common')

  testImplementation testFixtures(project(':dd-java-agent:instrumentation:testng:testng-common'))
  testImplementation group: 'org.testng', name: 'testng', version: '6.4'
  testng6910TestImplementation group: 'org.testng', name: 'testng', version: '6.9.10'
  latestDepTestImplementation group: 'org.testng', name: 'testng', version: '6.+'
}

// gradle can't downgrade the testng dependencies with `strictly`
// and IntelliJ IDEA reports an error when importing the project
configurations.matching({ it.name.startsWith('test') }).configureEach({
  def testNGVersion = name.startsWith('testng6910Test') ? '6.9.10' : '6.4'
  it.resolutionStrategy {
    force group: 'org.testng', name: 'testng', version: testNGVersion
  }
})

