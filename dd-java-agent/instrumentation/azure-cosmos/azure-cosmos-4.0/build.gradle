plugins {
  id 'dd-trace-java.module.instrumentation'
  id 'dd-trace-java.instrumentation.netty-concurrent-tests'
  id 'dd-trace-java.testcontainers'
}

muzzle {
  pass {
    group = 'com.azure'
    module = 'azure-cosmos'
    versions = '[4.0.1,)'
  }
}

addTestSuiteForDir('latestDepTest', 'test')

dependencies {
  compileOnly group: 'com.azure', name: 'azure-cosmos', version: '4.0.1'

  // The Linux emulator image only ships for amd64.
  testContainerImage(image('mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:2.14.28', 'test.cosmosdb.image'))

  testImplementation group: 'com.azure', name: 'azure-cosmos', version: '4.0.1'
  testImplementation group: 'org.testcontainers', name: 'azure', version: libs.versions.testcontainers.get()
  testImplementation project(':dd-java-agent:instrumentation:reactor-core-3.1')
  testImplementation project(':dd-java-agent:instrumentation:reactive-streams-1.0')
  // gateway mode talks HTTP through reactor-netty: load those instrumentations to catch nested
  // HTTP client spans, as the agent would in production
  testImplementation project(':dd-java-agent:instrumentation:netty:netty-4.1')
  testImplementation project(':dd-java-agent:instrumentation:reactor-netty-1.0')

  latestDepTestImplementation group: 'com.azure', name: 'azure-cosmos', version: '4.+'
}

tasks.withType(Test).configureEach {
  usesService(testcontainersLimit)
}
