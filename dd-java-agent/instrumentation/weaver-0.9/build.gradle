plugins {
  id 'dd-trace-java.instrumentation.testing-framework-tests'
  id 'dd-trace-java.module.instrumentation'
  id 'scala'
}

muzzle {
  ['2.12', '2.13'].each { scalaVersion ->
    pass {
      group = 'com.disneystreaming'
      module = "weaver-cats_${scalaVersion}"
      versions = '[0.8.4,)'
    }
    pass {
      group = 'org.typelevel'
      module = "weaver-cats_${scalaVersion}"
      versions = '[0.9.0,)'
    }
  }
  pass {
    group = 'com.disneystreaming'
    module = 'weaver-cats_3'
    versions = '[0.8.4,)'
  }

  pass {
    group = 'org.typelevel'
    module = 'weaver-cats_3'
    versions = '[0.9.0,)'
  }
}

addTestSuiteForDir('latestDepTest', 'latestDepTest')
// weaver 0.8.4 is the earliest supported version before the org migration
addTestSuiteForDir('weaver084Test', 'test')
// 0.10.1 is the last release exposing native custom string tags.
addTestSuiteForDir('weaver010Test', 'test')

dependencies {
  compileOnly group: 'org.typelevel', name: 'weaver-cats_3', version: '0.9.0'
  // Weaver is published for Scala > 2.12
  compileOnly group: 'org.scala-lang', name: 'scala-library', version: '2.12.20'

  testImplementation project(':dd-java-agent:agent-ci-visibility:civisibility-instrumentation-test-fixtures')

  testImplementation group: 'org.scala-lang', name: 'scala-library', version: '2.12.20'
  testImplementation group: 'org.typelevel', name: 'weaver-cats_3', version: '0.9.0'
  latestDepTestImplementation group: 'org.typelevel', name: 'weaver-cats_3', version: '+'
  weaver084TestImplementation group: 'com.disneystreaming', name: 'weaver-cats_3', version: '0.8.4'
  weaver010TestImplementation group: 'org.typelevel', name: 'weaver-cats_3', version: '0.10.1'
}

tasks.named("compileTestGroovy", GroovyCompile) {
  dependsOn 'compileTestScala'
  classpath += files(sourceSets.test.scala.destinationDirectory)
}

tasks.named("compileLatestDepTestGroovy", GroovyCompile) {
  dependsOn 'compileLatestDepTestScala'
  classpath += files(sourceSets.latestDepTest.scala.destinationDirectory)
}

tasks.named("compileWeaver084TestGroovy", GroovyCompile) {
  dependsOn 'compileWeaver084TestScala'
  classpath += files(sourceSets.weaver084Test.scala.destinationDirectory)
}

tasks.named("compileWeaver010TestGroovy", GroovyCompile) {
  dependsOn 'compileWeaver010TestScala'
  classpath += files(sourceSets.weaver010Test.scala.destinationDirectory)
}

// Exercise the same native assertions for Scala 2 static callbacks and Scala 3 suite callbacks.
['scala212Test', 'scala213Test'].each { suiteName ->
  addTestSuiteForDir(suiteName, 'test')
  tasks.named(suiteName, Test) {
    systemProperty 'weaver.scalaBinaryVersion', suiteName == 'scala212Test' ? '2.12' : '2.13'
  }
  configurations.matching { it.name.startsWith(suiteName) }.configureEach {
    exclude group: 'org.typelevel', module: 'weaver-cats_3'
  }
  tasks.named("compile${suiteName.capitalize()}Groovy", GroovyCompile) {
    dependsOn "compile${suiteName.capitalize()}Scala"
    classpath += files(sourceSets[suiteName].scala.destinationDirectory)
  }
  tasks.named("compile${suiteName.capitalize()}Scala", ScalaCompile) {
    configureCompiler(it, 8, JavaVersion.VERSION_1_8, 'Scala 2 compiler compatibility')
  }
}

dependencies {
  scala212TestImplementation group: 'org.typelevel', name: 'weaver-cats_2.12', version: '0.9.0'
  scala213TestImplementation group: 'org.typelevel', name: 'weaver-cats_2.13', version: '0.9.0'
}
