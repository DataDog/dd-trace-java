plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = "io.netty"
    module = "netty-common"
    versions = "[4.0.0.Final,)"
    assertInverse = true
  }
}

addTestSuiteForDir('latestDep4Test', 'test')
addTestSuiteForDir('latestDepTest', 'test')
addForkedTestTask('latestDep4Test')
addForkedTestTask('latestDepTest')
addTestSuiteForDir('netty4144Test', 'test')
addTestSuiteForDir('legacyNettyTest', 'test')

['netty4144Test', 'legacyNettyTest'].each { name ->
  tasks.named(name, Test) {
    filter {
      includeTestsMatching 'executor.NettyScheduledFutureTaskContextPropagationTest'
    }
  }
}

dependencies {
  compileOnly group: 'io.netty', name: 'netty-common', version: '4.0.0.Final'

  testImplementation project(':dd-java-agent:instrumentation:datadog:tracing:trace-annotation')
  testImplementation group: 'io.netty', name: 'netty-all', version: '4.0.0.Final'
  testImplementation group: 'io.grpc', name: 'grpc-netty-shaded', version: '1.58.0'

  latestDep4TestImplementation group: 'io.netty', name: 'netty-all', version: '4.+'
  latestDepTestImplementation group: 'io.netty', name: 'netty-all', version: '+'
  netty4144TestImplementation group: 'io.netty', name: 'netty-all', version: '4.1.44.Final'
  legacyNettyTestImplementation group: 'io.netty', name: 'netty-all', version: '4.1.9.Final'
}

tasks.named("latestDepTest", Test) {
  dependsOn "latestDep4Test"
}

configurations.configureEach {
  resolutionStrategy.componentSelection.all { ComponentSelection selection ->
    def version = selection.candidate.version.toLowerCase()
    if (version.contains('alpha') || version.contains('beta')) {
      reject("Early Access Version: ${selection.candidate.version}")
    }
  }
}
