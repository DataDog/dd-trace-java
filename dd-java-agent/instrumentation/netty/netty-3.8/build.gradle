plugins {
  id 'dd-trace-java.module.instrumentation'
}

// GrEclipse 4.27 cannot format Netty38ServerTest, so use the latest version in this module.
// TODO: Remove this override when the repository-wide 4.27 pin can be lifted.
// https://github.com/diffplug/spotless/issues/3013
spotless {
  groovy {
    clearSteps()
    toggleOffOn()
    greclipse().configFile(rootProject.file('gradle/enforcement/spotless-groovy.properties'))
  }
}

testJvmConstraints {
  maxJavaVersion = JavaVersion.VERSION_1_8
}

muzzle {
  pass {
    group = "io.netty"
    module = "netty"
    versions = "[3.8.0.Final,4)"
    assertInverse = true
  }
  fail {
    group = "io.netty"
    module = "netty-all"
    versions = "[,]"
    excludeDependency 'io.netty:netty-tcnative'
  }
}

addTestSuite('latestDepTest')

dependencies {
  compileOnly group: 'io.netty', name: 'netty', version: '3.8.0.Final'

  testImplementation group: 'io.netty', name: 'netty', version: '3.8.0.Final'
  testImplementation group: 'com.ning', name: 'async-http-client', version: '1.8.0'

  latestDepTestImplementation group: 'io.netty', name: 'netty', version: '3.10.+'
  latestDepTestImplementation group: 'com.ning', name: 'async-http-client', version: '1.9.+'
}

// We need to force the dependency to the earliest supported version because other libraries declare newer versions.
configurations.named('testImplementation') {
  resolutionStrategy {
    eachDependency { DependencyResolveDetails details ->
      //specifying a fixed version for all libraries with io.netty' group
      if (details.requested.group == 'io.netty') {
        details.useVersion "3.8.0.Final"
      }
    }
  }
}
