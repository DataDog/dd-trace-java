plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = 'com.fasterxml.jackson.module'
    module = 'jackson-module-blackbird'
    versions = '[2.12.0,)'
    javaVersion = '11'
  }
}

testJvmConstraints {
  minJavaVersion = JavaVersion.VERSION_17
}

tasks.named("compileTestJava", JavaCompile) {
  configureCompiler(it, JavaVersion.VERSION_17)
}

final jacksonTestVersion = '2.17.2'
dependencies {
  compileOnly group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.12.0'
  compileOnly group: 'com.fasterxml.jackson.module', name: 'jackson-module-blackbird', version: '2.12.0'

  testImplementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: jacksonTestVersion
  testImplementation group: 'com.fasterxml.jackson.module', name: 'jackson-module-blackbird', version: jacksonTestVersion
  testImplementation group: 'com.fasterxml.jackson.module', name: 'jackson-module-afterburner', version: jacksonTestVersion
  testImplementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jsr310', version: jacksonTestVersion
  testImplementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jdk8', version: jacksonTestVersion
  testImplementation libs.assertj.core
}
