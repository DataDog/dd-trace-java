plugins {
  id 'dd-trace-java.module.instrumentation'
  id 'idea'
}

muzzle {
  pass {
    coreJdk('11')
  }
}

tracerJava {
  addSourceSetFor(JavaVersion.VERSION_11)
}

dependencies {
  testRuntimeOnly(project(":dd-java-agent:instrumentation:java:java-lang:java-lang-9.0"))
}

tasks.named("compileTestGroovy", GroovyCompile) {
  configureCompiler(it, JavaVersion.VERSION_11)
}

idea {
  module {
    jdkName = '11'
  }
}

