plugins {
  id 'idea'
  id 'dd-trace-java.module.instrumentation'
  // Use slf4j-simple as default; logback has a high chance of getting stuck in a deadlock on CI.
  id 'dd-trace-java.conventions.testing.slf4j-simple'
}

testJvmConstraints {
  minJavaVersion = JavaVersion.VERSION_21
}

muzzle {
  pass {
    coreJdk('21')
  }
}

idea {
  module {
    jdkName = '21'
  }
}

// Set test compile task to use JDK 21 to use the virtual threads API
tasks.named("compileTestJava", JavaCompile) {
  configureCompiler(it, 21)
}

dependencies {
  testImplementation project(':dd-java-agent:instrumentation:datadog:tracing:trace-annotation')
}

tasks.named('forkedTest', Test) {
  jvmArgs '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
    '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
    '--add-opens=java.net.http/jdk.internal.net.http=ALL-UNNAMED'
}
