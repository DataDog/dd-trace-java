plugins {
  id 'dd-trace-java.module.instrumentation'
}

// Experimental diagnostics: profile the test worker, rather than the Gradle daemon.
def concurrentDebug = providers.gradleProperty('concurrentDebug').orElse('true')
def concurrentForkEvery = providers.gradleProperty('concurrentForkEvery')
  .orElse(providers.environmentVariable('CONCURRENT_FORK_EVERY')).orElse('1')
def debugDirectory = layout.buildDirectory.dir('reports/concurrent-debug/test')
tasks.named('test', Test) {
  timeout.set(java.time.Duration.ofMinutes(30))
  outputs.upToDateWhen { false }
  outputs.doNotCacheIf('Collect fresh worker diagnostics') { true }
  doFirst {
    def metadata = javaLauncher.get().metadata
    if (metadata.languageVersion.asInt() == 11 && !metadata.vendor.toLowerCase().contains('ibm')
      && System.getProperty('os.arch') in ['aarch64', 'arm64']) {
      // Filter before Gradle forks: JUnit discovery otherwise starts empty workers for helpers
      // and generated Groovy closures. TestFanout does not follow the *Test naming convention.
      include '**/*Test.class', '**/TestFanout.class'
      exclude '**/*$*', '**/CompletableFuturePromiseTest.class', '**/ExecutorInstrumentationTest.class'
      forkEvery = concurrentForkEvery.get().toLong()
      maxParallelForks = forkEvery == 0 ? 1 : 2
      logger.lifecycle('Concurrent workaround: {} classes per JVM (0 = shared), {} workers',
        forkEvery, maxParallelForks)
    }
    if (concurrentDebug.get().toBoolean()) {
      def debugDir = debugDirectory.get().asFile
      debugDir.mkdirs()
      systemProperty 'test.concurrent.debug', 'true'
      // OpenJ9 and Java 8 remain timing controls without HotSpot-specific recording flags.
      if (metadata.languageVersion.asInt() >= 11 && !metadata.vendor.toLowerCase().contains('ibm')) {
        def settings = new File(metadata.installationPath.asFile, 'lib/jfr/profile.jfc').getText('UTF-8')
        // Omit secret-bearing metadata and unrelated old-object sampling. The latter crashed
        // inside ObjectSampleCheckpoint during local Java 11 validation with retransformation.
        for (event in [
            'jdk.InitialEnvironmentVariable',
            'jdk.InitialSystemProperty',
            'jdk.JVMInformation',
            'jdk.SystemProcess',
            'jdk.ProcessStart',
            'jdk.SecurityPropertyModification',
            'jdk.OldObjectSample'
          ]) {
          settings = settings.replaceAll('(?s)<event name="' + java.util.regex.Pattern.quote(event) + '">.*?</event>', '')
          settings = settings.replace('</configuration>',
            '<event name="' + event + '"><setting name="enabled">false</setting></event></configuration>')
        }
        def settingsFile = new File(debugDir, 'worker.jfc')
        settingsFile.setText(settings, 'UTF-8')
        // Save even if a worker later needs to be killed at the 30-minute task deadline.
        jvmArgs '-XX:+UnlockDiagnosticVMOptions', '-XX:+DebugNonSafepoints', '-XX:+PreserveFramePointer',
          "-XX:StartFlightRecording=name=concurrent,settings=${settingsFile},filename=${debugDir},duration=28m,dumponexit=true,maxsize=256m",
          "-Xlog:gc*=info,safepoint*=debug:file=${debugDir}/vm-%p.log:time,uptime,level,tags",
          "-Xlog:redefine+class+timer=info,redefine+class=debug,redefine+class+load=debug:file=${debugDir}/redefine-%p.log:time,uptime,level,tags:filecount=0"
      }
      logger.lifecycle('Concurrent debug: worker JVM {} ({}), reports {}',
        metadata.installationPath, metadata.jvmVersion, debugDir)
    }
  }
}

muzzle {
  pass {
    coreJdk()
  }
}

tasks.named("compileJava") {
  configureCompiler(it, 8, JavaVersion.VERSION_1_8, "Needs JDK 8 package-private CompletableFuture internals")
}

addTestSuiteForDir('latestDepTest', 'test')

dependencies {
  testImplementation project(':dd-java-agent:instrumentation:datadog:tracing:trace-annotation')
  testImplementation libs.guava
  testImplementation group: 'org.apache.tomcat.embed', name: 'tomcat-embed-core', version: '7.0.0'
  // Tomcat 10.1.+ seems to require Java 11. Limit to fix build.
  // TODO: Tomcat 10.0.10 has a copy of the JSR166 ThreadPoolExecutor so it needs special instrumentation
  latestDepTestImplementation group: 'org.apache.tomcat.embed', name: 'tomcat-embed-core', version: '10.0.8'
}
