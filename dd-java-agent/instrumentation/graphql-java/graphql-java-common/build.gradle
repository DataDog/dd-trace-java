plugins {
  id 'java-test-fixtures'
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    name = "graphql-java-common"
    group = "com.graphql-java"
    module = 'graphql-java'
    versions = '[14.0,)'
  }
}

dependencies {
  compileOnly group: 'com.graphql-java', name: 'graphql-java', version: '14.0'

  testFixturesApi project(':dd-java-agent:instrumentation-testing')
  testFixturesCompileOnly group: 'com.graphql-java', name: 'graphql-java', version: '14.0'
  testFixturesImplementation libs.junit.jupiter
  testFixturesImplementation libs.mokito.core
  testFixturesImplementation libs.tabletest
}
