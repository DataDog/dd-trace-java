muzzle {
  extraRepository("confluent-releases", "https://packages.confluent.io/maven/")

  pass {
    group = "org.apache.kafka"
    module = "connect-runtime"
    versions = "[0.11.0.0,)"
    javaVersion = "17"
    // Confluent 7.x POMs reference Jetty versions that were never published (9.4.59 and up), either
    // via ${jetty.version} or as flattened literals. Muzzle only checks binary compatibility of the
    // Kafka classes, so pin Jetty to the last published 9.4.x rather than skipping those releases.
    // 8.x is excluded from the range because it moved to Jetty 12.
    // Can be removed once https://github.com/confluentinc/kafka-connect-storage-common/issues/468 is resolved.
    mavenPomOverrides {
      artifactVersions = "[7.4,8)"
      dependency("org.eclipse.jetty") {
        matchPattern = '${jetty.version}'
        matchVersionRanges = ["[9.4.59,9.5)"]
        replacement = "9.4.58.v20250814"
      }
    }
    excludeDependency "io.confluent.cloud:*"
    excludeDependency "io.confluent.observability:*"
    excludeDependency "io.confluent.secure.compute:*"
    assertInverse = true
  }
}

apply from: "$rootDir/gradle/java.gradle"

dependencies {
  compileOnly group: 'org.apache.kafka', name: 'connect-runtime', version: '0.11.0.0'

  testImplementation project(':dd-java-agent:agent-iast:iast-test-fixtures')
  testRuntimeOnly project(':dd-java-agent:instrumentation:datadog:asm:iast-instrumenter')
  testRuntimeOnly project(':dd-java-agent:instrumentation:java:java-lang:java-lang-1.8')
  testRuntimeOnly project(':dd-java-agent:instrumentation:java:java-io-1.8')
  testRuntimeOnly project(':dd-java-agent:instrumentation:jackson-core:jackson-core-common')
  testRuntimeOnly project(':dd-java-agent:instrumentation:jackson-core:jackson-core-2.8')
  testImplementation libs.jackson.databind
  testImplementation group: 'org.mockito', name: 'mockito-core', version: '2.19.0'
  testImplementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.2.3'
  testImplementation 'org.apache.kafka:connect-api:2.7.0'      // Fixed version
  testImplementation 'org.apache.kafka:connect-runtime:2.7.0'
  testImplementation 'org.apache.kafka:connect-file:2.7.0'     // For FileStreamSourceConnector
  testImplementation 'org.apache.kafka:kafka-clients:2.7.0'
  // Spring Kafka Test library
  testImplementation 'org.springframework.kafka:spring-kafka-test:2.7.9'  // Version compatible with Kafka 2.7.x
  testRuntimeOnly project(':dd-java-agent:instrumentation:kafka:kafka-clients-0.11')
  testRuntimeOnly project(':dd-java-agent:instrumentation:kafka:kafka-clients-3.8')
  testRuntimeOnly project(':dd-java-agent:instrumentation:kafka:kafka-streams-0.11')
  testRuntimeOnly project(':dd-java-agent:instrumentation:kafka:kafka-streams-1.0')
}
