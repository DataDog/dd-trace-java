plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  extraRepository("confluent-releases", "https://packages.confluent.io/maven/")

  pass {
    group = "org.apache.kafka"
    module = "kafka-clients"
    versions = "[3.8.0,5),[7.8.0,)"
    assertInverse = true
    javaVersion = "17"
  }
}

tracerJava {
  addSourceSetFor(JavaVersion.VERSION_17)
}

addTestSuiteForDir('latestDepTest', 'test')

sourceSets.named('test') {
  java.srcDir 'src/testBroker/java'
}
sourceSets.named('latestDepTest') {
  java.srcDir 'src/latestDepTest/java'
}

['latestDepTestCompileClasspath', 'latestDepTestRuntimeClasspath'].each { name ->
  configurations.named(name) {
    resolutionStrategy.componentSelection.all { ComponentSelection selection ->
      if (selection.candidate.group in ['org.apache.kafka', 'org.springframework.kafka'] &&
        !selection.candidate.version.matches('\\d+\\.\\d+\\.\\d+')) {
        selection.reject('Only stable upstream releases are tested')
      }
    }
  }
}

tasks.named('latestDepTest', Test) {
  maxHeapSize = '1g'
}
tasks.named('latestDepForkedTest', Test) {
  maxHeapSize = '1g'
}

// Java 8 bytecode — override addSourceSetFor(17)'s Java 17 default
tasks.named("compileMain_java17Java", JavaCompile) {
  configureCompiler(it, JavaVersion.VERSION_1_8)
}

tasks.withType(GroovyCompile).configureEach {
  configureCompiler(it, JavaVersion.VERSION_17)
}

dependencies {
  components.all {
    if (id.group == 'org.apache.kafka') {
      belongsTo("org.apache.kafka:kafka-virtual-platform:${id.version}")
    }
  }

  implementation project(':dd-java-agent:instrumentation:kafka:kafka-common')
  implementation project(':dd-java-agent:instrumentation:datadog:dynamic-instrumentation:span-origin')

  main_java17CompileOnly group: 'org.apache.kafka', name: 'kafka-clients', version: '3.8.0'
  main_java17Implementation project(':dd-java-agent:instrumentation:kafka:kafka-common')

  testImplementation group: 'org.springframework.kafka', name: 'spring-kafka', version: '3.3.4', {
    exclude group: 'org.apache.kafka'
  }
  testImplementation group: 'org.springframework.kafka', name: 'spring-kafka-test', version: '3.3.4', {
    exclude group: 'org.apache.kafka'
  }

  testImplementation 'org.apache.kafka:kafka-server-common:3.8.0:test'

  testImplementation 'org.apache.kafka:kafka-clients:3.8.0'
  testImplementation 'org.apache.kafka:kafka-clients:3.8.0:test'

  testImplementation 'org.apache.kafka:kafka_2.13:3.8.0'
  testImplementation 'org.apache.kafka:kafka_2.13:3.8.0:test'

  testImplementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.2.3'
  testImplementation group: 'org.mockito', name: 'mockito-core', version: '2.19.0'
  testRuntimeOnly project(':dd-java-agent:instrumentation:spring:spring-scheduling-3.1')

  latestDepTestImplementation 'org.apache.kafka:kafka-clients:+'
  latestDepTestImplementation('org.apache.kafka:kafka-test-common-runtime:+') {
    // Supply the fixture classifier directly: Kafka publishes no matching fixture capability.
    exclude group: 'org.apache.kafka', module: 'kafka-clients'
  }
  latestDepTestRuntimeOnly 'org.apache.kafka:kafka-clients:+:test-fixtures'
  latestDepTestRuntimeOnly 'org.bouncycastle:bcpkix-jdk18on:1.86'
  latestDepTestImplementation('org.springframework.kafka:spring-kafka:+') {
    exclude group: 'org.apache.kafka'
  }
  latestDepTestImplementation('org.springframework.kafka:spring-kafka-test:+') {
    exclude group: 'org.apache.kafka'
  }
  // Spring Kafka 4 uses SLF4J 2, which requires a compatible logging provider.
  latestDepTestRuntimeOnly 'ch.qos.logback:logback-classic:1.3.+'
  latestDepTestImplementation group: 'io.dropwizard.metrics', name: 'metrics-core', version: '+'
  latestDepTestImplementation libs.guava
}
