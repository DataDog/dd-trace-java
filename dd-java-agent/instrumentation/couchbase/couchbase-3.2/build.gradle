import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

plugins {
  id 'dd-trace-java.module.instrumentation'
  id 'dd-trace-java.testcontainers'
}

muzzle {
  pass {
    group = 'com.couchbase.client'
    module = 'java-client'
    versions = '[3.2,)'
    // Version 2.7.5 and 2.7.8 were not released properly
    skipVersions = ['2.7.5', '2.7.8', '3.6.3']
    assertInverse = true
  }
}

addTestSuiteForDir('latestDepTest', 'test')

dependencies {
  compileOnly group: 'com.couchbase.client', name: 'java-client', version: '3.2.0'
  testContainerImage(image(
    DefaultNativePlatform.getCurrentArchitecture().isArm64()
      ? 'couchbase/server:7.1.0-aarch64'
      : 'couchbase/server:7.1.0',
    'test.couchbase.image'))

  testImplementation group: 'com.couchbase.client', name: 'java-client', version: '3.2.0'
  testImplementation group: 'org.testcontainers', name: 'couchbase', version: libs.versions.testcontainers.get()
  testImplementation project(':dd-java-agent:instrumentation:reactive-streams-1.0')
  testImplementation project(':dd-java-agent:instrumentation:reactor-core-3.1')

  latestDepTestImplementation group: 'com.couchbase.client', name: 'java-client', version: '+'
}

tasks.withType(Test).configureEach {
  usesService(testcontainersLimit)
}
