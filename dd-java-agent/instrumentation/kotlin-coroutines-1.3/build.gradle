import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
  id 'java-test-fixtures'
  id 'org.jetbrains.kotlin.jvm'
  id 'dd-trace-java.module.instrumentation'
  id 'dd-trace-java.conventions.testing.kotlin'
}

muzzle {
  pass {
    group = 'org.jetbrains.kotlin'
    module = 'kotlin-stdlib'
    versions = "[1.3.0,)"
    extraDependency "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.0"
  }
  pass {
    group = 'org.jetbrains.kotlinx'
    module = 'kotlinx-coroutines-core'
    versions = "[1.3.0,)"
  }
  pass {
    group = 'org.jetbrains.kotlinx'
    module = 'kotlinx-coroutines-core-jvm'
    versions = "[1.5.0,)"
  }
}

kotlin {
  compilerOptions {
    jvmTarget = JvmTarget.JVM_1_8
    apiVersion = KotlinVersion.KOTLIN_1_6
    languageVersion = KotlinVersion.KOTLIN_1_6
  }
}

// Reuse the flow and context-lifecycle tests across intermediate and current releases.
addTestSuiteForDir('coroutines16Test', 'latestDepTest')
addTestSuiteForDir('coroutines164Test', 'latestDepTest')
addTestSuiteForDir('coroutines18Test', 'latestDepTest')
addTestSuite('latestDepTest')

dependencies {
  api project(':dd-java-agent:instrumentation:java:java-concurrent:java-concurrent-1.8')
  compileOnly libs.kotlin
  compileOnly libs.coroutines

  testFixturesImplementation libs.kotlin
  testFixturesImplementation libs.coroutines
  testFixturesImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j:1.3.0"
  testFixturesApi project(':dd-trace-api')
  testFixturesApi project(':dd-java-agent:instrumentation:datadog:tracing:trace-annotation')
  testFixturesApi project(':dd-java-agent:instrumentation-testing')

  testImplementation libs.kotlin
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.0"
  testImplementation testFixtures(project(':dd-java-agent:instrumentation:kotlin-coroutines-1.3'))

  coroutines16TestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.1"
  coroutines16TestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j:1.6.1"
  coroutines164TestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
  coroutines164TestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j:1.6.4"
  coroutines18TestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
  coroutines18TestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j:1.8.1"

  latestDepTestImplementation libs.kotlin
  latestDepTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.+"
  latestDepTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j:1.+"
  latestDepTestImplementation testFixtures(project(':dd-java-agent:instrumentation:kotlin-coroutines-1.3'))

  testFixturesCompileOnly(libs.bundles.groovy)
  testFixturesCompileOnly(libs.bundles.spock)
  testFixturesCompileOnly libs.junit.jupiter
  testFixturesCompileOnly libs.tabletest
}
