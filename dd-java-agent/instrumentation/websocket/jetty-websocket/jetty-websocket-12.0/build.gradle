plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    name = 'jetty-websocket-12-native'
    group = 'org.eclipse.jetty.websocket'
    module = 'jetty-websocket-jetty-server'
    versions = "[12,12.1)"
    javaVersion = "17"
    assertInverse = true
  }
  pass {
    name = 'jetty-websocket-12ee8'
    group = 'org.eclipse.jetty.ee8.websocket'
    module = 'jetty-ee8-websocket-javax-server'
    versions = "[12,12.1)"
    javaVersion = "17"
    assertInverse = true
  }
  pass {
    name = 'jetty-websocket-12ee9'
    group = 'org.eclipse.jetty.ee9.websocket'
    module = 'jetty-ee9-websocket-jakarta-server'
    versions = "[12,12.1)"
    javaVersion = "17"
    assertInverse = true
  }
  pass {
    name = 'jetty-websocket-12ee10'
    group = 'org.eclipse.jetty.ee10.websocket'
    module = 'jetty-ee10-websocket-jakarta-server'
    versions = "[12,12.1)"
    javaVersion = "17"
    assertInverse = true
  }
}

testJvmConstraints {
  minJavaVersion = JavaVersion.VERSION_17
}

addTestSuiteForDir("latestDepTest", "test")

["compileTestGroovy", "compileLatestDepTestGroovy"].each { name ->
  tasks.named(name, GroovyCompile) {
    configureCompiler(it, JavaVersion.VERSION_17)
  }
}

["compileTestJava", "compileLatestDepTestJava"].each { name ->
  tasks.named(name, JavaCompile) {
    configureCompiler(it, JavaVersion.VERSION_17)
  }
}

dependencies {
  testImplementation libs.bundles.mockito
  compileOnly 'org.eclipse.jetty.websocket:jetty-websocket-jetty-common:12.0.0'
  implementation project(":dd-java-agent:instrumentation:websocket:jetty-websocket:jetty-websocket-10.0")
  testImplementation group: 'org.eclipse.jetty.ee8.websocket', name: 'jetty-ee8-websocket-javax-server', version: '12.0.0'
  testImplementation group: 'org.eclipse.jetty.ee9.websocket', name: 'jetty-ee9-websocket-jakarta-server', version: '12.0.0'
  testImplementation group: 'org.eclipse.jetty.ee10.websocket', name: 'jetty-ee10-websocket-jakarta-server', version: '12.0.0'
  testImplementation 'org.eclipse.jetty.websocket:jetty-websocket-jetty-server:12.0.0'
  testImplementation 'org.eclipse.jetty.websocket:jetty-websocket-jetty-client:12.0.0'
  //TODO: jetty-12.1.0 wraps MethodHandle class into a MethodHolder class.
  latestDepTestImplementation group: 'org.eclipse.jetty.ee8.websocket', name: 'jetty-ee8-websocket-javax-server', version: '12.0.+'
  latestDepTestImplementation group: 'org.eclipse.jetty.ee9.websocket', name: 'jetty-ee9-websocket-jakarta-server', version: '12.0.+'
  latestDepTestImplementation group: 'org.eclipse.jetty.ee10.websocket', name: 'jetty-ee10-websocket-jakarta-server', version: '12.0.+'
  latestDepTestImplementation 'org.eclipse.jetty.websocket:jetty-websocket-jetty-server:12.0.+'
  latestDepTestImplementation 'org.eclipse.jetty.websocket:jetty-websocket-jetty-client:12.0.+'

  testRuntimeOnly project(":dd-java-agent:instrumentation:jetty:jetty-client:jetty-client-12.0")
  testRuntimeOnly project(":dd-java-agent:instrumentation:jetty:jetty-server:jetty-server-12.0")
  testRuntimeOnly project(":dd-java-agent:instrumentation:websocket:jetty-websocket:jetty-websocket-10.0")
  testRuntimeOnly project(":dd-java-agent:instrumentation:websocket:jetty-websocket:jetty-websocket-11.0")
  testRuntimeOnly project(":dd-java-agent:instrumentation:websocket:javax-websocket-1.0")
  testRuntimeOnly project(":dd-java-agent:instrumentation:websocket:jakarta-websocket-2.0")

  configurations.configureEach {
    it.resolutionStrategy {
      force libs.slf4j
    }
  }
}
