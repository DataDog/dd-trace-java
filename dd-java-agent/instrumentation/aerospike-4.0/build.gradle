plugins {
  id 'dd-trace-java.module.instrumentation'
  id 'dd-trace-java.testcontainers'
}

muzzle {
  pass {
    group = 'com.aerospike'
    module = 'aerospike-client'
    versions = "[4,8)"
    skipVersions += "4.4.19" // bad release
  }
}

addTestSuiteForDir("latestDepTest", "test")
addTestSuiteForDir("latest7DepTest", "test")

sourceSets.named('latest7DepTest') {
  java.srcDir 'src/latest7DepTest/java'
}

tasks.named("latestDepTest", Test) {
  testJvmConstraints {
    minJavaVersion = JavaVersion.VERSION_21
  }
}

dependencies {
  compileOnly group: 'com.aerospike', name: 'aerospike-client', version: '4.0.0'
  testContainerImage(image('aerospike:ce-6.2.0.2', 'test.aerospike.image'))

  testImplementation group: 'com.aerospike', name: 'aerospike-client', version: '4.0.0'
  testImplementation libs.testcontainers

  latest7DepTestImplementation group: 'com.aerospike', name: 'aerospike-client', version: '7.+'
  latest7DepTestImplementation libs.mokito.core
  latestDepTestImplementation group: 'com.aerospike', name: 'aerospike-client', version: '+'
}

tasks.withType(Test).configureEach {
  usesService(testcontainersLimit)
}
