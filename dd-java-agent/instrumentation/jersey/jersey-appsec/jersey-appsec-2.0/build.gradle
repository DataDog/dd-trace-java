plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    name = 'jersey_2'
    group = 'org.glassfish.jersey.core'
    module = 'jersey-common'
    versions = '[2,3)'
    assertInverse = true
  }
  pass {
    name = 'jersey_server_2'
    group = 'org.glassfish.jersey.core'
    module = 'jersey-server'
    versions = '[2,3)'
    assertInverse = true
  }
  pass {
    name = 'jersey_server_2+3'
    group = 'org.glassfish.jersey.core'
    module = 'jersey-server'
    versions = '[2,)'
    assertInverse = true
  }
  pass {
    name = 'jersey_2+3'
    group = 'org.glassfish.jersey.core'
    module = 'jersey-common'
    versions = '[2,)'
    assertInverse = true
  }
  pass {
    name = 'multipart'
    group = 'org.glassfish.jersey.media'
    module = 'jersey-media-multipart'
    versions = '[2,3)'
    assertInverse = true
  }
}

configurations.configureEach {
  resolutionStrategy.deactivateDependencyLocking()
}

dependencies {
  compileOnly group: 'org.glassfish.jersey.core', name: 'jersey-common', version: '2.0'
  compileOnly group: 'org.glassfish.jersey.core', name: 'jersey-server', version: '2.0'
  compileOnly group: 'org.glassfish.jersey.media', name: 'jersey-media-multipart', version: '2.0'

  testImplementation group: 'org.glassfish.jersey.media', name: 'jersey-media-multipart', version: '2.18'

  // Normalized route tests: Jersey servlet on Jetty, server span from jetty-server-7.6
  testImplementation group: 'org.glassfish.jersey.containers', name: 'jersey-container-servlet-core', version: '2.18'
  testImplementation group: 'org.eclipse.jetty', name: 'jetty-server', version: '8.2.0.v20160908'
  testImplementation group: 'org.eclipse.jetty', name: 'jetty-servlet', version: '8.2.0.v20160908'
  testImplementation project(':dd-java-agent:instrumentation:jetty:jetty-server:jetty-server-7.6')
  testImplementation project(':dd-java-agent:instrumentation:rs:jax-rs:jax-rs-annotations:jax-rs-annotations-2.0')
}

// tested in grizzly-http-2.3.20
