plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = 'org.tinylog'
    module = 'tinylog-impl'
    versions = '[2.0.0,]'
  }
}

addTestSuiteForDir('latestDepTest', 'test')
addTestSuiteExtendingForDir('latestDepForkedTest', 'latestDepTest', 'test')

dependencies {
  compileOnly group: 'org.tinylog', name: 'tinylog-impl', version: '2.0.0'

  testImplementation group: 'org.tinylog', name: 'tinylog-impl', version: '2.0.0'
  latestDepTestImplementation group: 'org.tinylog', name: 'tinylog-impl', version: '+'
}
