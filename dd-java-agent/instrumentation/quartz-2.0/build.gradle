plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = 'org.quartz-scheduler'
    module = 'quartz'
    versions = "[2.0.0,)"
    skipVersions = ["1.7.0"] // missing on central
    assertInverse = true
    javaVersion = "11"
  }
}

addTestSuiteForDir('latestDepTest', 'test')
addTestSuiteForDir('version40Test', 'test')

dependencies {
  compileOnly group: 'org.quartz-scheduler', name: 'quartz', version: '2.0.0'
  testImplementation group: 'org.quartz-scheduler', name: 'quartz', version: '2.0.0'

  // these dependencies are required for XML configurations when quartz version > 2.2+
  //
  // Keep `quartz` pinned to 2.4.0 here. This suite exists to cover the 2.4 line between the 2.0.0
  // baseline in `test` and the floating version in `latestDepTest`; a `+` here resolves to the same
  // version as `latestDepTest` and the suite stops testing anything distinct. The pin also decides
  // the transaction API: quartz 2.4.0 references `javax.transaction.UserTransaction`, whereas 2.5.0
  // and later moved to `jakarta.transaction.UserTransaction`.
  version40TestImplementation group: 'org.quartz-scheduler', name: 'quartz-jobs', version: '2.4.0'
  version40TestImplementation group: 'org.quartz-scheduler', name: 'quartz', version: '2.4.0'
  version40TestImplementation group: 'javax.transaction', name: 'jta', version: '1.1'
  latestDepTestImplementation group: 'org.quartz-scheduler', name: 'quartz-jobs', version: '+'
  latestDepTestImplementation group: 'jakarta.transaction', name: 'jakarta.transaction-api', version: '2.0.1'
  latestDepTestImplementation group: 'org.quartz-scheduler', name: 'quartz', version: '+'
}

[
  "compileLatestDepTestGroovy",
  "compileLatestDepTestJava",
  "compileVersion40TestGroovy",
  "compileVersion40TestJava"
].each {
  tasks.named(it, AbstractCompile) {
    configureCompiler(it, 11)
  }
}

tasks.named("latestDepTest", Test) {
  testJvmConstraints {
    minJavaVersion = JavaVersion.VERSION_11
  }
}

tasks.named("version40Test", Test) {
  testJvmConstraints {
    minJavaVersion = JavaVersion.VERSION_11
  }
}
