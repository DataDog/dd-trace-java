plugins {
  id 'dd-trace-java.module.instrumentation'
}

muzzle {
  pass {
    group = "com.alipay.sofa"
    module = "sofa-rpc-all"
    versions = "[5.0.0,)"
    assertInverse = true
  }
}

addTestSuiteForDir('latestDepTest', 'test')

dependencies {
  compileOnly group: "com.alipay.sofa", name: "sofa-rpc-all", version: "5.6.0"

  testImplementation group: "com.alipay.sofa", name: "sofa-rpc-all", version: "5.14.2"
  // JAX-RS annotations required for the REST protocol test interface (@Path, @GET, etc.)
  testImplementation group: "javax.ws.rs", name: "javax.ws.rs-api", version: "2.1.1"
  // Required so that GrpcServerModule / GrpcClientModule are discovered via ServiceLoader
  // in SofaRpcTripleWithGrpcForkedTest.
  testImplementation project(':dd-java-agent:instrumentation:grpc-1.5')
  testImplementation group: "io.grpc", name: "grpc-netty", version: "1.53.0"
  testImplementation group: "io.grpc", name: "grpc-core", version: "1.53.0"
  testImplementation group: "io.grpc", name: "grpc-stub", version: "1.53.0"
  testImplementation group: "com.google.protobuf", name: "protobuf-java", version: "3.25.3"
  testImplementation group: "com.alibaba", name: "fastjson", version: "1.2.83"

  latestDepTestImplementation group: "com.alipay.sofa", name: "sofa-rpc-all", version: "+"

  constraints {
    // `sofa-rpc-all:5.14.2` brings `netty-all:4.1.44.Final`, a fat jar carrying the classes of
    // every netty module, while `grpc-netty:1.53.0` brings the individual `netty-*:4.1.79.Final`
    // modules. Both supply `io.netty.**` under unrelated coordinates, so Gradle cannot reconcile
    // them and whichever jar sorts first wins class loading.
    //
    // Forcing 4.1.79 removes the duplicate rather than reordering it: `netty-all` has shipped zero
    // classes since 4.1.75, so it becomes an empty aggregator that instead pulls in the complete,
    // version-aligned 4.1.79 module set - including the dns/epoll/kqueue/sctp modules that the fat
    // jar was otherwise the only source of.
    //
    // This is deliberately independent of ENHANCED_GRAPH_ORDERING. That preview only changes where
    // the fat jar lands: without it the jar sorts between `netty-buffer` and `netty-common`, so
    // `AbstractReferenceCountedByteBuf` (4.1.79) is paired with `ReferenceCountUpdater` (4.1.44)
    // and fails with a `NoSuchMethodError`; with it the jar sorts ahead of every modular jar, which
    // hides that symptom only because all of netty then silently loads from 4.1.44. Either way the
    // classpath still holds two copies of `io.netty.**`, so do not drop this constraint on the
    // grounds that the preview is enabled.
    testImplementation("io.netty:netty-all:4.1.79.Final") {
      because "netty-all:4.1.44 is a fat jar whose io.netty classes shadow the individual netty-*:4.1.79 modules; netty-all:4.1.79 is class-free and pulls in the aligned module set instead"
    }
  }
}
