plugins {
  id 'dd-trace-java.module.instrumentation'
  id 'scala'
}

muzzle {
  pass {
    name = 'scala-promise-2.13'
    group = 'org.scala-lang'
    module = "scala-library"
    versions = "[2.13,)"
    assertInverse = true
  }
  pass {
    name = 'scala-promise-unregister'
    group = 'org.scala-lang'
    module = "scala-library"
    versions = "[2.13.17,)"
    assertInverse = true
  }
}

// Keep Spotless scoped to this project; shared source sets are pulled in from scala-promise-common.
spotless {
  groovy {
    target('src/**/*.groovy')
    excludeJava(false)
  }
  scala {
    target('src/**/*.scala')
  }
}

// Ensure the common project is evaluated before we access its source sets
evaluationDependsOn(':dd-java-agent:instrumentation:scala:scala-promise:scala-promise-common')

addTestSuiteForDir('latestDepTest', 'test')
addTestSuiteExtendingForDir('latestDepForkedTest', 'latestDepTest', 'forkedTest')
addTestSuite('scala21317Test')

tasks.named("latestDepTest", Test) {
  finalizedBy 'latestDepForkedTest'
}

sourceSets {
  latestDepTest.java.srcDir 'src/scala21317Test/java'

  test.groovy.srcDir project(':dd-java-agent:instrumentation:scala:scala-promise:scala-promise-common').sourceSets.test.groovy
  test.groovy.srcDir sourceSets.latestDepForkedTest.groovy
  latestDepTest.groovy.srcDir project(':dd-java-agent:instrumentation:scala:scala-promise:scala-promise-common').sourceSets.test.groovy
  latestDepTest.groovy.srcDir 'src/scala21317Test/groovy'
  latestDepForkedTest.groovy.srcDir project(':dd-java-agent:instrumentation:scala:scala-promise:scala-promise-common').sourceSets.test.groovy

  test.scala.srcDir project(':dd-java-agent:instrumentation:scala:scala-promise:scala-promise-common').sourceSets.test.scala
  latestDepTest.scala.srcDir project(':dd-java-agent:instrumentation:scala:scala-promise:scala-promise-common').sourceSets.test.scala
  latestDepTest.scala.srcDir 'src/scala21317Test/scala'
  latestDepForkedTest.scala.srcDir project(':dd-java-agent:instrumentation:scala:scala-promise:scala-promise-common').sourceSets.test.scala
}

tasks.named("compileTestGroovy", GroovyCompile) {
  classpath += files(sourceSets.test.scala.classesDirectory)
}

tasks.named("compileLatestDepTestGroovy", GroovyCompile) {
  classpath += files(sourceSets.latestDepTest.scala.classesDirectory)
}

tasks.named("compileLatestDepForkedTestGroovy", GroovyCompile) {
  classpath += files(sourceSets.latestDepForkedTest.scala.classesDirectory)
}

tasks.named("compileScala21317TestGroovy", GroovyCompile) {
  classpath += files(sourceSets.scala21317Test.scala.classesDirectory)
}

tasks.withType(ScalaCompile).configureEach {
  // Scala compilers here can't run on modern JDKs; pinned to JDK 8.
  // * https://docs.scala-lang.org/overviews/jdk-compatibility/overview.html
  configureCompiler(it, 8, JavaVersion.VERSION_1_8, "Scala compilers here do not run on modern JDKs")
}

dependencies {
  compileOnly group: 'org.scala-lang', name: 'scala-library', version: '2.13.0'
  implementation project(':dd-java-agent:instrumentation:scala:scala-promise:scala-promise-common')

  testImplementation group: 'org.scala-lang', name: 'scala-library', version: '2.13.0'
  testImplementation project(':dd-java-agent:instrumentation:scala:scala-promise:scala-promise-common')

  latestDepTestImplementation group: 'org.scala-lang', name: 'scala-library', version: '2.+' // scala-lang 3.x requires scala 3.x compiler
  latestDepTestImplementation project(':dd-java-agent:instrumentation:scala:scala-promise:scala-promise-common')

  scala21317TestImplementation group: 'org.scala-lang', name: 'scala-library', version: '2.13.17'
}
