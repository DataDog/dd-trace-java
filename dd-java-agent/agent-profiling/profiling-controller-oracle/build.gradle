plugins {
  id 'dd-trace-java.module.internal-library'
}

testJvmConstraints {
  minJavaVersion = JavaVersion.VERSION_1_8
  maxJavaVersion = JavaVersion.VERSION_1_8
  includeJdk = ['ORACLE8']
  coverageTestJvm = 'ORACLE8'
}

minimumBranchCoverage = 0.5
minimumInstructionCoverage = 0.7

excludedClassesCoverage += ['com.datadog.profiling.controller.oracle.JdkTypeIDs_8']

// TODO: Cover these classes, then remove them from the coverage baseline (APMLP-2263)
excludedClassesBranchCoverage += ['com.datadog.profiling.controller.oracle.JdkTypeIDs_Old']
excludedClassesInstructionCoverage += ['com.datadog.profiling.controller.oracle.JdkTypeIDs_Old']

dependencies {
  api libs.slf4j
  api project(':internal-api')
  api project(':dd-java-agent:agent-profiling:profiling-controller')
  api project(':dd-java-agent:agent-profiling:profiling-controller-jfr')

  testImplementation libs.bundles.junit5
  testImplementation libs.bundles.mockito
  testImplementation project(':dd-java-agent:agent-profiling')
}

// Oracle JDK requires extra JVM arguments to enable JFR
tasks.withType(Test).configureEach {
  jvmArgs += [
    "-XX:+IgnoreUnrecognizedVMOptions",
    "-XX:+UnlockCommercialFeatures",
    "-XX:+FlightRecorder"
  ]
}
