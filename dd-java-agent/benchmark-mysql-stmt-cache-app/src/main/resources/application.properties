server.port=${PORT:18080}
spring.main.banner-mode=off
logging.level.root=WARN
server.tomcat.threads.max=64
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/bench?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=bench
spring.datasource.password=bench
spring.datasource.hikari.maximum-pool-size=${POOL_SIZE:16}
spring.datasource.hikari.minimum-idle=${POOL_SIZE:16}
