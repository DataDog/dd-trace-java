plugins {
  id 'dd-trace-java.jmh-conventions'
}

apply from: "$rootDir/gradle/java.gradle"

dependencies {
  jmh project(':dd-trace-api')
  jmh project(':dd-java-agent:agent-bootstrap')
  jmh libs.bytebuddyagent
}

jmh {
  timeUnit = 'ms' // Output time unit. Available time units are: [m, s, ms, us, ns].
  benchmarkMode = ['avgt']
  timeOnIteration = '20s'
  iterations = 1 // Number of measurement iterations to do.
  fork = 1 // How many times to forks a single benchmark. Use 0 to disable forking altogether
  jvmArgs = ["-Ddd.jmxfetch.enabled=false", "-Ddd.writer.type=LoggingWriter"]
  //  jvmArgs += ["-XX:+UnlockDiagnosticVMOptions", "-XX:+DebugNonSafepoints", "-XX:StartFlightRecording=delay=5s,dumponexit=true,name=jmh-benchmark,filename=$rootDir/dd-java-agent/benchmark/build/reports/jmh/jmh-benchmark.jfr"]
  //  jvmArgs += ["-agentpath:$rootDir/dd-java-agent/benchmark/src/jmh/resources/libasyncProfiler.so=start,collapsed,file=$rootDir/dd-java-agent/benchmark/build/reports/jmh/profiler.txt".toString()]
  failOnError = true // Should JMH fail immediately if any benchmark had experienced the unrecoverable error?
  warmup = '5s' // Time to spend at each warmup iteration.
  //  warmupBatchSize = 10 // Warmup batch size: number of benchmark method calls per operation.
  warmupForks = 0 // How many warmup forks to make for a single benchmark. 0 to disable warmup forks.
  warmupIterations = 1 // Number of warmup iterations to do.

  //  profilers = ['stack:lines=5;detailLine=true;period=5;excludePackages=true']
  // Use profilers to collect additional data. Supported profilers: [cl, comp, gc, stack, perf, perfnorm, perfasm, xperf, xperfasm, hs_cl, hs_comp, hs_gc, hs_rt, hs_thr]

  //  humanOutputFile = project.file("${project.buildDir}/reports/jmh/human.txt") // human-readable output file
  //  operationsPerInvocation = 10 // Operations per invocation.
  //  synchronizeIterations = false // Synchronize iterations?
  //timeout = '5s' // Timeout for benchmark iteration.
  //  includeTests = false
  // Allows to include test sources into generate JMH jar, i.e. use it when benchmarks depend on the test classes.

  duplicateClassesStrategy = DuplicatesStrategy.EXCLUDE
  jmhVersion = libs.versions.jmh.get()
}

tasks.named('jmh') {
  def includes = providers.gradleProperty('jmh.includes')
  if (!includes.isPresent() || includes.get().contains('ClassData')) {
    dependsOn 'prepareClassDataBenchmark'
  } else {
    dependsOn ':dd-java-agent:shadowJar'
  }
}

def classDataBenchmarkDir = layout.buildDirectory.dir('classdata-benchmark')
def agentShadowJar = project(':dd-java-agent').tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar)
def agentUnpackedShadowJar = project(':dd-java-agent').tasks.named('unpackedShadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar)
def benchmarkJavaExecutable = providers.provider {
  jmh.jvm.orNull ?: new File(System.getProperty('java.home'), 'bin/java').absolutePath
}

tasks.register('prepareClassDataBenchmark', JavaExec) {
  group = 'benchmark'
  description = 'Build deflated, stored, and packed classdata benchmark agent jars'
  dependsOn agentShadowJar, agentUnpackedShadowJar, tasks.named('jmhJar')
  classpath = sourceSets.jmh.runtimeClasspath
  mainClass = 'datadog.trace.bootstrap.ClassDataBenchmarkArtifacts'
  inputs.files agentShadowJar.flatMap { it.archiveFile }, agentUnpackedShadowJar.flatMap { it.archiveFile }
  outputs.dir classDataBenchmarkDir
  doFirst {
    setArgs([
      agentUnpackedShadowJar.get().archiveFile.get().asFile.absolutePath,
      classDataBenchmarkDir.get().asFile.absolutePath,
      benchmarkJavaExecutable.get(),
      tasks.named('jmhJar').get().archiveFile.get().asFile.absolutePath,
    ])
  }
  doLast {
    copy {
      from agentShadowJar.get().archiveFile
      into classDataBenchmarkDir
      rename { 'production.jar' }
    }
  }
}

jmh {
  jvmArgsAppend = ["-Ddatadog.classdata.benchmark.dir=${classDataBenchmarkDir.get().asFile.absolutePath}"]
}

tasks.register('classDataStartupBenchmark', JavaExec) {
  group = 'benchmark'
  description = 'Compare fresh-JVM startup across classdata archive variants'
  dependsOn 'prepareClassDataBenchmark', tasks.named('jmhJar')
  classpath = sourceSets.jmh.runtimeClasspath
  mainClass = 'datadog.trace.bootstrap.ClassDataStartupBenchmark'
  systemProperty 'datadog.classdata.benchmark.warmups',
    providers.systemProperty('datadog.classdata.benchmark.warmups').getOrElse('5')
  systemProperty 'datadog.classdata.benchmark.repetitions',
    providers.systemProperty('datadog.classdata.benchmark.repetitions').getOrElse('30')
  def layouts = providers.systemProperty('datadog.classdata.benchmark.layouts')
  if (layouts.isPresent()) {
    systemProperty 'datadog.classdata.benchmark.layouts', layouts.get()
  }
  doFirst {
    setArgs([
      classDataBenchmarkDir.get().asFile.absolutePath,
      benchmarkJavaExecutable.get(),
      tasks.named('jmhJar').get().archiveFile.get().asFile.absolutePath,
    ])
  }
}

/*
 If using libasyncProfiler, use the following to generate nice svg flamegraphs.
 sed '/unknown/d' dd-java-agent/benchmark/build/reports/jmh/profiler.txt | sed '/^thread_start/d' | sed '/not_walkable/d' > dd-java-agent/benchmark/build/reports/jmh/profiler-cleaned.txt
 (using https://github.com/brendangregg/FlameGraph)
 ./flamegraph.pl --color=java dd-java-agent/benchmark/build/reports/jmh/profiler-cleaned.txt > dd-java-agent/benchmark/build/reports/jmh/jmh-master.svg
 */
