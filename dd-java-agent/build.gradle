def expectedCommonClassDataPlan = { File unpackedJar ->
  byte[] instrumenterIndex
  new JarFile(unpackedJar).withCloseable { jar ->
    def entry = jar.getJarEntry('inst/instrumenter.index')
    if (entry == null) {
      throw new GradleException('Unpacked agent jar is missing inst/instrumenter.index')
    }
    instrumenterIndex = jar.getInputStream(entry).bytes
  }
  CommonClassDataTransformer.buildPlan(
    commonClassDataProfileClasses.get(),
    CommonClassDataTransformer.readModuleShards(instrumenterIndex),
    64)
}

tasks.register('generateCommonClassDataPlan') {
  group = LifecycleBasePlugin.BUILD_GROUP
  description = 'Regenerate the committed common class-data chunk plan'

  def unpackedJar = unpackedShadowJar.flatMap { it.archiveFile }
  inputs.file(commonClassDataManifest)
  inputs.file(unpackedJar)
  outputs.file(commonClassDataPlan)

  doLast {
    String expected = expectedCommonClassDataPlan(unpackedJar.get().asFile)
    commonClassDataPlan.setText(expected, 'UTF-8')
    logger.lifecycle(
      "Updated ${rootProject.relativePath(commonClassDataPlan)} with " +
      "${commonClassDataProfileClasses.get().size()} classes")
  }
}

tasks.register('verifyCommonClassDataPlan') {
  group = LifecycleBasePlugin.VERIFICATION_GROUP
  description = 'Verify the committed common class-data chunk plan is current'

  def unpackedJar = unpackedShadowJar.flatMap { it.archiveFile }
  inputs.file(commonClassDataManifest)
  inputs.file(commonClassDataPlan)
  inputs.file(unpackedJar)
  outputs.file(project.layout.buildDirectory.file("tmp/${it.name}/.verified"))

  doLast {
    String expected = expectedCommonClassDataPlan(unpackedJar.get().asFile)
    String actual = commonClassDataPlan.getText('UTF-8')
    if (actual != expected) {
      List<String> changes = CommonClassDataTransformer.describePlanChanges(
        actual.readLines(), expected.readLines())
      String details = changes.isEmpty()
        ? '  ~ class order or plan formatting changed'
        : changes.take(20).collect { "  ${it}" }.join('\n')
      if (changes.size() > 20) {
        details += "\n  ... and ${changes.size() - 20} more changes"
      }
      throw new GradleException(
      'Common class-data plan is stale:\n' + details +
      '\nRegenerate and review it with:\n' +
      '  ./gradlew :dd-java-agent:generateCommonClassDataPlan')
    }

    def marker = outputs.files.singleFile
    marker.parentFile.mkdirs()
    marker.text = 'verified'
  }
}

