import static org.gradle.api.file.DuplicatesStrategy.INCLUDE

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import com.github.jengelman.gradle.plugins.shadow.transformers.CacheableTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.PreserveFirstFoundResourceTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.ResourceTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.TransformerContext
import java.nio.charset.StandardCharsets
import java.util.concurrent.atomic.AtomicBoolean
import java.util.jar.JarFile
import org.apache.tools.zip.ZipEntry
import org.apache.tools.zip.ZipOutputStream
import org.gradle.api.file.FileTreeElement
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.Internal

@CacheableTransformer
class CommonClassDataTransformer implements ResourceTransformer {
  private static final String INDEX_ENTRY = 'dd-java-agent-common.classdata'
  private static final String SHARDS_ENTRY = 'dd-java-agent-common.shards'
  private static final String CHUNK_PREFIX = 'dd-java-agent-common/'
  private static final String INSTRUMENTER_INDEX_ENTRY = 'inst/instrumenter.index'
  private static final String CLASSDATA_SUFFIX = '.classdata'
  private static final int MAGIC = 0x44444344
  private static final int VERSION = 2
  private static final int HEADER_SIZE = 20
  private static final int RECORD_SIZE = 24

  @Input
  List<String> planLines = []

  @Input
  int maxChunkSize = 64

  @Internal
  final Map<String, byte[]> transformedClasses = new LinkedHashMap<>()

  @Internal
  byte[] instrumenterIndex

  @Internal
  Set<String> selectedClassNames

  @Internal
  List<Map<String, Object>> plannedClasses

  @Override
  boolean canTransformResource(FileTreeElement element) {
    if (element.path == INSTRUMENTER_INDEX_ENTRY) {
      return true
    }
    String className = className(element.path)
    if (className == null) {
      return false
    }
    if (selectedClassNames == null) {
      plannedClasses = parsePlan(planLines, maxChunkSize)
      selectedClassNames = plannedClasses.collect { it.className }.toSet()
    }
    selectedClassNames.contains(className)
  }

  @Override
  void transform(TransformerContext context) {
    if (context.path == INSTRUMENTER_INDEX_ENTRY) {
      if (instrumenterIndex != null) {
        throw new IOException("Duplicate ${INSTRUMENTER_INDEX_ENTRY}")
      }
      instrumenterIndex = context.inputStream.bytes
      return
    }
    String className = className(context.path)
    byte[] previous = transformedClasses.put(className, context.inputStream.bytes)
    if (previous != null) {
      throw new IOException("Duplicate selected class-data entry for ${className}")
    }
  }

  @Override
  boolean hasTransformedResource() {
    !transformedClasses.isEmpty()
  }

  @Override
  void modifyOutputStream(ZipOutputStream output, boolean preserveFileTimestamps) {
    if (plannedClasses == null) {
      plannedClasses = parsePlan(planLines, maxChunkSize)
    }
    List<String> missing = plannedClasses.collect { it.className }
    .findAll { !transformedClasses.containsKey(it) }
    if (!missing.isEmpty()) {
      throw new IOException(
      "Missing ${missing.size()} selected class-data entries, first entries: ${missing.take(5)}")
    }
    if (instrumenterIndex == null) {
      throw new IOException("Missing ${INSTRUMENTER_INDEX_ENTRY}")
    }

    Map<String, String> moduleShards = readModuleShards(instrumenterIndex)
    List<Map<String, Object>> records = []
    List<byte[]> chunks = []
    List<String> chunkShards = []
    ByteArrayOutputStream chunk = null
    int currentChunk = -1
    plannedClasses.each { Map<String, Object> planned ->
      String className = planned.className
      String expectedShard = moduleShards.get(className) ?: semanticShard(className)
      if (planned.shard != expectedShard) {
        throw new IOException(
        "Stale common class-data plan: ${className} is in ${planned.shard}, expected ${expectedShard}. " +
        'Run ./gradlew :dd-java-agent:generateCommonClassDataPlan')
      }
      if (planned.chunk != currentChunk) {
        if (chunk != null) {
          chunks.add(chunk.toByteArray())
        }
        currentChunk = planned.chunk as int
        chunk = new ByteArrayOutputStream()
        chunkShards.add(planned.shard as String)
      }
      byte[] classData = transformedClasses.get(className)
      records.add(
        [className: className, chunk: currentChunk, offset: chunk.size(), length: classData.length])
      chunk.write(classData)
    }
    if (chunk != null) {
      chunks.add(chunk.toByteArray())
    }

    writeEntry(output, INSTRUMENTER_INDEX_ENTRY, instrumenterIndex)
    writeEntry(output, INDEX_ENTRY, buildIndex(records, chunks.size()))
    writeEntry(output, SHARDS_ENTRY, buildShardIndex(chunkShards))
    chunks.eachWithIndex { byte[] contents, int index ->
      writeEntry(output, "${CHUNK_PREFIX}${index}${CLASSDATA_SUFFIX}", contents)
    }
    transformedClasses.clear()
    instrumenterIndex = null
  }

  static List<Map<String, Object>> parsePlan(List<String> lines, int maxChunkSize) {
    if (maxChunkSize <= 0) {
      throw new IllegalArgumentException('class-data maximum chunk size must be positive')
    }
    if (lines.isEmpty() || lines.first().trim() != '# common-classdata-plan-v1') {
      throw new IllegalArgumentException(
      'common class-data plan must start with # common-classdata-plan-v1')
    }

    List<Map<String, Object>> result = []
    Set<String> classNames = new HashSet<>()
    int currentChunk = -1
    int classesInChunk = 0
    String currentShard = null
    lines.eachWithIndex { String rawLine, int lineIndex ->
      String line = rawLine.trim()
      if (line.isEmpty() || line.startsWith('#')) {
        return
      }
      String[] fields = line.split('\t', -1)
      if (fields.length != 3) {
        throw new IllegalArgumentException(
        "Invalid common class-data plan line ${lineIndex + 1}: expected chunk, shard, and class")
      }
      int chunk
      try {
        chunk = Integer.parseInt(fields[0])
      } catch (NumberFormatException ignored) {
        throw new IllegalArgumentException(
        "Invalid common class-data chunk at line ${lineIndex + 1}: ${fields[0]}")
      }
      String shard = fields[1]
      String className = fields[2]
      if (!(shard ==~ /[a-z0-9][a-z0-9-]*/) || className.isEmpty()) {
        throw new IllegalArgumentException(
        "Invalid common class-data shard or class at line ${lineIndex + 1}")
      }
      if (chunk != currentChunk) {
        if (chunk != currentChunk + 1) {
          throw new IllegalArgumentException(
          "Common class-data chunks must be contiguous; found ${chunk} after ${currentChunk}")
        }
        currentChunk = chunk
        currentShard = shard
        classesInChunk = 0
      } else if (shard != currentShard) {
        throw new IllegalArgumentException(
        "Common class-data chunk ${chunk} contains both ${currentShard} and ${shard}")
      }
      if (++classesInChunk > maxChunkSize) {
        throw new IllegalArgumentException(
        "Common class-data chunk ${chunk} exceeds ${maxChunkSize} classes")
      }
      if (!classNames.add(className)) {
        throw new IllegalArgumentException("Duplicate common class-data class ${className}")
      }
      result.add([chunk: chunk, shard: shard, className: className])
    }
    if (result.isEmpty()) {
      throw new IllegalArgumentException('common class-data plan contains no classes')
    }
    result
  }

  static String buildPlan(
    List<String> classNames, Map<String, String> moduleShards, int chunkSize) {
    if (chunkSize <= 0) {
      throw new IllegalArgumentException('class-data chunk size must be positive')
    }
    if (classNames.toSet().size() != classNames.size()) {
      throw new IllegalArgumentException('common class-data profile contains duplicates')
    }

    Map<String, List<String>> shards = new LinkedHashMap<>()
    [
      'common-bytebuddy',
      'common-agent',
      'common-telemetry',
      'common-communication',
      'common-other',
      'early'
    ].each { shards.put(it, []) }
    Map<String, List<String>> targetShards = new TreeMap<>()
    classNames.each { String className ->
      String shard = moduleShards.get(className)
      if (shard == null) {
        shards.get(semanticShard(className)).add(className)
      } else if (shard == 'early') {
        shards.get('early').add(className)
      } else {
        targetShards.computeIfAbsent(shard) { [] }.add(className)
      }
    }
    shards.putAll(targetShards)

    StringBuilder plan = new StringBuilder('# common-classdata-plan-v1\n')
    plan.append('# Generated from metadata/common-classdata.txt; do not edit by hand.\n')
    plan.append('# Columns: global chunk, semantic/product shard, binary class name.\n')
    int chunk = 0
    shards.each { String shard, List<String> shardClasses ->
      shardClasses.eachWithIndex { String className, int index ->
        if (index > 0 && index % chunkSize == 0) {
          chunk++
        }
        plan.append(chunk).append('\t').append(shard).append('\t').append(className).append('\n')
      }
      if (!shardClasses.isEmpty()) {
        chunk++
      }
    }
    plan.toString()
  }

  static List<String> describePlanChanges(List<String> actualLines, List<String> expectedLines) {
    Map<String, Map<String, Object>> actual = parsePlan(actualLines, Integer.MAX_VALUE)
      .collectEntries { [(it.className): it] }
    Map<String, Map<String, Object>> expected = parsePlan(expectedLines, Integer.MAX_VALUE)
      .collectEntries { [(it.className): it] }
    List<String> changes = []

    (expected.keySet() - actual.keySet()).sort().each { String className ->
      Map<String, Object> record = expected[className]
      changes.add("+ ${className} -> ${record.shard}/${record.chunk}")
    }
    (actual.keySet() - expected.keySet()).sort().each { String className ->
      changes.add("- ${className} (was ${actual[className].shard}/${actual[className].chunk})")
    }
    (actual.keySet().intersect(expected.keySet()) as List<String>).sort().each { String className ->
      Map<String, Object> before = actual[className]
      Map<String, Object> after = expected[className]
      if (before.shard != after.shard) {
        changes.add("~ ${className} changed ${before.shard} -> ${after.shard}")
      } else if (before.chunk != after.chunk) {
        changes.add("~ ${className} moved from chunk ${before.chunk} to ${after.chunk}")
      }
    }
    changes
  }

  static Map<String, String> readModuleShards(byte[] index) {
    DataInputStream input = new DataInputStream(new ByteArrayInputStream(index))
    int moduleCount = input.readInt()
    input.readInt() // transformation count
    int packedLength = input.readInt()
    if (moduleCount < 0 || packedLength < 0) {
      throw new IOException('Invalid instrumenter index header')
    }
    byte[] packed = new byte[packedLength]
    input.readFully(packed)
    if (input.read() != -1) {
      throw new IOException('Unexpected trailing data in instrumenter index')
    }

    Map<String, String> result = new HashMap<>()
    int cursor = 0
    for (int module = 0; module < moduleCount; module++) {
      int nameLength = unsignedByte(packed, cursor++)
      requireAvailable(packed, cursor, nameLength + 4)
      String moduleName = new String(packed, cursor, nameLength, StandardCharsets.ISO_8859_1)
      cursor += nameLength
      int targetSystems = (unsignedByte(packed, cursor++) << 8) | unsignedByte(packed, cursor++)
      int flags = unsignedByte(packed, cursor++)
      int memberCount = unsignedByte(packed, cursor++)
      result.put(
        moduleName,
        (flags & 0x02) != 0
        ? 'early'
        : String.format(Locale.ROOT, 'targets-%04x', targetSystems))

      if (memberCount == 0xFF) {
        if ((flags & 0x01) != 0) {
          cursor = skipOverrides(packed, cursor)
        }
      } else {
        for (int member = 0; member < memberCount; member++) {
          int memberNameLength = unsignedByte(packed, cursor++)
          requireAvailable(packed, cursor, memberNameLength)
          cursor += memberNameLength
          if ((flags & 0x01) != 0) {
            cursor = skipOverrides(packed, cursor)
          }
        }
      }
    }
    if (cursor != packed.length) {
      throw new IOException(
      "Instrumenter index decoded ${cursor} of ${packed.length} packed-name bytes")
    }
    result
  }

  static String semanticShard(String className) {
    if (className.startsWith('net.bytebuddy.')) {
      return 'common-bytebuddy'
    }
    if (className.startsWith('datadog.trace.agent.')) {
      return 'common-agent'
    }
    if (className.startsWith('datadog.telemetry.')) {
      return 'common-telemetry'
    }
    if (className.startsWith('datadog.communication.') ||
      className.startsWith('datadog.okhttp3.') ||
      className.startsWith('datadog.okio.') ||
      className.startsWith('com.squareup.moshi.')) {
      return 'common-communication'
    }
    'common-other'
  }

  private static int skipOverrides(byte[] packed, int cursor) {
    int overrideCount = unsignedByte(packed, cursor++)
    for (int override = 0; override < overrideCount; override++) {
      int adviceNameLength = unsignedByte(packed, cursor++)
      requireAvailable(packed, cursor, adviceNameLength + 2)
      cursor += adviceNameLength + 2
    }
    cursor
  }

  private static int unsignedByte(byte[] packed, int offset) {
    requireAvailable(packed, offset, 1)
    packed[offset] & 0xFF
  }

  private static void requireAvailable(byte[] packed, int offset, int length) {
    if (offset < 0 || length < 0 || offset > packed.length - length) {
      throw new IOException('Truncated instrumenter index')
    }
  }

  private static byte[] buildShardIndex(List<String> chunkShards) {
    StringBuilder contents = new StringBuilder('version=1\n')
    chunkShards.eachWithIndex { String shard, int chunk ->
      contents.append(chunk).append('=').append(shard).append('\n')
    }
    contents.toString().getBytes(StandardCharsets.ISO_8859_1)
  }

  private static byte[] buildIndex(List<Map<String, Object>> records, int chunkCount) {
    int tableSize = 1
    while (tableSize < records.size() * 2) {
      tableSize <<= 1
    }
    int namesOffset = HEADER_SIZE + tableSize * RECORD_SIZE
    int nextNameOffset = namesOffset
    records.each { record ->
      record.nameOffset = nextNameOffset
      nextNameOffset += ((String) record.className).length() * 2
    }

    byte[] index = new byte[nextNameOffset]
    writeInt(index, 0, MAGIC)
    writeInt(index, 4, VERSION)
    writeInt(index, 8, records.size())
    writeInt(index, 12, chunkCount)
    writeInt(index, 16, tableSize)
    boolean[] occupied = new boolean[tableSize]
    records.each { record ->
      String className = record.className
      int slot = spread(className.hashCode()) & (tableSize - 1)
      while (occupied[slot]) {
        slot = (slot + 1) & (tableSize - 1)
      }
      occupied[slot] = true
      int recordOffset = HEADER_SIZE + slot * RECORD_SIZE
      writeInt(index, recordOffset, className.hashCode())
      writeInt(index, recordOffset + 4, record.nameOffset as int)
      writeInt(index, recordOffset + 8, className.length())
      writeInt(index, recordOffset + 12, record.chunk as int)
      writeInt(index, recordOffset + 16, record.offset as int)
      writeInt(index, recordOffset + 20, record.length as int)
      int nameOffset = record.nameOffset
      for (int i = 0; i < className.length(); i++) {
        int character = className.charAt(i) as int
        index[nameOffset++] = (byte) (character >>> 8)
        index[nameOffset++] = (byte) character
      }
    }
    index
  }

  private static void writeEntry(ZipOutputStream output, String name, byte[] contents) {
    ZipEntry entry = new ZipEntry(name)
    entry.time = 0
    output.putNextEntry(entry)
    output.write(contents)
    output.closeEntry()
  }

  private static String className(String path) {
    if (!path.endsWith(CLASSDATA_SUFFIX)) {
      return null
    }
    int prefixEnd = path.indexOf('/')
    if (prefixEnd < 0) {
      return null
    }
    path.substring(prefixEnd + 1, path.length() - CLASSDATA_SUFFIX.length()).replace('/', '.')
  }

  private static int spread(int hash) {
    hash ^ (hash >>> 16)
  }

  private static void writeInt(byte[] target, int offset, int value) {
    target[offset] = (byte) (value >>> 24)
    target[offset + 1] = (byte) (value >>> 16)
    target[offset + 2] = (byte) (value >>> 8)
    target[offset + 3] = (byte) value
  }
}

plugins {
  id 'com.gradleup.shadow'
  id 'dd-trace-java.conventions.java'
}

description = 'dd-java-agent'

apply from: "$rootDir/gradle/publish.gradle"

configurations {
  shadowInclude
  sharedShadowInclude
  traceShadowInclude
}

def includedAgentDir = project.layout.buildDirectory.dir("generated/included")
def includedJarFileTree = fileTree(includedAgentDir)
def commonClassDataManifest = rootProject.file('metadata/common-classdata.txt')
def commonClassDataPlan = rootProject.file('metadata/common-classdata-plan.txt')
def commonClassDataProfileClasses = providers.provider {
  commonClassDataManifest.readLines()
    .collect { it.trim() }
    .findAll { !it.isEmpty() && !it.startsWith('#') }
}
def commonClassDataPlanLines = providers.provider { commonClassDataPlan.readLines('UTF-8') }
def commonClassDataClasses = providers.provider {
  CommonClassDataTransformer.parsePlan(commonClassDataPlanLines.get(), 64)
    .collect { it.className as String }
}

// Populated automatically by includeShadowJar for every product dir registered in this build.
// Used by verifyAgentJarContents to check that all included products land in the assembled jar.
ext.includedProductPrefixes = objects.setProperty(String)

def pomPropertiesDir = project.layout.buildDirectory.dir("generated/maven-metadata")
def pomPropertiesFileTree = fileTree(pomPropertiesDir)

tasks.named("processResources") {
  dependsOn(includedJarFileTree)
  dependsOn(pomPropertiesFileTree)
}

tasks.named("sourcesJar") {
  dependsOn(pomPropertiesFileTree)
}

sourceSets {
  // The special pre-check must be compiled with Java 6 to detect unsupported
  // Java versions and prevent issues for users that still using them.
  "main_java6" {
    java.srcDirs "${project.projectDir}/src/main/java6"
  }
  // Additional checks that use the Java 11 API.
  "main_java11" {
    java.srcDirs "${project.projectDir}/src/main/java11"
  }
  main.resources.srcDirs(includedAgentDir, pomPropertiesDir)
}

def java6CompileTask = tasks.named("compileMain_java6Java") {
  configureCompiler(it, 8, JavaVersion.VERSION_1_6)
}

def java11CompileTask = tasks.named("compileMain_java11Java") {
  configureCompiler(it, 11)
}

tasks.named("compileJava") {
  dependsOn(java6CompileTask)
  dependsOn(java11CompileTask)
}

dependencies {
  implementation sourceSets.main_java11.output
  main_java11CompileOnly libs.forbiddenapis
  main_java6CompileOnly project(':components:annotations')
  main_java6CompileOnly libs.forbiddenapis
  testImplementation sourceSets.main_java6.output
}

/*
 * Several shadow jars are created
 * - The main "dd-java-agent" jar that also has the bootstrap project
 * - Major feature jars (trace, instrumentation, jmxfetch, profiling, appsec, iast, debugger, ci-visibility)
 * - A shared dependencies jar
 * This general config is shared by all of them
 */

def generalShadowJarConfig(ShadowJar shadowJarTask) {
  shadowJarTask.with {
    mergeServiceFiles()
    addMultiReleaseAttribute = false

    // Allow duplicate to merge service files
    duplicatesStrategy = INCLUDE
    // Ensure there is no duplicate in the final jar after resource transformer applied
    failOnDuplicateEntries = true

    // Vendored dependencies repeat license/notice metadata; keep a single copy
    transform(PreserveFirstFoundResourceTransformer) {
      it.include(
        'META-INF/LICENSE*',
        'META-INF/NOTICE*',
        'META-INF/AL2.0',
        'META-INF/LGPL2.1',
        )
    }

    // Remove some cruft from the final jar.
    // These patterns should NOT include **/META-INF/maven/**/pom.properties, which is
    // used to report our own dependencies, but we should remove the top-level metadata
    // of vendored packages because those could trigger unwanted framework checks.
    exclude '/META-INF/maven/org.slf4j/**'
    exclude '/META-INF/maven/org.snakeyaml/**'
    exclude '**/META-INF/maven/**/pom.xml'
    exclude '**/META-INF/proguard/'
    exclude '**/META-INF/*.kotlin_module'
    exclude '**/module-info.class'
    exclude '**/liblz4-java.so'
    exclude '**/liblz4-java.dylib'
    exclude '**/inst/META-INF/versions/**'
    exclude '**/META-INF/versions/*/org/yaml/**'
    exclude '**/package.html'
    exclude '**/about.html'

    // Used to generate Java code during build, no need to include original file
    exclude '**/*.trie'

    // Replaced by 'instrumenter.index', no need to include original service file
    exclude '**/META-INF/services/datadog.trace.agent.tooling.InstrumenterModule'

    // Prevents conflict with other SLF4J instances. Important for premain.
    relocate 'org.slf4j', 'datadog.slf4j'
    // Prevent conflicts with flat class-path when using GraalVM native-images
    relocate 'org.jctools', 'datadog.jctools'
    relocate 'net.jpountz', 'datadog.jpountz'
    // rewrite dependencies calling Logger.getLogger
    relocate 'java.util.logging.Logger', 'datadog.trace.bootstrap.PatchLogger'
    // patch JFFI loading mechanism to maintain isolation
    exclude '**/com/kenai/jffi/Init.class'
    relocate('com.kenai.jffi.Init', 'com.kenai.jffi.PatchInit')
    // patch OkHttp to avoid premain provider lookup and use daemon threads
    exclude '**/okhttp3/internal/platform/Platform.class'
    exclude '**/okhttp3/internal/Util$*.class'
    exclude '**/okhttp3/internal/Util.class'
    relocate('okhttp3.internal.platform.Platform', 'datadog.okhttp3.internal.platform.PatchPlatform')
    relocate('okhttp3.internal.Util', 'datadog.okhttp3.internal.PatchUtil')
    // use dd-instrument-java's embedded copy of asm
    relocate('org.objectweb.asm', 'datadog.instrument.asm')

    // Minimize and relocate the airlift compressor dependency for ZSTD
    exclude '**/io/airlift/compress/bzip2/**'
    exclude '**/io/airlift/compress/deflate/**'
    exclude '**/io/airlift/compress/gzip/**'
    exclude '**/io/airlift/compress/hadoop/**'
    exclude '**/io/airlift/compress/lz4/**'
    exclude '**/io/airlift/compress/lzo/**'
    exclude '**/io/airlift/compress/snappy/**'
    relocate 'io.airlift', 'datadog.io.airlift'

    // Minimize JNA, removing native libraries for unsupported environments
    exclude '**/com/sun/jna/aix-*/**'
    exclude '**/com/sun/jna/freebsd-*/**'
    exclude '**/com/sun/jna/linux-armel/**'
    exclude '**/com/sun/jna/linux-mips64el/**'
    exclude '**/com/sun/jna/linux-ppc/**'
    exclude '**/com/sun/jna/linux-ppc64le/**'
    exclude '**/com/sun/jna/linux-riscv64/**'
    exclude '**/com/sun/jna/linux-s390x/**'
    exclude '**/com/sun/jna/openbsd-*/**'
    exclude '**/com/sun/jna/sunos-*/**'

    // Minimize JFFI, removing native libraries for unsupported environments
    exclude '**/jni/*-AIX/**'
    exclude '**/jni/*-DragonFlyBSD/**'
    exclude '**/jni/*-FreeBSD/**'
    exclude '**/jni/loongarch64-Linux/**'
    exclude '**/jni/mips64el-Linux/**'
    exclude '**/jni/ppc64-Linux/**'
    exclude '**/jni/ppc64le-Linux/**'
    exclude '**/jni/s390x-Linux/**'
    exclude '**/jni/sparcv9-Linux/**'
    exclude '**/jni/*-OpenBSD/**'
    exclude '**/jni/*-SunOS/**'

    final String projectName = "${project.name}"

    // Prevents conflict with other instances, but doesn't relocate instrumentation
    if (!projectName.equals('instrumentation')) {
      relocate 'org.snakeyaml.engine', 'datadog.snakeyaml.engine'
      relocate 'org.yaml.snakeyaml.Yaml', 'datadog.trace.agent.jmxfetch.LegacyYaml'
      relocate 'okhttp3', 'datadog.okhttp3'
      relocate 'okio', 'datadog.okio'

      // embed an extra copy of our otel-shim for drop-in/extension support
      // extensions are remapped to avoid classpath conflicts; use same mapping here
      relocate 'io.opentelemetry.api', 'datadog.trace.bootstrap.otel.api'
      relocate 'io.opentelemetry.context', 'datadog.trace.bootstrap.otel.context'
      relocate 'datadog.opentelemetry.shim', 'datadog.trace.bootstrap.otel.shim'
    }

    if (!project.hasProperty("disableShadowRelocate") || !disableShadowRelocate) {
      // shadow OT impl to prevent casts to implementation
      relocate 'datadog.trace.common', 'datadog.trace.agent.common'
      relocate 'datadog.trace.core', 'datadog.trace.agent.core'
      relocate 'datadog.opentracing', 'datadog.trace.agent.ot'
      // shadow logging-utils that has slf4j in the API and is accessed from core
      relocate 'datadog.logging', 'datadog.trace.agent.logging'
    }
  }
}

def includeShadowJar(TaskProvider<ShadowJar> includedShadowJarTask, String agentDir, FileTree includedJarFileTree) {
  includedProductPrefixes.add(agentDir)

  def expandTask = project.tasks.register("expandAgentShadowJar${agentDir.capitalize()}", Sync) {
    it.group = LifecycleBasePlugin.BUILD_GROUP
    it.description = "Expand the included shadow jar into the agent jar under ${agentDir}"

    def opentracingFound = new AtomicBoolean()
    it.doFirst("detect-open-tracing") {
      eachFile {
        // We seem unlikely to use this name somewhere else.
        if (it.path.contains("opentracing") && it.name.contains("Format\$Builtin")) {
          opentracingFound.set(true)
        }
      }
    }
    it.doLast("fail-on-detected-opentracing") {
      if (opentracingFound.get()) {
        throw new GradleException("OpenTracing direct dependency found!")
      }
    }

    it.into providers.provider { new File(includedJarFileTree.dir, agentDir) }
    it.from(zipTree(includedShadowJarTask.map { it.archiveFile })) {
      rename '(^.*)\\.class$', '$1.classdata'
      // Rename LICENSE file since it clashes with license dir on non-case sensitive FSs (i.e. Mac)
      rename '^LICENSE$', 'LICENSE.renamed'
      if (agentDir == 'inst') {
        // byte-buddy now ships classes optimized for Java8+ under META-INF/versions/9
        // since we target Java8+ we can promote these classes over the pre-Java8 ones
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        eachFile {
          if (it.path.contains('META-INF/versions/9/net/bytebuddy')) {
            it.path = it.path.replace('META-INF/versions/9/', '')
          }
        }
      }
    }

    it.dependsOn includedShadowJarTask
  }

  includedJarFileTree.builtBy(expandTask)

  includedShadowJarTask.configure {
    generalShadowJarConfig(it as ShadowJar)
  }
}

