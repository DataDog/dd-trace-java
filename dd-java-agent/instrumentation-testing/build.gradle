plugins {
  id 'dd-trace-java.module.testing-support'
}

sourceSets {
  smokeAgent {
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  }
}

tasks.register('scopeDiagnosticsAgentJar', Jar) {
  archiveClassifier = 'scope-diagnostics-agent'
  manifest {
    attributes 'Premain-Class': 'datadog.trace.agent.test.smoke.ScopeDiagnosticsAgent',
    'Can-Retransform-Classes': 'true', 'Can-Redefine-Classes': 'true'
  }
  from(sourceSets.smokeAgent.output) {
    include 'datadog/trace/agent/test/smoke/**'
  }
  into('payload') {
    from(sourceSets.main.output) {
      include 'datadog/trace/agent/test/scopediag/**'
      exclude '**/ScopeDiagnosticsExtension*'
    }
    from(sourceSets.smokeAgent.output) {
      include 'datadog/trace/agent/test/scopediag/**'
    }
    rename '(.*)\\.class', '$1.classdata'
  }
}

dependencies {
  api libs.bytebuddy
  api libs.bytebuddyagent
  api libs.slf4j
  api libs.bundles.test.logging
  api libs.guava

  api project(':dd-java-agent:testing')
  api project(':products:metrics:metrics-api')
  api project(':products:metrics:metrics-lib')

  implementation project(':dd-java-agent:agent-debugger')

  implementation(libs.junit.jupiter)
  implementation "org.junit.platform:junit-platform-runner:${libs.versions.junit.platform.get()}"

  testImplementation project(':dd-java-agent:instrumentation:datadog:tracing:trace-annotation')

  testImplementation group: 'cglib', name: 'cglib', version: '3.2.5'
  // test instrumenting java 1.1 bytecode
  testImplementation group: 'net.sf.jt400', name: 'jt400', version: '6.1'

  // We have autoservices defined in test subtree, looks like we need this to be able to properly rebuild this
  testAnnotationProcessor libs.autoservice.processor
  testCompileOnly libs.autoservice.annotation

  compileOnly(libs.bundles.groovy)
  compileOnly(libs.bundles.spock)
}
