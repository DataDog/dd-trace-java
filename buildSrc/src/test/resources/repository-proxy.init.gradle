import org.gradle.api.artifacts.repositories.MavenArtifactRepository

// Routes the public repositories declared by TestKit builds (see GradleFixture) through the
// mirrors CI configures, so buildSrc tests do not hit Maven Central and get rate limited.
//
// This deliberately *replaces* the well-known public URLs rather than prepending a mirror the
// way settings.gradle.kts, gradle/repositories.gradle and build-logic's
// proxy-repositories.init.gradle.kts do. Those keep Maven Central as a fallback; here a fallback
// would defeat the purpose, because several tests point MAVEN_REPOSITORY_PROXY at a fake file:
// repository and rely on it fully shadowing Maven Central.
//
// Covers project, buildscript and settings-level repository containers. It does not reach
// included builds (no TestKit fixture uses one) nor the *implicit* gradlePluginPortal() default
// that applies when a build declares no pluginManagement repositories at all -- TestKit fixtures
// inject plugins with withPluginClasspath(), so they never resolve a plugin remotely.

def mavenProxyUrl = System.getenv("MAVEN_REPOSITORY_PROXY")?.trim()
def pluginProxyUrl = System.getenv("GRADLE_PLUGIN_PROXY")?.trim()

if (mavenProxyUrl || pluginProxyUrl) {
  def mavenCentralUrls = [
    "https://repo.maven.apache.org/maven2",
    "https://repo1.maven.org/maven2",
  ]
  def pluginPortalUrls = [
    "https://plugins.gradle.org/m2",
  ]

  def redirectRepository = { MavenArtifactRepository repository ->
    def repositoryUrl = repository.url.toString().replaceFirst('/+$', '')
    def target = null
    if (mavenProxyUrl && mavenCentralUrls.contains(repositoryUrl)) {
      target = mavenProxyUrl
    } else if (pluginProxyUrl && pluginPortalUrls.contains(repositoryUrl)) {
      target = pluginProxyUrl
    }
    if (target) {
      repository.url = uri(target)
      repository.allowInsecureProtocol = target.startsWith("http://")
    }
  }

  def redirectAll = { repositories ->
    repositories.withType(MavenArtifactRepository).configureEach(redirectRepository)
  }

  gradle.beforeSettings { settings ->
    redirectAll(settings.buildscript.repositories)
    redirectAll(settings.pluginManagement.repositories)
    redirectAll(settings.dependencyResolutionManagement.repositories)
  }

  gradle.beforeProject { project ->
    redirectAll(project.repositories)
    redirectAll(project.buildscript.repositories)
  }
}
