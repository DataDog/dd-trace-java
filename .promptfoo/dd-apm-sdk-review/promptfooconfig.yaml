description: "dd-apm-sdk-review skill eval (local, no git — pasted diff / pasted snippet only)"

# Written on every `promptfoo eval` run; matches the .gitignore rule for
# .promptfoo/**/results*.json (embeds local machine paths, never commit it).
outputPath: ./results.json

prompts:
  - "{{input}}"

providers:
  - id: anthropic:claude-agent-sdk
    label: "dd-apm-sdk-review via claude-agent-sdk"
    config:
      apiKeyRequired: false
      working_dir: "../.."
      setting_sources: ["project"]
      skills: ["dd-apm-sdk-review"]
      disallowed_tools: ["Bash"]
      permission_mode: "default"
defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-haiku-4-5-20251001
      config:
        temperature: 0

tests:
  - file://tests/dd-apm-sdk-review.yaml
