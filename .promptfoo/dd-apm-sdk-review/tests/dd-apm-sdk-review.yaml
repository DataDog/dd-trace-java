           APPROVE_WITH_COMMENTS or APPROVE — this repo's severity rubric maps a P0
           finding to BLOCK with no exception) and ends with the final statement
           `DO NOT PUSH` (not READY TO PUSH).
      threshold: 0.8

- description: "Logic bug — capture expressions evaluated before the send/sampling decision is final (mined from dd-trace-java PR #12207 fix;)"
  vars:
    input: |
      Run dd-apm-sdk-review on the following change. There is no git repository to
      inspect — this diff is the entire change set; do not attempt any git commands, go
      straight to running the reviewers on the pasted content below.

      ```diff
      diff --git a/dd-java-agent/agent-debugger/src/main/java/com/datadog/debugger/probe/LogProbe.java b/dd-java-agent/agent-debugger/src/main/java/com/datadog/debugger/probe/LogProbe.java
      @@ -700,6 +700,20 @@ public class LogProbe extends ProbeDefinition implements Sampled, CapturedContext.Status {
      +  // PR #12207: processCaptureExpressions() runs for every hit, regardless of
      +  // whether the probe's condition/sampler has already decided this hit will
      +  // not be sent. logStatus.shouldSend() reflects that effective send decision
      +  // and is already computed by the caller before this method runs.
      +  private void processCaptureExpressions(CapturedContext context, LogStatus logStatus) {
      +    if (captureExpressions == null) {
      +      return;
      +    }
      +    for (CaptureExpression captureExpression : captureExpressions) {
      +      try {
      +        context.addCaptureExpression(captureExpression.evaluate(context));
      +      } catch (Exception ex) {
      +        DEBUGGER_METRICS.increment(EVALUATION_ERROR);
      +        reportEvaluationError(captureExpression, ex);
      +      }
      +    }
      +  }
      ```
  assert:
