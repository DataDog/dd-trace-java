    - type: llm-rubric
      value: |
        The review report must satisfy ALL of the following, or it fails:
        1. Flags that `firstSpanWritten` is an instance field on `TraceMapperV0_4`
           that is only ever set to `true` (at the end of the first span of the
           first chunk it maps) and is never reset back to `false` at the start of
           `map()`. It is not enough to note that the flag exists or that it drives
           the `!firstSpanWritten` argument; the report must call out that nothing
           re-initializes it before mapping the next trace chunk.
        2. Explains the concrete consequence given that this mapper instance is
           reused/held across every trace chunk sent for the writer's lifetime (per
           the comment): once the first chunk ever mapped sets `firstSpanWritten` to
           `true`, every subsequent, unrelated trace chunk mapped by the same
           instance sees `!firstSpanWritten == false` for its own first span, so
           process/propagation tags (`dd-p-*` baggage) are silently never written
           for any chunk after the first one — not a crash, a silent cross-payload
           data-loss bug caused by leaked state on a reused object.
        3. Recommends resetting `firstSpanWritten` to `false` at the start of each
           `map()` call (or introducing an explicit `reset()` hook invoked before
           each `map()` invocation), rather than only "make the field volatile" or
           "add logging when tags are skipped".
        4. States an explicit verdict line (BLOCK, APPROVE_WITH_COMMENTS, or APPROVE)
           and a final READY TO PUSH / DO NOT PUSH statement.
      threshold: 0.8
