- description: "Lens-direct — performance.md flags a wrong/unbounded collection (J12 + universal #3)"
  vars:
    input: |
      Apply this repo's performance-review criteria (reviewers/performance.md, its
      .agents/dd-apm-sdk-review-overrides/reviewers/performance.md override, and _common.md) to the
      following method. No git checkout available — this snippet is the entire change to
      review.

      ```java
      private final Map<String, Object> sessionCache = new LinkedHashMap<>();

      void recordSession(String sessionId, Object payload) {
        sessionCache.put(sessionId, payload);
      }
      ```
  assert:
    # Deterministic pre-filters: fast, free, catch the clearest failure modes outright.
    - type: icontains
      value: "LinkedHashMap"
    - type: icontains
      value: "HashMap"
    - type: not-icontains
      value: "ConcurrentHashtable"
      metric: no-hallucinated-toolkit-name
    # Nuanced judgment: did it actually reason about *why*, and did it catch both findings?
    - type: llm-rubric
      value: |
        The review response must satisfy ALL of the following, or it fails:
        1. Flags the LinkedHashMap as the wrong collection type (this repo's performance
           rubric addendum J12): explains that ordering isn't relied on here, and
           recommends a plain HashMap as the concrete fix — not a vague "reconsider the
           data structure" and not merely a style nit with no cost explanation.
        2. Separately flags that the map is unbounded and keyed by a high-cardinality
           value (sessionId) — a SEV-1-class concern under this rubric's universal
           check #3 — and classifies the finding under this skill's P0/P1/P2 scale
           (not left as a bare "SEV-1" label with no P-mapping).
        3. Does not invent a Datadog-internal collection/utility type name that isn't
           part of this repo's real toolkit (Strings, SubSequence, HashingUtils,
           Hashtable, RE2J).
      threshold: 0.8

- description: "Full-pipeline — dd-apm-sdk-review skill on a pasted diff, no git"
  vars:
    input: |
      Run dd-apm-sdk-review on the following change. There is no git repository to
      inspect — this diff is the entire change set; do not attempt any git commands, go
      straight to running the reviewers on the pasted content below.

      ```diff
      diff --git a/dd-trace-core/src/main/java/datadog/trace/core/SpanCache.java b/dd-trace-core/src/main/java/datadog/trace/core/SpanCache.java
      index 1111111..2222222 100644
      --- a/dd-trace-core/src/main/java/datadog/trace/core/SpanCache.java
      +++ b/dd-trace-core/src/main/java/datadog/trace/core/SpanCache.java
      @@ -10,6 +10,10 @@ class SpanCache {
      -  private final Map<String, Span> byResource = new HashMap<>();
      +  private final Map<String, Span> byResource = new LinkedHashMap<>();
      +
      +  String describe(String resourceName) {
      +    return String.format("resource=%s", resourceName);
      +  }
      ```
  assert:

    - type: javascript
      value: |
        const calls = context.providerResponse?.metadata?.toolCalls || [];
        const hit = calls.some((call) => {
          if (call.name !== 'Skill') return false;
          const blob = JSON.stringify(call.input || {});
          return blob.includes('dd-apm-sdk-review');
        });
        return hit || {
          pass: false,
          score: 0,
          reason: 'Skill tool was not invoked with dd-apm-sdk-review. toolCalls=' +
            JSON.stringify(calls.map((c) => ({ name: c.name, input: c.input })))
        };

    - type: icontains
      value: "pasted diff, no git"
    - type: icontains
      value: "Rule files used"
    - type: not-icontains
      value: "git diff"
      metric: no-attempted-git-commands
    - type: llm-rubric
      value: |
        The review report must satisfy ALL of the following, or it fails:
        1. Raises a performance finding on the LinkedHashMap swap (addendum J12) and/or
           the newly-added hot-path String.format call (addendum J10).
        2. Classifies every finding under this report's P0/P1/P2 sections — never leaves
           a finding stated only in the performance lens's internal SEV-1/SEV-2/SEV-3
           vocabulary with no P-level mapping.
        3. States an explicit verdict line (BLOCK, APPROVE_WITH_COMMENTS, or APPROVE) and
           a final READY TO PUSH / DO NOT PUSH statement.
      threshold: 0.8

- description: "Security (control) — JVM crash-handler flag set before trust/ownership validation completes (mined from dd-trace-java PR #11613 review comment, pre-fix code; java has no security.md override yet)"
  vars:
    input: |
      Run dd-apm-sdk-review on the following change. There is no git repository to
      inspect — this diff is the entire change set; do not attempt any git commands, go
      straight to running the reviewers on the pasted content below.

      ```diff
      diff --git a/dd-java-agent/agent-crashtracking/src/main/java/datadog/crashtracking/Initializer.java b/dd-java-agent/agent-crashtracking/src/main/java/datadog/crashtracking/Initializer.java
      @@ -358,10 +358,16 @@ private static void initializeCrashUploader(FlagAccess flags) {
      +      // set the JVM flag
      +      boolean rslt = flags.setValue("OnError", onErrorVal);
      +      if (!rslt && LOG.isDebugEnabled()) {
      +        LOG.debug(
      +            SEND_TELEMETRY,
      +            "Unable to set OnError flag to {}. Crash-tracking may not work.",
      +            onErrorVal);
      +      }
      +
      +      // validate the script directory/file is owned by this JVM user and not
      +      // group/world-writable before trusting it; if a pre-existing dir/script
      +      // fails this check, initialize() returns false and skips writing config.
      +      CrashUploaderScriptInitializer.initialize(uploadScript, onErrorFile);
      ```
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse?.metadata?.toolCalls || [];
        const hit = calls.some((call) => {
          if (call.name !== 'Skill') return false;
          const blob = JSON.stringify(call.input || {});
          return blob.includes('dd-apm-sdk-review');
        });
        return hit || {
          pass: false,
          score: 0,
          reason: 'Skill tool was not invoked with dd-apm-sdk-review. toolCalls=' +
            JSON.stringify(calls.map((c) => ({ name: c.name, input: c.input })))
        };

    - type: icontains
      value: "Rule files used"
    - type: not-icontains
      value: "git diff"
      metric: no-attempted-git-commands

    - type: llm-rubric
      value: |
        The review report must satisfy ALL of the following, or it fails:
        1. Flags that the JVM handler flag (`OnError`) is set to the target script/path
           BEFORE `CrashUploaderScriptInitializer.initialize(...)` — the ownership/trust
           validation — has run and returned a result. It is not enough to note that a
           validation step exists; the report must call out the ordering problem: if
           `initialize(...)` later rejects the path (e.g. pre-existing dir/script not
           owned by the JVM user, or group/world-writable), the flag has already been
           committed to the untrusted path and the JVM crash handler will still execute
           it on a crash.
        2. Classifies this as a security finding (P0 or P1, not merely a style/maintainability
           nit) — this is a security control that can be silently bypassed (the check runs
           but has no effect on the already-configured handler), which is exactly the P0
           bar in this repo's severity rubric ("security control can be silently bypassed").
        3. Recommends gating the flag-setter on the validator's result (e.g.
           `if (initialize(...)) { flags.setValue(...) }`) or clearing/restoring the flag
           on validation failure — not just "add more logging" or "add a comment".
        4. States the verdict line as exactly `Verdict: BLOCK` (not
           APPROVE_WITH_COMMENTS or APPROVE — this repo's severity rubric maps a P0
           finding to BLOCK with no exception) and ends with the final statement
           `DO NOT PUSH` (not READY TO PUSH).
      threshold: 0.8
