      diff --git a/dd-trace-core/src/main/java/datadog/trace/common/writer/ddagent/TraceMapperV1.java b/dd-trace-core/src/main/java/datadog/trace/common/writer/ddagent/TraceMapperV1.java
      @@ -203,12 +203,12 @@ public final class TraceMapperV1 implements TraceMapper {
      +  // PR #12107: eventsObject comes from the SPAN_EVENTS tag. Most call paths set
      +  // it as a List (structured events built in-process), but the OTel bridge sets
      +  // it as a pre-serialized JSON string (a CharSequence) instead.
      +  private void encodeSpanEvents(Writable writable, int fieldId, Object eventsObject) {
      +    writable.writeInt(fieldId);
      +    if (!(eventsObject instanceof List) || ((List<?>) eventsObject).isEmpty()) {
      +      writable.startArray(0);
      +      return;
      +    }
      +
      +    List<?> events = (List<?>) eventsObject;
      +    int encodableCount = 0;
      +    for (Object event : events) {
      +      if (isEncodableSpanEvent(event)) {
      +        encodableCount++;
      +      }
      +    }
      +    writable.startArray(encodableCount);
      +    for (Object event : events) {
      +      if (isEncodableSpanEvent(event)) {
      +        encodeSpanEvent(writable, (Map<?, ?>) event);
      +      }
      +    }
      +  }
