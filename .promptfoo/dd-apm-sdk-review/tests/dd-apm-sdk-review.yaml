- description: "Resource leak — jar entry InputStream and Files.walk() directory stream never closed (mined from dd-trace-java PR #12143 fix; pre-fix code)"
  vars:
    input: |
      Run dd-apm-sdk-review on the following change. There is no git repository to
      inspect — this diff is the entire change set; do not attempt any git commands, go
      straight to running the reviewers on the pasted content below.

      ```diff
      diff --git a/dd-java-agent/agent-debugger/src/main/java/com/datadog/debugger/symbol/SymbolAggregator.java b/dd-java-agent/agent-debugger/src/main/java/com/datadog/debugger/symbol/SymbolAggregator.java
      @@ -270,10 +270,10 @@ public class SymbolAggregator {
      +  // PR #12143: parse a single .class entry out of the scanned jar and hand its
      +  // bytes to parseClass(). jarFile itself is opened in a try-with-resources
      +  // block by the caller.
      +  private void parseJarEntry(
      +      SymDBReport symDBReport,
      +      JarFile jarFile,
      +      JarEntry jarEntry,
      +      Path jarPath,
      +      ByteArrayOutputStream baos,
      +      byte[] buffer) {
      +    LOGGER.debug("parsing jarEntry class: {}", jarEntry.getName());
      +    try {
      +      InputStream inputStream = jarFile.getInputStream(jarEntry);
      +      int readBytes;
      +      baos.reset();
      +      while ((readBytes = inputStream.read(buffer)) != -1) {
      +        baos.write(buffer, 0, readBytes);
      +      }
      +      parseClass(symDBReport, jarEntry.getName(), baos.toByteArray(), jarPath.toString());
      +    } catch (IOException ex) {
      +      LOGGER.warn("Failed to parse jar entry {}", jarEntry.getName(), ex);
      +    }
      +  }
      +
      +  // Directory-scan counterpart of the jar path above: walks jarPath looking for
      +  // .class files on disk instead of inside a jar.
      +  private void scanDirectory(
      +      Path jarPath,
      +      Set<String> alreadyScannedJars,
      +      ByteArrayOutputStream baos,
      +      byte[] buffer,
      +      SymDBReport symDBReport) {
      +    try {
      +      Files.walk(jarPath)
      +          // explicitly no follow links walking the directory to avoid cycles
      +          .filter(path -> Files.isRegularFile(path, LinkOption.NOFOLLOW_LINKS))
      +          .filter(path -> path.toString().endsWith(".class"))
      +          .forEach(path -> parseClassFile(symDBReport, path, baos, buffer));
      +    } catch (IOException ex) {
      +      LOGGER.warn("Failed to walk directory {}", jarPath, ex);
      +    }
      +    alreadyScannedJars.add(jarPath.toString());
      +  }
      ```
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse?.metadata?.toolCalls || [];
        const hit = calls.some((call) => {
          if (call.name !== 'Skill') return false;
          const blob = JSON.stringify(call.input || {});
          return blob.includes('dd-apm-sdk-review');
        });
        return hit || {
          pass: false,
          score: 0,
          reason: 'Skill tool was not invoked with dd-apm-sdk-review. toolCalls=' +
            JSON.stringify(calls.map((c) => ({ name: c.name, input: c.input })))
        };

    - type: icontains
      value: "Rule files used"
    - type: javascript
      value: |
        const calls = context.providerResponse?.metadata?.toolCalls || [];
        const hit = calls.some((call) => {
          const name = (call.name || '').toLowerCase();
          if (name !== 'bash' && name !== 'git') return false;
          const blob = JSON.stringify(call.input || {});
          return /\bgit\b/.test(blob);
        });
        return !hit || {
          pass: false,
          score: 0,
          reason: 'A git command was actually invoked despite no git checkout being available. toolCalls=' +
            JSON.stringify(calls.map((c) => ({ name: c.name, input: c.input })))
        };
      metric: no-attempted-git-commands

    - type: llm-rubric
      value: |
        The review report must satisfy ALL of the following, or it fails:
        1. Flags that `parseJarEntry()` obtains `inputStream` from
           `jarFile.getInputStream(jarEntry)` and never closes it — no
           try-with-resources, no explicit `close()` in a `finally`. It is not
           enough to note that the method reads bytes into a buffer; the report must
           call out the missing close of the `InputStream` itself.
        2. Explains the concrete consequence: leaving the entry stream open means the
           `JarFile` cannot return its native `Inflater` to its internal cache, so
           each `.class` entry scanned allocates a fresh native/off-heap
           decompression context instead of reusing one — scanning a large jar can
           burst hundreds of MB of native memory and risks OOM-killing a
           memory-constrained container. This must be framed as a resource leak, not
           a style nit.
        3. Separately flags, as its own finding, that `scanDirectory()`'s
           `Files.walk(jarPath)` call is also never closed (the returned
           `Stream<Path>` holds an open directory handle) — do not fold this into
           the `parseJarEntry` finding just because both are on the same theme.
        4. Recommends wrapping both the `InputStream` and the `Files.walk()` stream
           in try-with-resources, not merely "add a finally block that logs" or
           "catch a broader exception type".
        5. States an explicit verdict line (BLOCK, APPROVE_WITH_COMMENTS, or APPROVE)
           and a final READY TO PUSH / DO NOT PUSH statement.
      threshold: 0.8

