        const hit = calls.some((call) => {
          const name = (call.name || '').toLowerCase();
          if (name !== 'bash' && name !== 'git') return false;
          const blob = JSON.stringify(call.input || {});
          return /\bgit\b/.test(blob);
        });
        return !hit || {
          pass: false,
          score: 0,
          reason: 'A git command was actually invoked despite no git checkout being available. toolCalls=' +
            JSON.stringify(calls.map((c) => ({ name: c.name, input: c.input })))
        };
      metric: no-attempted-git-commands

    - type: llm-rubric
      value: |
        The review report must satisfy ALL of the following, or it fails:
        1. Flags that `processCaptureExpressions()` evaluates every capture expression
           as soon as `captureExpressions` is non-null, without checking
           `logStatus.shouldSend()` — the effective send/sampling decision that the
           caller has already computed before this method runs. It is not enough to
           note "there's a null check here"; the report must call out that the method
           does expensive/fallible work (expression evaluation) even when the hit's
           condition or sampler has already decided the hit will not be sent.
        2. Explains the concrete consequence: a hit that is rejected or rate-limited
           still pays for expression evaluation, so a broken/failing capture
           expression on a hot method produces an unthrottled stream of evaluation
           errors (`reportEvaluationError`) for every hit, not just the ones actually
           sent — i.e. this is a reliability/performance concern, not a cosmetic one.
        3. Recommends gating the evaluation loop on the send decision, e.g.
           `if (captureExpressions == null || !logStatus.shouldSend()) { return; }`,
           rather than just "add rate limiting to the error reporting" or "wrap in a
           broader try/catch".
        4. States an explicit verdict line (BLOCK, APPROVE_WITH_COMMENTS, or APPROVE)
           and a final READY TO PUSH / DO NOT PUSH statement.
      threshold: 0.8

