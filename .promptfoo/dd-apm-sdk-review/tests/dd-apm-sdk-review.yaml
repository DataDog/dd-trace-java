           the report must call out that a non-`List` input is silently treated as
           "no events" rather than being recognized as an alternate valid
           representation of the same data.
        2. Explains the concrete consequence: spans produced via the OTel bridge (or
           any other call path that sets span events as a JSON string instead of a
           `List`) will have their span events silently dropped from the encoded v1
           payload — no exception, no log, just an empty events array — i.e. this is
           a silent data-loss bug, not a crash.
        3. Recommends adding a parsing/normalization step that recognizes the
           `CharSequence`/JSON-string representation and converts it into a `List`
           before the existing List-shaped encoding logic runs, rather than only
           "add a null check" or "log a warning when eventsObject isn't a List".
        4. States an explicit verdict line (BLOCK, APPROVE_WITH_COMMENTS, or APPROVE)
           and a final READY TO PUSH / DO NOT PUSH statement.
      threshold: 0.8

- description: "Serialization bug — stateful mapper reused across writes without resetting per-payload state (mined from dd-trace-java PR #12096 fix; pre-fix code)"
  vars:
    input: |
      Run dd-apm-sdk-review on the following change. There is no git repository to
      inspect — this diff is the entire change set; do not attempt any git commands, go
      straight to running the reviewers on the pasted content below.

      ```diff
      diff --git a/dd-trace-core/src/main/java/datadog/trace/common/writer/ddagent/TraceMapperV0_4.java b/dd-trace-core/src/main/java/datadog/trace/common/writer/ddagent/TraceMapperV0_4.java
      @@ -300,10 +300,20 @@ public final class TraceMapperV0_4 implements TraceMapper {
      +  // PR #12096: process/propagation tags (dd-p-*) must be written once per
      +  // payload, on the first span of the trace chunk currently being mapped.
      +  // This TraceMapperV0_4 instance is held by DDAgentWriter and reused across
      +  // every trace chunk sent for the lifetime of the writer.
      +  private boolean firstSpanWritten;
      +
      +  @Override
      +  public void map(List<? extends CoreSpan<?>> trace, Writable writable) {
      +    writable.startArray(trace.size());
      +    for (int i = 0; i < trace.size(); i++) {
      +      CoreSpan<?> span = trace.get(i);
      +      writeSpanFields(writable, span);
      +      span.processTagsAndBaggage(
      +          metaWriter
      +              .withWritable(writable)
      +              .forSpan(i == 0, i == trace.size() - 1, !firstSpanWritten));
      +      firstSpanWritten = true;
      +    }
      +  }
      ```
  assert:
    - type: javascript
      value: |
