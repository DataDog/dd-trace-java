name: Check required benchmarks
on:
  pull_request:
    types: [opened, reopened, edited, ready_for_review, labeled, unlabeled, synchronize]
    branches:
      - master
      - "release/v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_required_benchmarks:
    name: Check required benchmarks
    # Skip draft pull requests: results are expected once the change is reviewable
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read # Required to check out the pull request changes
      id-token: write # Required for OIDC token federation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # The check compares the base, the head and the commit the results name
          filter: blob:none # Only trees are needed to list changed paths
          persist-credentials: false
      - name: Check the description for the required results
        id: check
        env:
          # Passed through the environment, never interpolated into the script
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 tooling/benchmark_pr.py check \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --body-file "$RUNNER_TEMP/pr-body.md" --labels "$PR_LABELS" \
            > "$RUNNER_TEMP/check-message.txt"
          status=$?
          cat "$RUNNER_TEMP/check-message.txt"
          {
            echo "passed=$([ "$status" -eq 0 ] && echo true || echo false)"
            echo "message<<CHECK_MESSAGE_EOF"
            cat "$RUNNER_TEMP/check-message.txt"
            echo "CHECK_MESSAGE_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/dd-trace-java
          policy: self.check-required-benchmarks
      - name: Report the result on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # 9.0.0
        env:
          PASSED: ${{ steps.check.outputs.passed }}
          MESSAGE: ${{ steps.check.outputs.message }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const managedMarker = '<!-- dd-trace-java-check-required-benchmarks -->'
            const overrideLabel = 'tag: no perf impact'

            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            })
            const existingComment = comments.find(comment => comment.body?.includes(managedMarker))

            if (process.env.PASSED === 'true') {
              if (existingComment) {
                await github.rest.issues.deleteComment({
                  comment_id: existingComment.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo
                })
              }
              console.log(process.env.MESSAGE)
              return
            }

            const body = `**❌ Benchmark results required**\n\n` +
              `${process.env.MESSAGE}\n\n` +
              `This pull request changes code listed in \`.github/required-benchmarks.txt\`, so its description ` +
              `must include the listed benchmarks' results for its base and head commits. Run:\n\n` +
              '```\ntooling/benchmark_pr.py run\n```\n\n' +
              `and paste the \`## Benchmarks\` section it prints into the description. ` +
              `See [Core performance rules](https://github.com/DataDog/dd-trace-java/blob/master/AGENTS.md#core-performance-rules).\n\n` +
              `If the change can't affect performance (comments, renames), add the \`${overrideLabel}\` label ` +
              `and say why in the description.\n\n` +
              managedMarker
            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              })
            } else {
              await github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              })
            }
            core.setFailed(`${process.env.MESSAGE} See the PR comment for details.`)
