org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-XX:MaxMetaspaceSize=1g

# Toggle on to get more details during IJ sync
#org.gradle.logging.level=info

# Max number of Testcontainers-backed test tasks allowed to run concurrently.
# Override in CI or locally to trade CI throughput against resource pressure
# (containers, memory, ports), e.g. -Ptestcontainers.max.parallel.usages=3
testcontainers.max.parallel.usages=3
# Override the fork limit for Testcontainers modules.
testcontainers.max.parallel.forks=4

# Max test JVMs within each forked test task.
forked.test.max.parallel.forks=4

# CI use constrained org.gradle.java.installations settings
