org.gradle.parallel=true
org.gradle.caching=true
# open-java-format reads javac's parser inside the Gradle JVM.
org.gradle.jvmargs=-XX:MaxMetaspaceSize=1g --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Toggle on to get more details during IJ sync
#org.gradle.logging.level=info

# Max number of Testcontainers-backed test tasks allowed to run concurrently.
# Override in CI or locally to trade CI throughput against resource pressure
# (containers, memory, ports), e.g. -PtestcontainersMaxParallelUsages=3
testcontainersMaxParallelUsages=2

# CI use constrained org.gradle.java.installations settings
