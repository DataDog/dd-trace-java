name: java-agent-smoke
version: "0.2"
cases:
  # Ground truth: dd-trace-core/build.gradle, docs/how_to_test.md, and CONTRIBUTING.md.
  - id: java-core-validation-001
    files: [AGENTS.md, .claude/CLAUDE.md]
    only_warn: true
    input: |
      I changed Java code in dd-trace-core. Which tests and formatting checks
      should I run locally before requesting review? Keep tests scoped to that module.
      Read local files as needed. Give commands and a brief explanation, but do not
      run commands, edit files, or use external services.
    expected_criteria:
      - Uses the Gradle wrapper to run the module's tests, such as ./gradlew :dd-trace-core:test.
      - Notes that separate-JVM tests use :dd-trace-core:forkedTest; test alone does not run those tests.
      - Uses Spotless for formatting, with spotlessCheck or spotlessApply; module-qualified tasks are valid.
      - Gives focused validation steps and distinguishes proposed commands from checks actually performed.
    bad_signals:
      - Uses the whole-repository test suite or a clean build as the only way to validate this module change.

  # Ground truth: docs/how_to_test_with_junit.md and CONTRIBUTING.md#static-imports.
  - id: java-unit-test-conventions-001
    files: [AGENTS.md, .claude/CLAUDE.md]
    only_warn: true
    input: |
      I am adding a Java unit test in an existing JUnit 5 module. A helper returns
      true for null or whitespace and false for nonblank text. Show a small
      parameterized test for these literal input/expected-result pairs using
      this repository's conventions, and explain the import style.
      Read local files as needed. Give an example only; do not run commands,
      edit files, or use external services.
    expected_criteria:
      - Uses Java and JUnit 5, with a boolean assertion matching each input and expected result.
      - Uses the project's TableTest support for the literal input/expected-result columns, including a null case.
      - Uses explicit static imports for assertion helpers and avoids wildcard imports.
      - Keeps the example focused on the new test without requiring unrelated migrations or build changes.
    bad_signals:
      - Uses Groovy/Spock or JUnit 4 for this new unit test.
      - Uses wildcard imports or invents a different test framework or Gradle target.

  # Ground truth: docs/bootstrap_design_guidelines.md (very early bootstrap and Java NIO).
  - id: java-premain-safety-001
    files: [AGENTS.md, .claude/CLAUDE.md]
    only_warn: true
    input: |
      During very early AgentBootstrap startup, before the internal logger is
      configured, I need to read a small file and report a failure. Is using
      java.nio.file.Files and java.util.logging appropriate? Recommend a small,
      compatible approach and explain any startup constraints.
      Read local files as needed. Give guidance only; do not run commands,
      edit files, or use external services.
    expected_criteria:
      - Avoids java.nio.file and java.util.logging in this early premain path.
      - Suggests java.io for the file access and System.err for diagnostics before the internal logger is ready.
      - Explains the risk of initializing application-configurable JVM facilities before the application configures them.
      - Limits the early-startup advice to its stated context rather than banning normal logging throughout the tracer.
    bad_signals:
      - Recommends initializing the default NIO filesystem or JUL during early bootstrap.
      - Uses System.out for early agent diagnostics or assumes the internal logger is already configured.

  # Control: general Java behavior not taught by AGENTS.md.
  # Ground truth: Java 8 Collections.unmodifiableList is a view; ArrayList(Collection) makes a copy.
  # https://docs.oracle.com/javase/8/docs/api/java/util/Collections.html#unmodifiableList-java.util.List-
  # https://docs.oracle.com/javase/8/docs/api/java/util/ArrayList.html#ArrayList-java.util.Collection-
  - id: java-control-defensive-copy-001
    files: [AGENTS.md, .claude/CLAUDE.md]
    only_warn: true
    input: |
      Review this Java 8 class. Its tags must be an immutable snapshot of the
      constructor argument. Can the caller change its state through either the
      original list or the getter? Show a small fix and explain why it works.
      Assume the input list and its String elements are non-null. No repository
      lookup is needed. Give an answer only; do not run commands, edit files,
      or use external services.

      final class Tags {
        private final java.util.List<String> tags;
        Tags(java.util.List<String> tags) { this.tags = tags; }
        java.util.List<String> tags() { return tags; }
      }
    expected_criteria:
      - Identifies both constructor-argument aliasing and exposure of mutable state through the getter.
      - Copies the input and prevents callers from mutating the stored list through the getter.
      - Explains that an unmodifiable view of the original input alone still reflects later input mutations.
      - Uses APIs available in Java 8 and keeps the explanation focused on the supplied class.
    bad_signals:
      - Claims that a final List field makes its contents immutable.
      - Wraps the caller's original list without copying it and claims the result is an immutable snapshot.
      - Uses List.of or List.copyOf as the Java 8 solution.
