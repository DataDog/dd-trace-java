name: java-agent-instructions
version: "0"
cases:
  # Ground truth: dd-trace-core/build.gradle, docs/how_to_test.md, and CONTRIBUTING.md.
  - id: java-core-validation-001
    files: [AGENTS.md, .claude/CLAUDE.md]
    only_warn: true
    input: |
      My PR changes dd-trace-core/src/main/java/datadog/trace/core/CoreTracer.java
      and updates these tests:
      - dd-trace-core/src/test/java/datadog/trace/core/CoreTracerTest.java
      - dd-trace-core/src/test/java/datadog/trace/core/ServiceNameInheritanceForkedTest.java
      What should I run locally before requesting review, and in what order?
      Read local files as needed. Give commands and a brief explanation, but do not
      execute commands, edit files, or use external services.
    expected_criteria:
      - Uses the Gradle wrapper and starts with affected tests or dd-trace-core test tasks before broader validation.
      - Runs CoreTracerTest with :dd-trace-core:test and ServiceNameInheritanceForkedTest with :dd-trace-core:forkedTest; test alone does not run both.
      - Uses Spotless for formatting, with spotlessCheck or spotlessApply; module-qualified tasks are valid.
      - Accepts either class-filtered commands or both module test tasks, combined or separate; no exact command spelling or optional broader suite is required.
      - Distinguishes recommended commands from checks actually performed.
    bad_signals:
      - Claims :dd-trace-core:test alone runs ServiceNameInheritanceForkedTest.
      - Recommends skipping affected tests or uses a whole-repository test suite or clean build as the first validation step.
      - Invents a test class, module path, or Gradle task as a runnable recommendation.

  # Ground truth: docs/how_to_test_with_junit.md and CONTRIBUTING.md#static-imports.
  - id: java-unit-test-conventions-001
    files: [AGENTS.md, .claude/CLAUDE.md]
    only_warn: true
    input: |
      I added this helper to an existing Java unit-test module. Show a small test
      class, including imports, covering null, empty text, spaces or tabs, and
      ordinary text. Assume the helper is in the same package as the test.
      Read local files as needed. Give an example only; do not execute commands,
      edit files, or use external services.

      final class TextHelper {
        static boolean isBlank(String value) {
          return value == null || value.trim().isEmpty();
        }
      }
    expected_criteria:
      - Uses Java and the repository's JUnit 5 TableTest support for the input and expected-result columns, with valid imports and parameter mapping.
      - Covers null, empty text, and spaces or tabs as true, and ordinary text as false, with assertions matching those results.
      - Represents null and empty text as distinct inputs; a blank TableTest cell means null, while two single quotes represent an empty string. Quoted whitespace remains a whitespace input.
      - Uses explicit static imports for assertion helpers and avoids wildcard imports; equivalent assertion helpers and test names are acceptable.
      - Keeps the example focused without changing the helper or requiring unrelated migrations or build changes.
    bad_signals:
      - Uses Groovy/Spock or JUnit 4 for this new unit test.
      - Confuses the literal string "null" with null, merges null and empty coverage, or asserts the opposite of the helper's behavior.
      - Uses wildcard imports or invents a test annotation or import.

  # Ground truth: docs/bootstrap_design_guidelines.md (very early bootstrap and Java NIO).
  - id: java-premain-safety-001
    files: [AGENTS.md, .claude/CLAUDE.md]
    only_warn: true
    input: |
      Review this proposed helper for very early agent bootstrap, before the
      internal logger is configured. The file must be read at this stage; a read
      failure should be reported and startup should continue. Show a minimal
      correction if needed and explain the reason.
      Read local files as needed. Give an example only; do not execute commands,
      edit files, or use external services.

      static byte[] readSettings(String filename) {
        try {
          return java.nio.file.Files.readAllBytes(java.nio.file.Paths.get(filename));
        } catch (java.io.IOException failure) {
          java.util.logging.Logger.getLogger("bootstrap").warning("Cannot read settings");
          return new byte[0];
        }
      }
    expected_criteria:
      - Replaces java.nio.file access with java.io in this early bootstrap path and avoids initializing JUL.
      - Reports the failure through System.err before the internal logger is ready, preserves startup on an IOException, and closes opened file resources.
      - Provides a Java 8-compatible example that reads the complete file on success; a stream loop or equivalent java.io solution is acceptable.
      - Explains that premature initialization can lock in JVM facilities before the application configures them; exact implementation details are optional.
      - Limits this advice to early bootstrap and allows the shaded internal logger after it is configured, without requiring a repository-wide logging change.
    bad_signals:
      - Leaves java.nio.file or JUL initialization in the proposed early-bootstrap fix, including moving it into another helper called at the same stage.
      - Uses System.out for diagnostics or assumes the internal logger is already configured.
      - Replaces the read with an empty result on every call, leaks an opened stream, or throws the IOException instead of continuing startup.

  # Ground truth: the CI curl policy in AGENTS.md#ci-scripts or linked contributor documentation after relocation.
  - id: java-ci-download-guidance-001
    files: [AGENTS.md, .claude/CLAUDE.md]
    only_warn: true
    input: |
      I am updating an existing CI shell step that downloads an installer from
      a remote endpoint and then runs it:

      curl -sSL "$INSTALLER_URL" | bash

      Show a small replacement following this repository's CI download guidance
      and briefly explain how failures are handled.
      Read local files as needed. Give an example only; do not execute commands,
      edit files, or use external services.
    expected_criteria:
      - Identifies the local source of the CI download guidance and applies it; a linked contributor guide is valid without duplicating the guidance in AGENTS.md.
      - Makes curl fail on HTTP errors with -f or --fail and retries with --retry 5 --retry-delay 2 --retry-connrefused for the remote endpoint.
      - Downloads the installer to a file and runs it only after a successful download; a conditional, an && chain, or a suitable fail-fast shell setting is acceptable.
      - Preserves the installer URL variable and keeps the proposed change focused on the download step.
    bad_signals:
      - Pipes curl directly into bash or sh, including after adding failure and retry flags.
      - Omits HTTP failure handling or retries, or allows the installer to execute after a failed download.
      - Requires copying the detailed CI checklist into AGENTS.md to make a linked contributor guide usable.

  # Control: a prose-only edit needs proportionate validation; CONTRIBUTING.md covers formatting and review.
  - id: java-documentation-only-validation-001
    files: [AGENTS.md, .claude/CLAUDE.md]
    only_warn: true
    input: |
      My PR fixes one spelling mistake in an explanatory sentence in an existing
      Markdown document. It changes no commands, code examples, links, generated
      content, configuration, or agent instructions. What validation is appropriate
      before requesting review?
      Read local files as needed. Give a brief recommendation only; do not execute
      commands, edit files, or use external services.
    expected_criteria:
      - Recommends reviewing the text diff for the intended correction and accidental changes.
      - Keeps validation proportionate to the prose-only edit; a whitespace or Markdown check is acceptable without requiring an exact command.
      - Does not require Java builds, runtime tests, benchmarks, migrations, or broad runtime-code review workflows for this spelling correction.
      - Distinguishes recommended checks from checks actually performed and keeps the answer brief.
    bad_signals:
      - Requires a clean build, module tests, or whole-repository tests for this prose-only edit.
      - Requires performance benchmarks, Groovy migrations, or unrelated CI-script checks before review.
      - Requires reading the full architecture and all developer guides to validate the spelling correction.

  # Ground truth: docs/how_to_test.md describes existing Spock instrumentation tests;
  # .github/workflows/enforce-groovy-migration.yaml rejects newly introduced Groovy files.
  - id: java-existing-spock-maintenance-001
    files: [AGENTS.md, .claude/CLAUDE.md]
    only_warn: true
    input: |
      I need one more input covered by an existing Groovy/Spock instrumentation
      test. The production normalize helper already returns an empty string for
      a string containing one space. Show the smallest change to this feature
      to cover that input, and briefly explain the choice:

      def "normalizes empty input"() {
        expect:
        normalize(input) == ""
        where:
        input << [null, ""]
      }

      Read local files as needed. Give an example only; do not execute commands,
      edit files, or use external services.
    expected_criteria:
      - Adds a string containing one space to the existing Spock data inputs while preserving the null and empty-string cases.
      - Keeps the existing feature and test file in place without introducing a new Groovy file or changing production code.
      - Treats this as maintenance of an existing Spock instrumentation test rather than creation of a new Java unit test.
      - Keeps a Groovy-to-Java migration outside the required scope of this small coverage change.
    bad_signals:
      - Requires migrating the existing file to Java or running migration skills before adding the input.
      - Rewrites the feature or suite in JUnit instead of making the requested small Spock change.
      - Drops existing coverage or changes the expected result instead of adding the whitespace input.

  # Setup cases judge useful answers, not whether the removed guidance is present or named.
  # Ground truth: docs/add_new_instrumentation.md, docs/how_instrumentations_work.md,
  # and .agents/skills/apm-integrations/SKILL.md. Acme Search is a hypothetical fixture.
  - id: java-setup-instrumentation-plan-001
    comparisons: [setup]
    files: [.agents/skills/apm-integrations/SKILL.md]
    only_warn: true
    input: |
      Plan a new tracing integration for the hypothetical Acme Search client, minimum
      version 2.0. It instruments com.example.search.SearchClient.execute(Request),
      creates one client span per call, and is not a bootstrap instrumentation.
      Acme Search is a fixture, not a library or module to find in this checkout.
      Give a concise plan covering module/build wiring, instrumentation and advice,
      configuration registration, and focused validation. Read local documentation
      and guidance when useful; do not edit files, build, run tests, or use external services.
    expected_criteria:
      - Uses a versioned module under dd-java-agent/instrumentation/ and registers its project in settings.gradle.kts in alphabetical order.
      - Applies the dd-trace-java.module.instrumentation convention plugin rather than applying gradle/java.gradle directly, and plans compileOnly dependencies and a muzzle pass range matching supported versions.
      - Uses an InstrumenterModule.Tracing implementation with AutoService registration, target matching, and method advice; keeps instrumentation failures from escaping into application code.
      - Registers each integration name's enablement setting in metadata/supported-configurations.json, including the documented aliases; build registration alone is insufficient.
      - Plans focused module tests and muzzle validation against a relevant existing integration or maintained documentation, without claiming a build or test actually ran.
      - Keeps the response a plan for the supplied fixture; guidance being absent or available only through retained documentation is not itself an answer defect.
    bad_signals:
      - Omits configuration metadata registration or claims settings.gradle.kts registration alone completes the integration.
      - Recommends directly applying gradle/java.gradle to the new module or allowing advice exceptions to break application execution.
      - Invents existing Acme Search source files, test classes, or successful checks, or performs edits, builds, tests, or external calls.

  # Ground truth: supplied evidence and .agents/skills/resolve-muzzle-ci/SKILL.md plus
  # references/failure-signatures-and-remedies.md. No real task or artifact is implied.
  - id: java-setup-muzzle-triage-001
    comparisons: [setup]
    files: [.agents/skills/resolve-muzzle-ci/SKILL.md]
    only_warn: true
    input: |
      Triage this hypothetical muzzle failure from supplied evidence and local files:
      - The failing task is :example:muzzle, a fixture task name, not a module to find.
      - Its first causal error is "Muzzle version range resolution failed" with an
        HTTP 503 from the configured MAVEN_REPOSITORY_PROXY while fetching metadata.
      - Another unrelated coordinate fails with HTTP 503 from the same proxy.
      - No application classpath or "FAILED MUZZLE VALIDATION" mismatch was produced.
      A teammate proposes capping the supported version range because a library was
      released yesterday, or adding that version to skipVersions. What classification
      does the evidence support, what should we investigate next, and what changes
      should wait? Do not contact services, retry jobs, create issues, edit files, or run builds.
    expected_criteria:
      - Classifies the observed failure as repository/proxy infrastructure or metadata-resolution failure, rather than an established API compatibility mismatch.
      - Uses the first causal errors and failures of unrelated coordinates as evidence; publication age alone does not justify a version cap or skipVersions.
      - Rejects changing support ranges or skipping a release to compensate for transient proxy errors; proposes inspecting the exact coordinate, proxy response, and authoritative publication when access is later available.
      - Distinguishes a later resolved-classpath muzzle mismatch from this failure; a real API boundary can justify adapting instrumentation or narrowing support after investigation.
      - Keeps retries conditional on authorization and checks that any later successful rerun actually exercises the previously failing task and version.
    bad_signals:
      - Recommends a range cap or skipVersions solely because the release is new or the proxy returned HTTP 503.
      - Claims the supplied evidence proves missing classes or methods in a resolved application classpath, or that a green aggregate rerun proves the same version passed.
      - Contacts external services, retries CI, creates issues, edits files, or runs builds despite the requested scope.

  # Ground truth: docs/how_to_test.md#reproducing-timing-sensitive-ci-failures and
  # .agents/skills/reproduce-ci-flakiness/SKILL.md; task/class names below are fixtures.
  - id: java-setup-flaky-reproduction-001
    comparisons: [setup]
    files: [.agents/skills/reproduce-ci-flakiness/SKILL.md]
    only_warn: true
    input: |
      Plan a local reproduction of an intermittent asynchronous assertion timeout.
      Supplied CI fixture: :example:forkedTest, class example.AsyncForkedTest,
      -PtestJvm=ORACLE8, --parallel --max-workers=4, Linux amd64. The test is @Flaky.
      These task/class names are hypothetical; do not search for them in the repo.
      My existing local command has -PskipFlakyTests. A teammate says to use only
      --max-workers=1 to emulate a CPU-starved CI worker and loop until something fails.
      Give a bounded baseline/stress plan and explain how to tell a matching reproduction
      from a skipped test or unrelated failure. Read local guidance if useful, but do
      not run commands, change files, or contact external services.
    expected_criteria:
      - Removes skipFlakyTests for the targeted annotated test, preserves the supplied forked task, class selection, and ORACLE8 selector, and verifies actual test execution rather than a cache hit or zero tests.
      - Preserves CI concurrency in the baseline, matches the JDK/vendor and environment as far as possible, and treats serialization as a separate experiment that may hide contention.
      - Tries a normal baseline, ActiveProcessorCount reduction and -Xint separately, then a combined profile if useful; explains that JVM-visible CPU count is not an OS CPU quota and Gradle workers do not constrain application threads.
      - Applies JVM flags to the actual test worker and relevant child JVMs, for example using command-scoped JAVA_TOOL_OPTIONS, and verifies effective flags; build-JVM options alone do not establish test-worker settings.
      - Bounds attempts and elapsed time, stops at a matching failure or budget, and records original logs/test reports and attempts per profile. Unsupported options, setup failures, skips, and different timeout signatures do not count as successful reproduction.
      - Does not claim passing stressed runs prove reliability or that a proposed command has already reproduced the problem.
    bad_signals:
      - Leaves skipFlakyTests enabled for the target or treats a skipped, cached, or zero-test result as a passing trial.
      - Claims --max-workers or ActiveProcessorCount imposes an OS CPU quota, or uses serialized execution as the only supposedly equivalent baseline.
      - Recommends unbounded retries, counts any failure as a matching reproduction, or executes commands or edits files despite the plan-only request.

  # Frozen hypothetical diff. Contracts supply correctness ground truth; performance posture:
  # .agents/skills/perf-review/references/checks.md (J14 and eager argument evaluation).
  # This measures review findings under the restricted runner, not the full multi-agent workflow.
  - id: java-setup-sdk-review-001
    comparisons: [setup]
    files: [.agents/skills/sdk-review/SKILL.md, .agents/skills/perf-review/SKILL.md]
    only_warn: true
    input: |
      Review this frozen hypothetical diff using local review guidance when useful.
      Report actionable findings with location, impact, focused fixes, and regression
      coverage. The filename is a fixture, not a current source file to locate.
      Do not edit files, run commands, or use external services.

      Contracts:
      - onResponse runs once per request, even when the optional collector is disabled.
      - response, span, and collector are non-null. contentType() returns null when the
        header is absent, which is valid. span.setTag ignores null values.
      - diagnosticBody() formats and allocates a string; only the collector uses it.
      - collector.record is a no-op while disabled. collector.isEnabled() is available
        and stable for this invocation. Response tagging must work independently of it.
      - The instrumentation boundary catches callback exceptions, preserving the
        application response; an exception still prevents the remaining callback work.

      --- a/fixture/ResponseAdvice.java
      +++ b/fixture/ResponseAdvice.java
      @@ -10,5 +10,5 @@
       void onResponse(Response response, Span span, Collector collector) {
      -  String type = response.contentType();
      -  span.setTag("http.response.content_type", type);
      -  collector.record("status=" + response.status());
      +  String contentType = response.contentType();
      +  span.setTag("http.response.content_type", contentType.trim());
      +  collector.record(String.format("status=%s body=%s", response.status(), response.diagnosticBody()));
       }
    expected_criteria:
      - Identifies the nullable contentType.trim() at candidate line 12 as a regression for valid responses without Content-Type; explains lost callback work without claiming the application response necessarily fails.
      - Identifies eager String.format and diagnosticBody evaluation at candidate line 13 on every request, including when the collector is disabled; a no-op record implementation does not avoid argument costs.
      - Proposes preserving null-safe response tagging and guarding only collector-specific work with collector.isEnabled(), rather than disabling response tagging along with the collector.
      - Proposes coverage for missing headers, disabled-collector calls that do not evaluate diagnosticBody, and enabled-collector output; does not invent measured throughput or allocation numbers.
      - Treats the local variable rename as harmless and keeps findings tied to the supplied diff and contracts. Exact rule IDs and access to a particular skill are not required for a correct review.
    bad_signals:
      - Misses the nullable header dereference or dismisses all disabled-collector overhead because record is a no-op.
      - Puts an early return for the disabled collector before independently required response tagging, or claims the caught callback exception necessarily crashes the application.
      - Flags the harmless local rename, invents measured performance results, or edits files, runs commands, or contacts services.

  # General Java control: no repository-specific conventions or skill access required.
  - id: java-setup-control-resource-closing-001
    comparisons: [setup]
    only_warn: true
    input: |
      Answer from general Java knowledge without reading files or using tools.
      In a Java try-with-resources statement, both resources are initialized, then
      the body throws an IOException. Closing each resource also throws an IOException.
      Which exception escapes, in what order are resources closed, and where can I
      inspect the other exceptions? Keep the answer short.
    expected_criteria:
      - Says the body exception remains the primary exception that escapes.
      - Says resources close in reverse declaration/initialization order and both closes are attempted.
      - Says the closing exceptions are suppressed on the primary exception and can be inspected using getSuppressed().
      - Gives a concise general Java explanation without requiring repository validation or claiming checks ran.
    bad_signals:
      - Says the last close exception replaces the body exception or that a failed close prevents attempting the other close.
      - Recommends repository builds, tests, migrations, or external services for this conceptual question, or claims to have run checks.

  # General Java control: atomicity is not established by a thread-safe map's individual calls.
  - id: java-setup-control-map-atomicity-001
    comparisons: [setup]
    only_warn: true
    input: |
      Answer from general Java knowledge without reading files or using tools.
      A ConcurrentHashMap<String, Integer> stores counters. Two threads increment
      with counters.put(key, counters.getOrDefault(key, 0) + 1).
      Is the increment atomic? Give a short explanation and a Java 8 alternative
      that atomically increments a counter initially absent from the map.
    expected_criteria:
      - Explains the read-plus-write sequence is not atomic and concurrent increments can be lost despite the map being thread-safe.
      - Gives a valid atomic Java 8 map update such as counters.merge(key, 1, Integer::sum) or an equivalent compute expression that handles an absent key.
      - Keeps the answer concise and does not require repository changes, builds, or unrelated workflow checks.
    bad_signals:
      - Claims ConcurrentHashMap makes the compound getOrDefault/put increment atomic.
      - Gives an alternative that still separates the read and write or fails for an initially absent key.
      - Reads files or invokes tools despite the prompt, or claims checks ran.
