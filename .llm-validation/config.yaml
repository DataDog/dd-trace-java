# Advisory while the suite is calibrated against known good and bad instruction changes.
model: claude-opus-5-5
runs: 3
concurrency: 2
max_turns: 10

instruction_files:
  - AGENTS.md
  - .claude/CLAUDE.md

# Guidance removed from minimal and retained in default at the same commit.
setup:
  files:
    - AGENTS.md
    - .claude/CLAUDE.md
    - build-logic/AGENTS.md
    - build-logic/CLAUDE.md
    - buildSrc/AGENTS.md
    - buildSrc/CLAUDE.md
  directories:
    - .agents/skills
    - .claude/skills
    - .claude/agents

defaults:
  bad_signals:
    - Claims tests or other checks passed without performing them.
    - Recommends disabling checks or ignoring failures to get a passing build.

default_level: minimum
presets:
  minimum:
    cases:
      - java-core-validation-001
      - java-unit-test-conventions-001
      - java-premain-safety-001
      - java-ci-download-guidance-001
      - java-documentation-only-validation-001
      - java-existing-spock-maintenance-001
  # Extend as representative workflows are added.
  setup-calibration:
    runs: 3
    cases:
      - java-core-validation-001
      - java-unit-test-conventions-001
      - java-premain-safety-001
      - java-ci-download-guidance-001
      - java-documentation-only-validation-001
      - java-existing-spock-maintenance-001
      - java-setup-instrumentation-plan-001
      - java-setup-muzzle-triage-001
      - java-setup-flaky-reproduction-001
      - java-setup-sdk-review-001
      - java-setup-control-resource-closing-001
      - java-setup-control-map-atomicity-001
  # No case list or max_cases: include every setup-eligible case, including future additions.
  setup-full:
    runs: 3
