# DIAGNOSTIC BRANCH ONLY (mo.atie/vertx-rx-hang-b-capture-error), never merged.
#
# The pipeline is cut down to a single job, vertx_rx_hang_diag, which runs the vertx-rx-3.5 forked
# tests over and over on JDK 25 and tip to catch the rare "hang B" timeout, with forked test JVMs set
# to abort (hs_err) on the first StackOverflowError. See .gitlab/vertx_rx_hang_diag.sh.
#
# The templates below are copied verbatim from master's .gitlab-ci.yml (b42a61cec0) so the job uses
# the same image, cache, test agent, Gradle options and report collection as the test_inst jobs.

stages:
  - tests

variables:
  # Test the OpenTelemetry Operator-compatible Java image jobs from one-pipeline.
  CI_OTEL_OPERATOR_IMAGES_ENABLED: "true"
  CI_OTEL_OPERATOR_LANGUAGE: java
  # Gitlab runner features; see https://docs.gitlab.com/runner/configuration/feature-flags.html
  # Fold and time all script sections
  FF_SCRIPT_SECTIONS: 1
  REGISTRY: 486234852809.dkr.ecr.us-east-1.amazonaws.com
  BUILD_JOB_NAME: "build"
  DEPENDENCY_CACHE_POLICY: pull
  S3_BUILD_CACHE_BUCKET: "dd-trace-java-gradle-build-cache"
  S3_BUILD_CACHE_REGION: "us-east-1"
  MASS_READ_URL: "https://mass-read.us1.ddbuild.io"
  MAVEN_REPOSITORY_PROXY: "https://depot-read-api-java.us1.ddbuild.io/magicmirror/magicmirror/@current/"
  GRADLE_PLUGIN_PROXY: "https://depot-read-api-java.us1.ddbuild.io/magicmirror/magicmirror/@current/"
  BUILDER_IMAGE_REPO: "registry.ddbuild.io/images/mirror/dd-trace-java-docker-build" # images are pinned in images/mirror.lock.yaml in the ddoghq/images repo
  BUILDER_IMAGE_VERSION_PREFIX: "ci-" # use either an empty string (e.g. "") for latest images or a version followed by a hyphen (e.g. "ci-" or "123_merge-")
  # shortcut: tag republishing is not detected; use a content hash when CI builds the image.
  ORG_GRADLE_PROJECT_ciBuilderImage: "${BUILDER_IMAGE_REPO}:${BUILDER_IMAGE_VERSION_PREFIX}"
  TEST_COUNTS_S3_BUCKET: "dd-trace-java-ci-test-reports"
  REPO_NOTIFICATION_CHANNEL: "#apm-java-escalations"
  DEFAULT_TEST_JVMS: /^(8|11|17|21|25|tip)$/ # the latest "tip" version is 27
  PROFILE_TESTS:
    description: "Enable profiling of tests"
    value: "false"
  NON_DEFAULT_JVMS:
    description: "Enable tests on JVMs that are not the default"
    value: "false"
  RUN_FLAKY_TESTS:
    description: "Enable flaky tests"
    value: "false"
  SKIP_BUILD_CACHE:
    description: "Run Gradle tasks without build-cache or up-to-date reuse"
    value: "false"

  # One pipeline injection package size ratchet
  OCI_PACKAGE_MAX_SIZE_BYTES: 40_000_000
  LIB_INJECTION_IMAGE_MAX_SIZE_BYTES: 40_000_000

workflow:
  rules:
    - when: always

default:
  tags: [ "arch:amd64" ]
  interruptible: true


.set_datadog_api_keys: &set_datadog_api_keys
  - export DATADOG_API_KEY_PROD=$(aws ssm get-parameter --region us-east-1 --name ci.dd-trace-java.DATADOG_API_KEY_PROD --with-decryption --query "Parameter.Value" --out text)

# CI_NODE_INDEX and CI_NODE_TOTAL are 1-indexed and not always set. These steps normalize the numbers for jobs
.normalize_node_index: &normalize_node_index
  - if [ "$CI_NO_SPLIT" == "true" ] ; then CI_NODE_INDEX=1; CI_NODE_TOTAL=1; fi # A job uses parallel but doesn't intend to split by index
  - if [ -n "$CI_SPLIT" ]; then CI_NODE_INDEX="${CI_SPLIT%%/*}"; CI_NODE_TOTAL="${CI_SPLIT##*/}"; fi
  - echo "CI_NODE_INDEX=$CI_NODE_INDEX, CI_NODE_TOTAL=${CI_NODE_TOTAL}"

.cgroup_info: &cgroup_info
  - source .gitlab/gitlab-utils.sh
  - gitlab_section_start "cgroup-info" "cgroup info"
  - .gitlab/cgroup-info.sh
  - gitlab_section_end "cgroup-info"

.container_info: &container_info
  - |
    # Containers and processes are limited to a 1-hour window, and expire after 36 hours
    if [ -n "$CI_JOB_STARTED_AT" ]; then
      FROM_EPOCH_MS=$(date -d "$CI_JOB_STARTED_AT" +%s)000
      TO_EPOCH_MS=$((FROM_EPOCH_MS + 3600000))
      TIME_PARAMS="from_ts=${FROM_EPOCH_MS}&to_ts=${TO_EPOCH_MS}&"
    else
      TIME_PARAMS=""
    fi

    echo -e "${TEXT_BOLD}${TEXT_YELLOW}Runner dashboard, these are live (limited to a 1-hour window, and expire after 36 hours)${TEXT_CLEAR}"
    echo -e "${TEXT_BOLD}${TEXT_YELLOW}   Containers:${TEXT_CLEAR} https://app.datadoghq.com/containers?${TIME_PARAMS}query=image_name%3A%2A%2Fdd-trace-java-docker-build%20AND%20pod_name%3A${POD_NAME}&live=false"
    echo -e "${TEXT_BOLD}${TEXT_YELLOW}   Processes:${TEXT_CLEAR} https://app.datadoghq.com/process?${TIME_PARAMS}query=image_name%3A%2A%2Fdd-trace-java-docker-build%20AND%20pod_name%3A${POD_NAME}&live=false"

.tier_m:
  variables: &tier_m_variables
    GRADLE_WORKERS: 4
    GRADLE_MEMORY_MIN: 1G
    GRADLE_MEMORY_MAX: 5G
    KUBERNETES_CPU_REQUEST: 6
    KUBERNETES_MEMORY_REQUEST: 16Gi
    KUBERNETES_MEMORY_LIMIT: 16Gi

.tier_l:
  variables: &tier_l_variables
    GRADLE_WORKERS: 6
    GRADLE_MEMORY_MIN: 1G
    GRADLE_MEMORY_MAX: 6G
    KUBERNETES_CPU_REQUEST: 10
    KUBERNETES_MEMORY_REQUEST: 20Gi
    KUBERNETES_MEMORY_LIMIT: 20Gi

.tier_xl:
  variables: &tier_xl_variables
    <<: *tier_l_variables
    KUBERNETES_MEMORY_REQUEST: 32Gi
    KUBERNETES_MEMORY_LIMIT: 32Gi

.gitlab_base_ref_params: &gitlab_base_ref_params
  - |
    export GIT_BASE_REF=$(.gitlab/find-gh-base-ref.sh)
    if [[ -n "$GIT_BASE_REF" ]]; then
      export GRADLE_PARAMS="$GRADLE_PARAMS -PgitBaseRef=origin/$GIT_BASE_REF"
    else
      echo "Failed to find base ref for PR" >&2
    fi

.gradle_build: &gradle_build
  image: ${BUILDER_IMAGE_REPO}:${BUILDER_IMAGE_VERSION_PREFIX}base
  stage: build
  variables:
    <<: *tier_m_variables
    MAVEN_OPTS: "-Xms256M -Xmx1024M"
    CACHE_TYPE: "lib" #default
    FF_USE_FASTZIP: "true"
    CACHE_COMPRESSION_LEVEL: "slowest"

    RUNTIME_AVAILABLE_PROCESSORS_OVERRIDE: 4 # Runtime.getRuntime().availableProcessors() returns incorrect or very high values in Kubernetes
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_DEPTH: 1
  cache:
    - &dependency_cache
      key: dependency-$CACHE_TYPE # Dependencies cache
      paths:
        # Cached dependencies and wrappers for Gradle and Maven:
        - .gradle/wrapper
        - .gradle/caches
        - .gradle/notifications
        - .mvn/caches
      policy: $DEPENDENCY_CACHE_POLICY
      unprotect: true
      fallback_keys: # Use fallback keys because all cache types are not populated. See note under: populate_dep_cache
        - 'dependency-base'
        - 'dependency-lib'
  before_script:
    - source .gitlab/gitlab-utils.sh
    - *container_info
    # Akka token added to SSM from https://account.akka.io/token
    - export ORG_GRADLE_PROJECT_akkaRepositoryToken=$(aws ssm get-parameter --region us-east-1 --name ci.dd-trace-java.akka_repo_token --with-decryption --query "Parameter.Value" --out text)
    - export ORG_GRADLE_PROJECT_mavenRepositoryProxy=$MAVEN_REPOSITORY_PROXY
    - export ORG_GRADLE_PROJECT_gradlePluginProxy=$GRADLE_PLUGIN_PROXY
    - |
      JAVA_HOMES=$(env | grep -E '^JAVA_[A-Z0-9_]+_HOME=' | sed 's/=.*//' | paste -sd,)
      cat >> gradle.properties <<EOF
      org.gradle.java.installations.auto-detect=false
      org.gradle.java.installations.auto-download=false
      org.gradle.java.installations.fromEnv=$JAVA_HOMES
      org.gradle.console=colored
      EOF
    - mkdir -p .gradle
    - export GRADLE_USER_HOME=$(pwd)/.gradle
    # Apache Maven Wrapper supports MVNW_REPOURL for repository-manager downloads:
    # https://maven.apache.org/tools/wrapper/#Using_a_Maven_Repository_Manager
    - export MVNW_REPOURL=${MAVEN_REPOSITORY_PROXY%/}
    # Route Gradle distribution download through MASS pull-through cache
    - |
      mass_read_host="${MASS_READ_URL#https://}"
      mass_read_host="${mass_read_host%/}"
      sed -i "/^distributionUrl=/ s|services.gradle.org|${mass_read_host}/internal/artifact/services.gradle.org|" gradle/wrapper/gradle-wrapper.properties
    - mkdir -p .mvn/caches
    # Redirect Spotless's Equo/Solstice P2 cache into the project tree so it is captured by the GitLab cache.
    # Solstice (https://github.com/equodev/equo-ide) defaults to ~/.m2/repository/dev/equo/p2-data, which is outside $CI_PROJECT_DIR.
    - |
      mkdir -p .mvn/caches/equo "$HOME/.m2/repository/dev"
      if [ ! -L "$HOME/.m2/repository/dev/equo" ]; then
        rm -rf "$HOME/.m2/repository/dev/equo"
        ln -s "$(pwd)/.mvn/caches/equo" "$HOME/.m2/repository/dev/equo"
      fi
    - export GRADLE_OPTS="-Dorg.gradle.jvmargs='-Xms$GRADLE_MEMORY_MIN -Xmx$GRADLE_MEMORY_MAX -XX:ErrorFile=/tmp/hs_err_pid%p.log -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp'"
    - export GRADLE_ARGS=" --build-cache --stacktrace --no-daemon --parallel --max-workers=$GRADLE_WORKERS"
    # Force fresh Gradle task execution for SKIP_BUILD_CACHE=true or [ci: SKIP_BUILD_CACHE].
    # Ignore the commit-message option in publication stages; the explicit variable still applies.
    - |
      if [ "$SKIP_BUILD_CACHE" = "true" ] || {
        [ "$CI_JOB_STAGE" != "publish" ] &&
        [ "$CI_JOB_STAGE" != "publish-release-artifacts" ] &&
        printf '%s\n' "${CI_COMMIT_MESSAGE:-}" | grep -E '\[ci:[^]]*\bSKIP_BUILD_CACHE\b[^]]*\]' > /dev/null
      }; then
        export GRADLE_ARGS="$GRADLE_ARGS --no-build-cache --rerun-tasks"
      fi
    - *normalize_node_index
    # GitLab's cache helper restores .gradle as root, but we run as non-root-user (uid 1001),
    # and Gradle does `chmod 700 .gradle` on startup which requires user ownership.
    - sudo chown -R 1001:1001 .gradle
  after_script:
    - *cgroup_info
    - *container_info


# In Gitlab, DD_* variables are set because the build runner is instrumented with Datadog telemetry
# To have a pristine environment for the tests, these variables are saved before the test run and restored afterwards
.prepare_test_env: &prepare_test_env
  - export gitlabVariables=("DD_SERVICE" "DD_ENTITY_ID" "DD_SITE" "DD_ENV" "DD_DATACENTER" "DD_PARTITION" "DD_CLOUDPROVIDER")
  - '[ ! -e pretest.env ] || rm pretest.env'
  - |
    for VARIABLE in "${gitlabVariables[@]}"
    do
      echo "export $VARIABLE=${!VARIABLE}" >> pretest.env
      unset "$VARIABLE"
    done

.restore_pretest_env: &restore_pretest_env
  - source pretest.env

.test_job_common:
  extends: .gradle_build
  image: ${BUILDER_IMAGE_REPO}:${BUILDER_IMAGE_VERSION_PREFIX}$testJvm
  variables:
    <<: *tier_m_variables
    GRADLE_PARAMS: "-PskipFlakyTests"
    CONTINUE_ON_FAILURE: "false"
    TEST_JVM_ARGS: ""
    TESTCONTAINERS_CHECKS_DISABLE: "true"
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: "registry.ddbuild.io/images/mirror/"
    # CI pull policy: allow slow image fetching without overriding local file-based settings.
    TESTCONTAINERS_PULL_TIMEOUT: "240"
    TESTCONTAINERS_PULL_PAUSE_TIMEOUT: "60"
    JETTY_AVAILABLE_PROCESSORS: 4 # Jetty incorrectly calculates processor count in containers
  script:
    - *gitlab_base_ref_params
    - >
      if [ "$PROFILE_TESTS" == "true" ] && [ "$testJvm" != "ibm8" ] && [ "$testJvm" != "oracle8" ];
      then
      export PROFILER_COMMAND="-XX:StartFlightRecording=settings=profile,filename=/tmp/${CI_JOB_NAME_SLUG}.jfr,dumponexit=true";
      fi
    - *prepare_test_env
    - export GRADLE_OPTS="-Dorg.gradle.jvmargs='$TEST_JVM_ARGS -Xms$GRADLE_MEMORY_MIN -Xmx$GRADLE_MEMORY_MAX $PROFILER_COMMAND -XX:ErrorFile=/tmp/hs_err_pid%p.log -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Djava.util.prefs.userRoot=/tmp/.java/.userPrefs-${CI_JOB_ID}' -Ddatadog.forkedMinHeapSize=128M -Ddatadog.forkedMaxHeapSize=1024M"
    - ./gradlew --version
    - ./gradlew $GRADLE_TARGET $GRADLE_PARAMS -PtestJvm=$testJvm -Pslot=$CI_NODE_INDEX/$CI_NODE_TOTAL $GRADLE_ARGS --continue || $CONTINUE_ON_FAILURE
  after_script:
    - *restore_pretest_env
    - *set_datadog_api_keys
    - *container_info
    - *cgroup_info
    - source .gitlab/gitlab-utils.sh
    - gitlab_section_start "collect-reports" "Collecting reports"
    - .gitlab/collect_reports.sh
    - if [ "$PROFILE_TESTS" == "true" ]; then .gitlab/collect_profiles.sh; fi
    - .gitlab/collect_results.sh
    - .gitlab/upload_ciapp.sh $CACHE_TYPE $testJvm
    - gitlab_section_end "collect-reports"
    - .gitlab/count_tests.sh "$GRADLE_TARGET" "$testJvm" "./results" "./test_counts_${CI_JOB_ID}.json"
    - export TEST_COUNTS_S3_PREFIX="test-counts/${CI_PIPELINE_ID}"
    - export TEST_COUNTS_FILE="./test_counts_${CI_JOB_ID}.json"
    # Use logical job identity in S3 so retried jobs overwrite stale attempts.
    - export TEST_COUNTS_S3_FILE="test_counts_${CI_JOB_NAME_SLUG}_${CI_NODE_INDEX}-${CI_NODE_TOTAL}.json"
    - export TEST_COUNTS_S3_URI="s3://${TEST_COUNTS_S3_BUCKET}/${TEST_COUNTS_S3_PREFIX}/${TEST_COUNTS_S3_FILE}"
    - echo "Uploading ${TEST_COUNTS_FILE} to ${TEST_COUNTS_S3_URI}"
    - aws s3 cp "$TEST_COUNTS_FILE" "$TEST_COUNTS_S3_URI" --only-show-errors
    - URL_ENCODED_JOB_NAME=$(jq -rn --arg x "$CI_JOB_NAME" '$x|@uri')
    - echo -e "${TEXT_BOLD}${TEXT_YELLOW}See test results in Datadog:${TEXT_CLEAR} https://app.datadoghq.com/ci/test/runs?query=test_level%3Atest%20%40test.service%3Add-trace-java%20%40ci.pipeline.id%3A${CI_PIPELINE_ID}%20%40ci.job.name%3A%22${URL_ENCODED_JOB_NAME}%22"
  artifacts:
    when: always
    paths:
      - ./reports.tar
      - ./profiles.tar
      - ./results
      - './test_counts_*.json'
      - '.gradle/daemon/*/*.out.log'
    reports:
      junit: results/*.xml
  retry:
    max: 2
    when:
      - unknown_failure
      - stuck_or_timeout_failure
      - runner_system_failure
      - unmet_prerequisites
      - scheduler_failure
      - data_integrity_failure


.test_job_with_test_agent_common:
  variables:
    CI_USE_TEST_AGENT: "true"
    CI_AGENT_HOST: local-agent
    # Use the same immutable image and validation policy for the sidecar and Gradle inputs.
    CI_TEST_AGENT_IMAGE: "registry.ddbuild.io/images/mirror/dd-apm-test-agent/ddapm-test-agent:v1.64.1@sha256:817244a7aec2196c0ad5b09e958a9d1fb40846ecc4257736917aa6b9b55c5e49"
    CI_TEST_AGENT_ENABLED_CHECKS: "trace_content_length,trace_stall,meta_tracer_version_header,trace_count_header,trace_peer_service,trace_dd_service"
    CI_TEST_AGENT_SUPPRESS_TRACE_PARSE_ERRORS: "true"
    CI_TEST_AGENT_POOL_TRACE_CHECK_FAILURES: "true"
    CI_TEST_AGENT_DISABLE_ERROR_RESPONSES: "true"
  services:
    - name: "$CI_TEST_AGENT_IMAGE"
      alias: "$CI_AGENT_HOST"
      variables:
        # LOG_LEVEL only controls logging; TRACE_LANGUAGE is unused by Test Agent v1.64.1.
        LOG_LEVEL: "DEBUG"
        TRACE_LANGUAGE: "java"
        DD_SUPPRESS_TRACE_PARSE_ERRORS: "$CI_TEST_AGENT_SUPPRESS_TRACE_PARSE_ERRORS"
        DD_POOL_TRACE_CHECK_FAILURES: "$CI_TEST_AGENT_POOL_TRACE_CHECK_FAILURES"
        DD_DISABLE_ERROR_RESPONSES: "$CI_TEST_AGENT_DISABLE_ERROR_RESPONSES"
        ENABLED_CHECKS: "$CI_TEST_AGENT_ENABLED_CHECKS"
        # Without these the service inherits the runner default, which is sized for the docker daemon.
        # Set all three together: a memory request above the memory limit is rejected.
        KUBERNETES_SERVICE_CPU_REQUEST: "500m"
        KUBERNETES_SERVICE_MEMORY_REQUEST: "2Gi"
        KUBERNETES_SERVICE_MEMORY_LIMIT: "2Gi"
  script:
    - !reference [.test_job_common, script]
    # Check traces from executed tests; cache hits restore results without sending traces.
    - tooling/check_test_agent_results.sh

vertx_rx_hang_diag:
  extends:
    - .test_job_common
    - .test_job_with_test_agent_common
  tags: [ "docker-in-docker:amd64" ] # same runners as test_inst (testcontainers / test agent sidecar)
  stage: tests
  needs: []
  rules:
    - when: on_success
  # Follow-up pushes to this branch must not cancel in-flight repetitions.
  interruptible: false
  # Loop budget (VERTX_DIAG_BUDGET_SECONDS) + one worst-case hanged invocation (20m Gradle test
  # timeout + dumps) + setup must fit, so after_script still collects the reports.
  timeout: 110 minutes
  variables:
    CACHE_TYPE: "inst"
    # Each spec runs VERTX_DIAG_REPS+1 times per Gradle invocation, VERTX_DIAG_FORKS JVMs at once.
    VERTX_DIAG_REPS: "10"
    VERTX_DIAG_FORKS: "4"
    VERTX_DIAG_BUDGET_SECONDS: "3000"
    VERTX_DIAG_MAX_ABORTS: "3"
  parallel:
    matrix:
      - testJvm: ["25", "tip"]
        # "512k" lowers the test JVM thread stack size (default 1M) to make a deep recursion
        # overflow likelier; "default" keeps the CI stack size.
        VERTX_DIAG_XSS: ["default", "512k"]
        # Independent repetitions; the job does not use the split index.
        CI_SPLIT: ["1/3", "2/3", "3/3"]
  script:
    - *prepare_test_env
    # Same Gradle client/daemon options as .test_job_common.
    - export GRADLE_OPTS="-Dorg.gradle.jvmargs='$TEST_JVM_ARGS -Xms$GRADLE_MEMORY_MIN -Xmx$GRADLE_MEMORY_MAX -XX:ErrorFile=/tmp/hs_err_pid%p.log -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Djava.util.prefs.userRoot=/tmp/.java/.userPrefs-${CI_JOB_ID}' -Ddatadog.forkedMinHeapSize=128M -Ddatadog.forkedMaxHeapSize=1024M"
    - ./gradlew --version
    - .gitlab/vertx_rx_hang_diag.sh
  after_script:
    - *restore_pretest_env
    - *container_info
    - *cgroup_info
    - source .gitlab/gitlab-utils.sh
    - gitlab_section_start "collect-reports" "Collecting reports"
    - .gitlab/collect_reports.sh
    - gitlab_section_end "collect-reports"
    - cat ./reports/vertx-diag/summary.txt || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ./reports.tar
      - ./reports/vertx-diag
      - '.gradle/daemon/*/*.out.log'
  retry:
    max: 1
    when:
      - runner_system_failure
      - scheduler_failure
