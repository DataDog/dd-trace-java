exploration-tests-log_method-okhttp:
  rules:
    - when: never
  needs: [ build ]
  dependencies:
    - build
  <<: *common-exploration-tests
  variables:
    PROJECT: okhttp
    KUBERNETES_MEMORY_REQUEST: 10Gi
    KUBERNETES_MEMORY_LIMIT: 10Gi
  script:
    - export JAVA_HOME=$JAVA_17_HOME PATH=$JAVA_17_HOME/bin:$PATH
    - java -XshowSettings:system -version
    - ./run-exploration-tests.sh "log_method" "$PROJECT" "GRADLE_OPTS=-XX:ActiveProcessorCount=4 ./gradlew -Dorg.gradle.java.installations.auto-download=true --max-workers 4 jvmTest -Dtest.java.version=11" "include_${PROJECT}.txt" "exclude_$PROJECT.txt"
  after_script:
    - cp /exploration-tests/${PROJECT}/agent.log ${PROJECT}_agent.log || true
    - gzip ${PROJECT}_agent.log || true
    - tar czf ${PROJECT}_debugger-dumps.tar.gz /tmp/debugger || true
    - mkdir -p ${PROJECT}-test-results
    - (cd /exploration-tests/${PROJECT} && find . -path "*/build/test-results/*/TEST-*.xml" -exec cp --parents {} $CI_PROJECT_DIR/${PROJECT}-test-results/ \;) || true
  artifacts:
    when: always
    paths:
      - "*_agent.log.gz"
      - "*_debugger-dumps.tar.gz"
      - "${PROJECT}-test-results/"
    reports:
      junit:
        - "${PROJECT}-test-results/**/TEST-*.xml"
