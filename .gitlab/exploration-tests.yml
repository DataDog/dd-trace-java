variables:
  EXPLORATION_TESTS_IMAGE: registry.ddbuild.io/ci/dd-trace-java:exploration-tests

build-exploration-tests-image:
  rules:
    - when: never
  stage: exploration-tests
  when: manual
  needs: []
  tags: [ "arch:amd64" ]
  image: $REGISTRY/docker:27.3.1
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  script:
    - METADATA_FILE=$(mktemp)
    - >
      docker buildx build 
      --tag $EXPLORATION_TESTS_IMAGE 
      --file dd-java-agent/agent-debugger/exploration-tests/Dockerfile.exploration-tests 
      --push 
      --metadata-file ${METADATA_FILE}
      dd-java-agent/agent-debugger/exploration-tests
    - ddsign sign $EXPLORATION_TESTS_IMAGE --docker-metadata-file ${METADATA_FILE}

.common-exploration-tests: &common-exploration-tests
  rules:
    - if: '$POPULATE_CACHE'
      when: never
    - if: $CI_PIPELINE_SOURCE != "schedule"
      changes:
        paths:
          - dd-java-agent/agent-debugger/**/*
        compare_to: "master"
      when: on_success
    - when: manual
      allow_failure: true
  before_script:
    - |
      mkdir -p "$HOME/.m2"
      cat > "$HOME/.m2/settings.xml" <<EOF
      <settings>
        <mirrors>
          <mirror>
            <id>env-proxy</id>
            <mirrorOf>*</mirrorOf>
            <url>${MAVEN_REPOSITORY_PROXY}</url>
          </mirror>
        </mirrors>
      </settings>
      EOF
    - export MVNW_REPOURL=${MAVEN_REPOSITORY_PROXY%/}
    - export ORG_GRADLE_PROJECT_mavenRepositoryProxy="$MAVEN_REPOSITORY_PROXY"
    - export ORG_GRADLE_PROJECT_gradlePluginProxy="$GRADLE_PLUGIN_PROXY"
    # TODO: Centralize Gradle repository proxy initialization instead of reusing a smoke-test resource.
    - mkdir -p "$HOME/.gradle/init.d"
    - cp build-logic/smoke-test/src/main/resources/datadog/buildlogic/smoketest/proxy-repositories.init.gradle.kts "$HOME/.gradle/init.d/"
    - cp workspace/dd-java-agent/build/libs/*.jar /exploration-tests/dd-java-agent.jar
    - cp dd-java-agent/agent-debugger/exploration-tests/run-exploration-tests.sh /exploration-tests
    - cp dd-java-agent/agent-debugger/exploration-tests/exclude_*.txt /exploration-tests
    - cp dd-java-agent/agent-debugger/exploration-tests/include_*.txt /exploration-tests
    - source $HOME/.sdkman/bin/sdkman-init.sh && cd / && sdk env
    - cd /exploration-tests
    - java -version
  after_script:
    - cp /exploration-tests/${PROJECT}/agent.log ${PROJECT}_agent.log
    - gzip ${PROJECT}_agent.log
    - tar czf ${PROJECT}_surefire-reports.tar.gz /exploration-tests/${PROJECT}/target/surefire-reports
    - tar czf ${PROJECT}_debugger-dumps.tar.gz /tmp/debugger
  stage: exploration-tests
  tags: [ "arch:amd64"]
  image: $EXPLORATION_TESTS_IMAGE
  artifacts:
    when: always
    paths:
      - "*_agent.log.gz"
      - "*_surefire-reports.tar.gz"
      - "*_debugger-dumps.tar.gz"

exploration-tests-method-jsoup:
  rules:
    - when: never
  needs: [ build ]
  dependencies:
    - build
  <<: *common-exploration-tests
  variables:
    PROJECT: jsoup
  script:
    - ./run-exploration-tests.sh "method" "$PROJECT" "mvn verify" "include_${PROJECT}.txt" "exclude_${PROJECT}.txt"

exploration-tests-line-jsoup:
  rules:
    - when: never
  needs: [ build ]
  dependencies:
    - build
  <<: *common-exploration-tests
  variables:
    PROJECT: jsoup
  script:
    - ./run-exploration-tests.sh "line" "$PROJECT" "mvn verify" "include_${PROJECT}.txt" "exclude_${PROJECT}.txt"

