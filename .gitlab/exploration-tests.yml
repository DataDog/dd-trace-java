variables:
  EXPLORATION_TESTS_IMAGE: registry.ddbuild.io/ci/dd-trace-java:exploration-tests
  # Digest of the exploration tests image used by test jobs. Update it after running build-exploration-tests-image.
  EXPLORATION_TESTS_IMAGE_DIGEST: sha256:a52a55789206b6e53b38b042653f27efa2e1116eb769e2c619ffc0630bcc14f6
  # Eclipse Temurin JDK releases (https://adoptium.net/temurin/releases) installed in the exploration tests image
  JAVA_8_VERSION: jdk8u372-b07
  JAVA_11_VERSION: jdk-11.0.32.1+1
  JAVA_17_VERSION: jdk-17.0.21+9
  JAVA_21_VERSION: jdk-21.0.13+9
  # Apache Maven version installed in the exploration tests image
  MAVEN_VERSION: 3.8.4

build-exploration-tests-image:
  rules:
    - when: never
  stage: exploration-tests
  when: manual
  needs: []
  tags: [ "arch:amd64" ]
  image: $REGISTRY/docker:27.3.1
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  script:
    - METADATA_FILE=$(mktemp)
    - >
      docker buildx build 
      --tag $EXPLORATION_TESTS_IMAGE 
      --build-arg JAVA_8_VERSION=$JAVA_8_VERSION 
      --build-arg JAVA_11_VERSION=$JAVA_11_VERSION 
      --build-arg JAVA_17_VERSION=$JAVA_17_VERSION 
      --build-arg JAVA_21_VERSION=$JAVA_21_VERSION 
      --build-arg MAVEN_VERSION=$MAVEN_VERSION 
      --file dd-java-agent/agent-debugger/exploration-tests/Dockerfile.exploration-tests 
      --push 
      --metadata-file ${METADATA_FILE}
      dd-java-agent/agent-debugger/exploration-tests
    - ddsign sign $EXPLORATION_TESTS_IMAGE --docker-metadata-file ${METADATA_FILE}

.common-exploration-tests: &common-exploration-tests
  rules:
    - if: '$POPULATE_CACHE'
      when: never
    - if: $CI_PIPELINE_SOURCE != "schedule"
      changes:
        paths:
          - dd-java-agent/agent-debugger/**/*
        compare_to: "master"
      when: on_success
    - when: manual
      allow_failure: true
  before_script:
    - |
      mkdir -p "$HOME/.m2"
      cat > "$HOME/.m2/settings.xml" <<EOF
      <settings>
        <mirrors>
          <mirror>
            <id>env-proxy</id>
            <mirrorOf>*</mirrorOf>
            <url>${MAVEN_REPOSITORY_PROXY}</url>
          </mirror>
        </mirrors>
      </settings>
      EOF
    - export MVNW_REPOURL=${MAVEN_REPOSITORY_PROXY%/}
    - export ORG_GRADLE_PROJECT_mavenRepositoryProxy="$MAVEN_REPOSITORY_PROXY"
    - export ORG_GRADLE_PROJECT_gradlePluginProxy="$GRADLE_PLUGIN_PROXY"
    # TODO: Centralize Gradle repository proxy initialization instead of reusing a smoke-test resource.
    - mkdir -p "$HOME/.gradle/init.d"
    - cp build-logic/smoke-test-app/src/main/resources/datadog/buildlogic/smoketest/proxy-repositories.init.gradle.kts "$HOME/.gradle/init.d/"
    - cp workspace/dd-java-agent/build/libs/*.jar /exploration-tests/dd-java-agent.jar
    - cp dd-java-agent/agent-debugger/exploration-tests/run-exploration-tests.sh /exploration-tests
    - cp dd-java-agent/agent-debugger/exploration-tests/exclude_*.txt /exploration-tests
    - cp dd-java-agent/agent-debugger/exploration-tests/include_*.txt /exploration-tests
    - cd /exploration-tests
  after_script:
    - cp /exploration-tests/${PROJECT}/agent.log ${PROJECT}_agent.log
    - gzip ${PROJECT}_agent.log
    - tar czf ${PROJECT}_surefire-reports.tar.gz /exploration-tests/${PROJECT}/target/surefire-reports
    - tar czf ${PROJECT}_debugger-dumps.tar.gz /tmp/debugger
  stage: exploration-tests
  tags: [ "arch:amd64"]
  image: $EXPLORATION_TESTS_IMAGE@$EXPLORATION_TESTS_IMAGE_DIGEST
  artifacts:
    when: always
    paths:
      - "*_agent.log.gz"
      - "*_surefire-reports.tar.gz"
      - "*_debugger-dumps.tar.gz"

exploration-tests-log_method-jsoup:
  rules:
    - when: never
  needs: [ build ]
  dependencies:
    - build
  <<: *common-exploration-tests
  variables:
    PROJECT: jsoup
  script:
    - ./run-exploration-tests.sh "log_method" "$PROJECT" "mvn verify" "include_${PROJECT}.txt" "exclude_${PROJECT}.txt"

