  script:
    - ./run-exploration-tests.sh "line" "$PROJECT" "./mvnw verify" "include_${PROJECT}.txt" "exclude_line_$PROJECT.txt"

exploration-tests-method-okhttp:
  rules:
    - when: never
  needs: [ build ]
  dependencies:
    - build
  <<: *common-exploration-tests
  variables:
    PROJECT: okhttp
    KUBERNETES_MEMORY_REQUEST: 8Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
  script:
    - sdk use java 17.0.10-tem
    - java -XshowSettings:system -version
    - ./run-exploration-tests.sh "method" "$PROJECT" "GRADLE_OPTS=-XX:ActiveProcessorCount=4 ./gradlew --max-workers 4 jvmTest -Dtest.java.version=11" "include_${PROJECT}.txt" "exclude_$PROJECT.txt"
  after_script:
    - cp /exploration-tests/${PROJECT}/agent.log ${PROJECT}_agent.log || true
    - gzip ${PROJECT}_agent.log || true
    - tar czf ${PROJECT}_debugger-dumps.tar.gz /tmp/debugger || true
    - mkdir -p ${PROJECT}-test-results
    - (cd /exploration-tests/${PROJECT} && find . -path "*/build/test-results/*/TEST-*.xml" -exec cp --parents {} $CI_PROJECT_DIR/${PROJECT}-test-results/ \;) || true
  artifacts:
    when: always
    paths:
      - "*_agent.log.gz"
      - "*_debugger-dumps.tar.gz"
      - "${PROJECT}-test-results/"
    reports:
      junit:
        - "${PROJECT}-test-results/**/TEST-*.xml"
