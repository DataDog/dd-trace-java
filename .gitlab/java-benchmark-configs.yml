# Test the unmerged image-cache harness from apm-sdks-benchmarks PR #356.
.parallel-benchmark-template:
  variables:
    APM_SDKS_BENCHMARKS_BRANCH: "alexeyk/cache-java-benchmark-images"

# Benchmarks run on master, merge queue, or when manually triggered.
.parallel_benchmark_rules: &parallel_benchmark_rules
  - if: '$POPULATE_CACHE'
    when: never
  - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/'
    when: manual
    allow_failure: true
  - if: '$CI_COMMIT_BRANCH == "master"'
    when: on_success
    interruptible: false
  - if: '$CI_COMMIT_BRANCH =~ /^mq-working-branch-/'
    when: on_success
    interruptible: true
  - if: '$CI_COMMIT_BRANCH =~ /^gh-readonly-queue\//'
    when: on_success
    interruptible: true
  - when: manual
    interruptible: true
    allow_failure: true

# Startup benchmarks run on PRs as well
.parallel_startup_benchmark_rules: &parallel_startup_benchmark_rules
  - if: '$POPULATE_CACHE'
    when: never
  - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/'
    when: manual
    allow_failure: true
  - if: '$CI_COMMIT_BRANCH == "master"'
    when: on_success
    interruptible: false
  - if: '$CI_COMMIT_BRANCH =~ /^mq-working-branch-/'
    when: on_success
    interruptible: true
  - if: '$CI_COMMIT_BRANCH =~ /^gh-readonly-queue\//'
    when: on_success
    interruptible: true
  - when: on_success
    interruptible: true
    allow_failure: true

# Run publishers whenever their consumers run automatically, including PR startup
# benchmarks and merge-queue benchmarks. DaCapo remains manual on PR branches.
build-java-spring-petclinic-image:
  rules: *parallel_startup_benchmark_rules

build-java-insecure-bank-image:
  rules: *parallel_startup_benchmark_rules

build-java-dacapo-image:
  rules: *parallel_benchmark_rules

# Ensure the tracer artifact publish finishes before the benchmark jobs start.
linux-java-spring-petclinic-parallel:
  needs:
    - job: publish-artifacts-to-s3
    - job: build-java-spring-petclinic-image
      artifacts: true
  rules:
    - if: '$POPULATE_CACHE'
      when: never
    - !reference [.parallel-benchmark-template, rules]

linux-java-insecure-bank-load-parallel:
  needs:
    - job: publish-artifacts-to-s3
    - job: build-java-insecure-bank-image
      artifacts: true
  rules: *parallel_benchmark_rules

linux-java-spring-petclinic-load-parallel:
  needs:
    - job: publish-artifacts-to-s3
    - job: build-java-spring-petclinic-image
      artifacts: true
  rules: *parallel_benchmark_rules

linux-java-spring-petclinic-sca-load-parallel:
  needs:
    - job: publish-artifacts-to-s3
    - job: build-java-spring-petclinic-image
      artifacts: true
  rules: *parallel_benchmark_rules

linux-java-insecure-bank-startup-parallel:
  needs:
    - job: publish-artifacts-to-s3
    - job: build-java-insecure-bank-image
      artifacts: true
  rules: *parallel_startup_benchmark_rules

linux-java-spring-petclinic-startup-parallel:
  needs:
    - job: publish-artifacts-to-s3
    - job: build-java-spring-petclinic-image
      artifacts: true
  rules: *parallel_startup_benchmark_rules

linux-java-dacapo-parallel-1:
  needs:
    - job: publish-artifacts-to-s3
    - job: build-java-dacapo-image
      artifacts: true
  rules: *parallel_benchmark_rules

linux-java-dacapo-parallel-2:
  needs:
    - job: publish-artifacts-to-s3
    - job: build-java-dacapo-image
      artifacts: true
  rules: *parallel_benchmark_rules
