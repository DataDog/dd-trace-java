# Benchmarks run on master, merge queue, or when manually triggered.
.parallel_benchmark_rules: &parallel_benchmark_rules
  - if: '$POPULATE_CACHE'
    when: never
  - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/'
    when: manual
    allow_failure: true
  - if: '$CI_COMMIT_BRANCH == "master"'
    when: on_success
    interruptible: false
  - if: '$CI_COMMIT_BRANCH =~ /^mq-working-branch-/'
    when: on_success
    interruptible: true
  - if: '$CI_COMMIT_BRANCH =~ /^gh-readonly-queue\//'
    when: on_success
    interruptible: true
  - when: manual
    interruptible: true
    allow_failure: true

# Startup benchmarks run on PRs as well
.parallel_startup_benchmark_rules: &parallel_startup_benchmark_rules
  - if: '$POPULATE_CACHE'
    when: never
  - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/'
    when: manual
    allow_failure: true
  - if: '$CI_COMMIT_BRANCH == "master"'
    when: on_success
    interruptible: false
  - if: '$CI_COMMIT_BRANCH =~ /^mq-working-branch-/'
    when: on_success
    interruptible: true
  - if: '$CI_COMMIT_BRANCH =~ /^gh-readonly-queue\//'
    when: on_success
    interruptible: true
  - when: on_success
    interruptible: true
    allow_failure: true

# Ensure the tracer artifact publish finishes before the benchmark jobs start.
linux-java-spring-petclinic-parallel:
  needs: ["publish-artifacts-to-s3"]
  # TODO: stability-test-only overrides, revert before merging.
  # The upstream template's rules fall through to `when: manual` off the default
  # branch, which would leave every stability sample unplayed. Force it to run.
  # The other benchmark families keep those rules and so stay manual, which is
  # what excludes them from the measurement without breaking their SLO jobs'
  # `needs:` (a `when: never` job is absent from the pipeline, and GitLab
  # rejects a `needs:` on an absent job).
  rules:
    - if: '$POPULATE_CACHE'
      when: never
    - when: on_success
  # A retried sample is a re-roll that hides exactly the flakiness being measured,
  # so each sample must stand on its first result.
  retry: 0

linux-java-insecure-bank-load-parallel:
  needs: ["publish-artifacts-to-s3"]
  rules: *parallel_benchmark_rules

linux-java-spring-petclinic-load-parallel:
  needs: ["publish-artifacts-to-s3"]
  rules: *parallel_benchmark_rules

linux-java-spring-petclinic-sca-load-parallel:
  needs: ["publish-artifacts-to-s3"]
  rules: *parallel_benchmark_rules

linux-java-insecure-bank-startup-parallel:
  needs: ["publish-artifacts-to-s3"]
  rules: *parallel_startup_benchmark_rules

linux-java-spring-petclinic-startup-parallel:
  needs: ["publish-artifacts-to-s3"]
  rules: *parallel_startup_benchmark_rules

linux-java-dacapo-parallel-1:
  needs: ["publish-artifacts-to-s3"]
  rules: *parallel_benchmark_rules

linux-java-dacapo-parallel-2:
  needs: ["publish-artifacts-to-s3"]
  rules: *parallel_benchmark_rules
